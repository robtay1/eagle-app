<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eagle AI Caddie</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  margin:0;
  background:black;
  color:white;
  font-family:-apple-system;
  text-align:center;
}

#map {
  height:50vh;
  width:100%;
}

.info { font-size:20px; margin:5px; }
#score { font-size:40px; margin:10px; }

button {
  width:90%;
  padding:15px;
  margin:8px;
  border:none;
  border-radius:10px;
  background:limegreen;
  color:black;
  font-size:18px;
}
</style>
</head>

<body>

<h2>🏌️ Eagle AI Caddie</h2>

<div id="map"></div>

<div class="info" id="distance">Distance: --</div>
<div class="info" id="club">Club: --</div>
<div id="score">Score: 0</div>

<button id="startBtn">⛳ Start Hole</button>
<button id="shotBtn">+ Shot</button>

<script>
let map = L.map('map').setView([51.505, -0.09], 15);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

let userMarker = null;
let holeMarker = null;
let score = 0;

// ✅ BUTTONS (fixes your broken clicks)
document.getElementById("startBtn").onclick = startHole;
document.getElementById("shotBtn").onclick = addShot;

// ✅ STABLE GPS LOOP (works on iPhone)
function updatePosition() {
  navigator.geolocation.getCurrentPosition(function(pos) {

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    map.setView([lat, lng], 17);

    if (!userMarker) {
      userMarker = L.marker([lat, lng]).addTo(map);
    } else {
      userMarker.setLatLng([lat, lng]);
    }

    if (holeMarker) {
      let distance = map.distance(
        userMarker.getLatLng(),
        holeMarker.getLatLng()
      );

      document.getElementById("distance").innerText =
        "Distance: " + Math.round(distance) + " m";

      let club = "Driver";
      if (distance < 200) club = "Iron";
      if (distance < 100) club = "Wedge";
      if (distance < 20) club = "Putter";

      document.getElementById("club").innerText =
        "Club: " + club;
    }

  });
}

// 🔥 Run every 2 seconds (THIS is the reliable fix)
setInterval(updatePosition, 2000);

// ⛳ Start Hole (no duplicates)
function startHole() {
  if (!userMarker) return;

  if (holeMarker) {
    map.removeLayer(holeMarker);
  }

  let pos = userMarker.getLatLng();
  holeMarker = L.marker([pos.lat + 0.0005, pos.lng]).addTo(map);

  document.getElementById("distance").innerText = "Distance: --";
  document.getElementById("club").innerText = "Club: --";
}

// ➕ Shot
function addShot() {
  score++;
  document.getElementById("score").innerText = "Score: " + score;
}
</script>

</body>
</html>
