<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eagle AI Caddie</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:-apple-system; background:#000; color:white; }
#map { height:100vh; }

/* HEADER */
.header {
position:absolute; top:0; width:100%;
text-align:center;
background:rgba(0,0,0,0.5);
padding:10px;
font-weight:bold;
}

.subheader {
position:absolute; top:45px; width:100%;
text-align:center;
background:rgba(0,0,0,0.4);
padding:6px;
}

/* FLOATING BUTTONS */
.floating {
position:absolute;
bottom:260px;
left:50%;
transform:translateX(-50%);
display:flex; gap:10px;
z-index:1000;
}

.floating button {
background:#1c1c1c;
border:none;
padding:10px 18px;
border-radius:25px;
color:white;
font-weight:600;
box-shadow:0 4px 10px rgba(0,0,0,0.5);
}

/* AI CARD */
.ai-card {
position:absolute;
bottom:110px;
left:10px;
right:10px;
background:rgba(0,0,0,0.85);
border-radius:20px;
padding:18px;
z-index:1000;
}

.ai-title {
font-size:30px;
font-weight:bold;
margin-bottom:10px;
}

/* BOTTOM BAR */
.bottom-bar {
position:absolute;
bottom:0;
width:100%;
display:flex;
z-index:1000;
}

.btn {
flex:1;
padding:16px;
text-align:center;
font-weight:bold;
}

.green { background:#00c853; }
.red { background:#d50000; }
.center { background:#111; }

/* ARROWS */
.arrow {
position:absolute;
top:50%;
transform:translateY(-50%);
background:rgba(0,0,0,0.6);
padding:10px;
border-radius:50%;
z-index:1000;
}

.left { left:10px; }
.right { right:10px; }

/* SCORECARD */
.scorecard {
position:fixed;
right:-100%;
top:0;
width:100%;
height:100%;
background:#111;
transition:0.3s;
overflow:auto;
padding:20px;
z-index:2000;
}

.scorecard.open { right:0; }

table {
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th, td {
border:1px solid #333;
padding:6px;
text-align:center;
}

input, select {
width:100%;
background:#222;
border:none;
color:white;
padding:4px;
}

/* BUTTON */
.score-btn {
position:absolute;
bottom:320px;
left:50%;
transform:translateX(-50%);
z-index:1000;
}

</style>
</head>

<body>

<div id="map"></div>

<div class="header">🏌️ Eagle AI Caddie</div>
<div class="subheader">Hole 1 • Par 4 • 400y</div>

<div class="floating">
<button onclick="setPin()">📍 Set Pin</button>
<button onclick="clearShots()">🧹 Clear Shots</button>
</div>

<div class="score-btn">
<button onclick="toggleScorecard()">📊 Scorecard</button>
</div>

<div class="ai-card">
<div>AI Caddie Advice</div>
<div class="ai-title" id="club">--</div>
<div id="distanceText">--</div>
<div>Wind: 5mph →</div>
<div>Aim center</div>
</div>

<div class="bottom-bar">
<div class="btn green" onclick="addShot()">+ Add Shot</div>
<div class="btn center" id="score">0 Stroke</div>
<div class="btn red" onclick="removeShot()">- Remove</div>
</div>

<div class="arrow left" onclick="prevHole()">⬅️</div>
<div class="arrow right" onclick="nextHole()">➡️</div>

<div class="scorecard" id="scorecard">
<h2>Virtual Scorecard</h2>

<input placeholder="Course Name"><br><br>
<input placeholder="Handicap Index">
<input placeholder="Playing Handicap">

<table id="card">
<tr>
<th>Hole</th><th>Par</th><th>SI</th>
<th>White</th><th>Yellow</th><th>Red</th>
<th>FW</th><th>GIR</th><th>Putts</th><th>Total</th>
</tr>
</table>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map = L.map('map').setView([51.5,-0.1],18);

// SATELLITE
L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png').addTo(map);

let userMarker, pinMarker;
let rings = [];
let shots = [];
let score = 0;

// LOCATION
navigator.geolocation.watchPosition(pos=>{
let lat = pos.coords.latitude;
let lng = pos.coords.longitude;

if(!userMarker){
userMarker = L.circleMarker([lat,lng],{
radius:8, color:'#00bfff', fillOpacity:1
}).addTo(map);

map.setView([lat,lng],18);
}else{
userMarker.setLatLng([lat,lng]);
}

drawRings();
updateDistance();
});

// SET PIN
function setPin(){
let center = map.getCenter();

if(pinMarker) map.removeLayer(pinMarker);

pinMarker = L.marker(center).addTo(map);

drawRings();
updateDistance();
}

// RINGS
function drawRings(){
rings.forEach(r=>map.removeLayer(r));
rings=[];

if(!pinMarker) return;

[50,100,150].forEach(d=>{
let ring = L.circle(pinMarker.getLatLng(),{
radius:d,
color:'white',
fill:false,
opacity:0.3
}).addTo(map);

rings.push(ring);
});
}

// DISTANCE
function updateDistance(){
if(!userMarker || !pinMarker) return;

let d = map.distance(userMarker.getLatLng(), pinMarker.getLatLng());

document.getElementById("distanceText").innerText =
Math.round(d)+" m to pin";

let club = "Driver";
if(d<150) club="9 Iron";
if(d<100) club="Wedge";

document.getElementById("club").innerText = club;
}

// SHOTS
function addShot(){
if(!userMarker || !pinMarker) return;

let line = L.polyline([
userMarker.getLatLng(),
pinMarker.getLatLng()
], {dashArray:'5,5', color:'white'}).addTo(map);

shots.push(line);
score++;
document.getElementById("score").innerText = score+" Stroke";
}

function removeShot(){
if(shots.length){
map.removeLayer(shots.pop());
score--;
document.getElementById("score").innerText = score+" Stroke";
}
}

function clearShots(){
shots.forEach(s=>map.removeLayer(s));
shots=[];
score=0;
document.getElementById("score").innerText = "0 Stroke";
}

// SCORECARD
function toggleScorecard(){
document.getElementById("scorecard").classList.toggle("open");
}

// NAV
function prevHole(){ alert("Previous Hole"); }
function nextHole(){ alert("Next Hole"); }

// BUILD TABLE
for(let i=1;i<=18;i++){
let row = "<tr>";
row += `<td>${i}</td>`;
row += `<td><input></td>`;
row += `<td><input></td>`;
row += `<td><input></td>`;
row += `<td><input></td>`;
row += `<td><input></td>`;
row += `<td><select><option>Y</option><option>N</option></select></td>`;
row += `<td><select><option>Y</option><option>N</option></select></td>`;
row += `<td><input></td>`;
row += `<td><input></td>`;
row += "</tr>";

document.getElementById("card").innerHTML += row;
}
</script>

</body>
</html>
