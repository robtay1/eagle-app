<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eagle AI Caddie</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:-apple-system; background:black; color:white; }

#map {
  position:absolute;
  height:100vh;
  width:100%;
}

/* HEADER */
.header {
  position:absolute;
  top:0;
  width:100%;
  text-align:center;
  padding:14px;
  background:rgba(0,0,0,0.6);
  font-weight:bold;
  z-index:1000;
}

.holebar {
  position:absolute;
  top:50px;
  width:100%;
  text-align:center;
  padding:6px;
  background:rgba(0,0,0,0.5);
  z-index:1000;
}

/* MAP BUTTONS */
.mapBtns {
  position:absolute;
  bottom:260px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
  z-index:1000;
}

.mapBtns button {
  background:#333;
  color:white;
  border:none;
  padding:10px 14px;
  border-radius:10px;
}

/* DISTANCE STRIP */
.strip {
  position:absolute;
  bottom:220px;
  width:100%;
  text-align:center;
  background:rgba(0,0,0,0.6);
  padding:6px;
  z-index:1000;
}

/* AI CARD */
.card {
  position:absolute;
  bottom:110px; /* ✅ FIXED POSITION */
  left:10px;
  right:10px;
  background:#1c1c1c;
  border-radius:20px;
  padding:18px;
  z-index:1000;
  box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
}

.card h2 {
  font-size:34px;
  margin:0;
}

.card ul {
  margin-top:12px;
  font-size:15px;
}

/* BOTTOM BUTTONS */
.bottom {
  position:absolute;
  bottom:0;
  width:100%;
  display:flex;
  z-index:1000;
}

.bottom button {
  flex:1;
  padding:18px;
  border:none;
  font-weight:bold;
  font-size:16px;
}

.green { background:#2ecc71; }
.red { background:#e74c3c; }
.center { background:black; color:white; }

/* LABELS */
.label {
  background:black;
  color:white;
  padding:2px 6px;
  border-radius:6px;
  font-size:12px;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="header">🏌️ Eagle AI Caddie</div>
<div class="holebar">Hole 1 • Par 4 • 400y</div>

<div class="mapBtns">
  <button onclick="setPin()">📍 Set Pin</button>
  <button onclick="clearShots()">🧹 Clear</button>
</div>

<div class="strip" id="strip">Distance to Pin: --</div>

<div class="card">
  <div>AI Caddie Advice</div>
  <h2 id="club">--</h2>
  <ul id="advice">
    <li>Set pin to begin</li>
  </ul>
</div>

<div class="bottom">
  <button class="green" onclick="addShot()">+ Add Shot</button>
  <button class="center" id="score">0 Stroke</button>
  <button class="red" onclick="removeShot()">- Remove</button>
</div>

<script>
let map = L.map('map');

// 🛰️ SATELLITE MAP
L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 19 }
).addTo(map);

let userMarker, holeMarker;
let holePos = null;

let rings = [];
let labels = [];
let guideLine = null;
let shots = [];
let shotLines = [];

// 📍 GPS TRACKING
function updateGPS() {
  navigator.geolocation.getCurrentPosition(pos => {

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    if (!userMarker) {
      userMarker = L.marker([lat,lng]).addTo(map).bindPopup("YOU").openPopup();
      map.setView([lat,lng],18);
    } else {
      userMarker.setLatLng([lat,lng]);
    }

    if (holePos) {

      let d = Math.round(map.distance([lat,lng], holePos));

      let club = "Driver";
      if (d < 200) club = "7 Iron";
      if (d < 140) club = "9 Iron";
      if (d < 100) club = "Wedge";

      document.getElementById("club").innerText = club;

      document.getElementById("strip").innerText =
        "Distance to Pin: " + d + "m";

      document.getElementById("advice").innerHTML = `
        <li>${d}m to pin</li>
        <li>Wind adjusted: ${d+5}m</li>
        <li>Aim center</li>
      `;

      // CLEAR OLD RINGS
      rings.forEach(r => map.removeLayer(r));
      labels.forEach(l => map.removeLayer(l));
      rings = [];
      labels = [];

      // DRAW RINGS
      [50,100,150].forEach(radius => {

        let circle = L.circle(holePos, {
          radius: radius,
          color: 'white',
          weight: 2,
          fill:false,
          opacity:0.7
        }).addTo(map);

        rings.push(circle);

        let label = L.marker([
          holePos[0],
          holePos[1] + (radius / 111320)
        ], {
          icon: L.divIcon({
            className:'label',
            html: radius + "m"
          })
        }).addTo(map);

        labels.push(label);
      });

      // GUIDE LINE
      if (guideLine) map.removeLayer(guideLine);
      guideLine = L.polyline([[lat,lng], holePos], {
        color:'white',
        weight:3,
        dashArray:'8,8'
      }).addTo(map);
    }

  });
}

setInterval(updateGPS,2000);

// 📍 SET PIN
function setPin() {
  map.once('click', e => {
    holePos = [e.latlng.lat, e.latlng.lng];

    if (holeMarker) map.removeLayer(holeMarker);
    holeMarker = L.marker(holePos).addTo(map);
  });
}

// 🟡 ADD SHOT
function addShot() {
  if (!userMarker || !holePos) return;

  let pos = userMarker.getLatLng();

  let line = L.polyline([pos, holePos], {
    color:'yellow',
    weight:4
  }).addTo(map);

  shotLines.push(line);
  shots.push(1);

  document.getElementById("score").innerText =
    shots.length + " Stroke";
}

// 🔴 REMOVE SHOT
function removeShot() {
  if (shotLines.length === 0) return;

  map.removeLayer(shotLines.pop());
  shots.pop();

  document.getElementById("score").innerText =
    shots.length + " Stroke";
}

// 🧹 CLEAR
function clearShots() {
  shotLines.forEach(l => map.removeLayer(l));
  shotLines = [];
  shots = [];

  document.getElementById("score").innerText = "0 Stroke";
}
</script>

</body>
</html>
