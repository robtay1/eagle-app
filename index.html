<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eagle AI Caddie</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:-apple-system; background:black; color:white; }
#map { position:absolute; height:100vh; width:100%; }

/* HEADER */
.header {
  position:absolute;
  top:0;
  width:100%;
  text-align:center;
  padding:14px;
  background:rgba(0,0,0,0.6);
  z-index:1000;
}

.holebar {
  position:absolute;
  top:50px;
  width:100%;
  text-align:center;
  padding:6px;
  background:rgba(0,0,0,0.5);
  z-index:1000;
}

/* NAV */
.nav {
  position:absolute;
  bottom:330px;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:0 20px;
  z-index:1000;
}

.nav button {
  background:rgba(0,0,0,0.7);
  color:white;
  border:none;
  padding:8px 14px;
  border-radius:10px;
}

/* FLOATING BUTTONS */
.mapBtns {
  position:absolute;
  bottom:260px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:12px;
  z-index:1000;
}

.mapBtns button {
  background:rgba(30,30,30,0.9);
  color:white;
  border:none;
  padding:12px 18px;
  border-radius:12px;
  font-weight:bold;
  box-shadow:0 4px 10px rgba(0,0,0,0.5);
}

/* STRIP */
.strip {
  position:absolute;
  bottom:220px;
  width:100%;
  text-align:center;
  background:rgba(0,0,0,0.6);
  padding:6px;
  font-size:14px;
  z-index:1000;
}

/* CARD */
.card {
  position:absolute;
  bottom:110px;
  left:10px;
  right:10px;
  background:#1c1c1c;
  border-radius:20px;
  padding:18px;
  z-index:1000;
  box-shadow:0 -5px 20px rgba(0,0,0,0.6);
}

.card h2 {
  font-size:36px;
  margin:5px 0;
}

.card ul {
  margin-top:10px;
  font-size:15px;
  line-height:1.6;
}

/* BOTTOM */
.bottom {
  position:absolute;
  bottom:0;
  width:100%;
  display:flex;
  z-index:1000;
}

.bottom button {
  flex:1;
  padding:18px;
  border:none;
  font-weight:bold;
  font-size:16px;
}

.green { background:#2ecc71; }
.red { background:#e74c3c; }
.center { background:black; color:white; }

/* LABELS */
.label {
  background:rgba(0,0,0,0.8);
  color:white;
  padding:3px 8px;
  border-radius:8px;
  font-size:12px;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="header">🏌️ Eagle AI Caddie</div>
<div class="holebar" id="holeText"></div>

<div class="nav">
  <button onclick="prevHole()">⬅ Hole</button>
  <button onclick="nextHole()">Hole ➡</button>
</div>

<div class="mapBtns">
  <button onclick="setPin()">📍 Set Pin</button>
  <button onclick="clearShots()">🧹 Clear Shots</button>
</div>

<div class="strip" id="strip">Distance to Pin: --</div>

<div class="card">
  <div>AI Caddie Advice</div>
  <h2 id="club">--</h2>
  <ul id="advice">
    <li>Set pin to begin</li>
  </ul>
</div>

<div class="bottom">
  <button class="green" onclick="addShot()">+ Add Shot</button>
  <button class="center" id="score">0 Stroke</button>
  <button class="red" onclick="removeShot()">- Remove</button>
</div>

<script>
let map = L.map('map');

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{ maxZoom: 19 }
).addTo(map);

/* ICONS */
let userIcon = L.divIcon({
  html:'<div style="width:14px;height:14px;background:#00aaff;border-radius:50%;border:3px solid white;"></div>',
  iconSize:[20,20]
});

let flagIcon = L.divIcon({
  html:'🏁',
  iconSize:[20,20]
});

/* COURSE */
let holes = [
  {par:4, yards:400},
  {par:3, yards:160},
  {par:5, yards:520}
];

let currentHole = 0;

function updateHoleUI() {
  let h = holes[currentHole];
  document.getElementById("holeText").innerText =
    `Hole ${currentHole+1} • Par ${h.par} • ${h.yards}y`;
}
updateHoleUI();

/* NAV */
function nextHole() {
  currentHole = (currentHole + 1) % holes.length;
  resetHole();
}

function prevHole() {
  currentHole = (currentHole - 1 + holes.length) % holes.length;
  resetHole();
}

function resetHole() {
  updateHoleUI();
  clearShots();
  holePos = null;
  if (holeMarker) map.removeLayer(holeMarker);
}

/* GAME */
let userMarker, holeMarker, holePos=null;
let rings=[], labels=[], guideLine=null;
let shots=[], shotLines=[];

function updateGPS() {
navigator.geolocation.getCurrentPosition(pos => {

let lat = pos.coords.latitude;
let lng = pos.coords.longitude;

if (!userMarker) {
  userMarker = L.marker([lat,lng], {icon:userIcon}).addTo(map);
  map.setView([lat,lng],18);
} else {
  userMarker.setLatLng([lat,lng]);
}

if (holePos) {

  let d = Math.round(map.distance([lat,lng], holePos));

  document.getElementById("strip").innerText =
    "Distance to Pin: " + d + "m";

  let club =
    d < 100 ? "Wedge" :
    d < 140 ? "9 Iron" :
    d < 200 ? "7 Iron" : "Driver";

  document.getElementById("club").innerText = club;

  document.getElementById("advice").innerHTML = `
    <li>${d}m to pin</li>
    <li>Wind adjusted: ${d+5}m</li>
    <li>Aim center</li>
  `;

  rings.forEach(r => map.removeLayer(r));
  labels.forEach(l => map.removeLayer(l));
  rings=[]; labels=[];

  [50,100,150].forEach(radius => {

    let circle = L.circle(holePos, {
      radius: radius,
      color:'white',
      weight:2,
      fill:false,
      opacity:0.5
    }).addTo(map);

    rings.push(circle);

    let label = L.marker([
      holePos[0],
      holePos[1] + (radius / 111320)
    ], {
      icon: L.divIcon({
        className:'label',
        html: radius+"m"
      })
    }).addTo(map);

    labels.push(label);
  });

  if (guideLine) map.removeLayer(guideLine);
  guideLine = L.polyline([[lat,lng], holePos], {
    color:'white',
    weight:3,
    dashArray:'6,6',
    opacity:0.7
  }).addTo(map);
}
});
}

setInterval(updateGPS,2000);

/* PIN */
function setPin() {
map.once('click', e => {
  holePos = [e.latlng.lat, e.latlng.lng];
  if (holeMarker) map.removeLayer(holeMarker);
  holeMarker = L.marker(holePos, {icon:flagIcon}).addTo(map);
});
}

/* SHOTS */
function addShot() {
if (!userMarker || !holePos) return;

let pos = userMarker.getLatLng();

let line = L.polyline([pos, holePos], {
  color:'#00ffcc',
  weight:4
}).addTo(map);

shotLines.push(line);
shots.push(1);

document.getElementById("score").innerText =
  shots.length + " Stroke";
}

function removeShot() {
if (shotLines.length === 0) return;

map.removeLayer(shotLines.pop());
shots.pop();

document.getElementById("score").innerText =
  shots.length + " Stroke";
}

function clearShots() {
shotLines.forEach(l => map.removeLayer(l));
shotLines=[];
shots=[];
document.getElementById("score").innerText="0 Stroke";
}
</script>

</body>
</html>
