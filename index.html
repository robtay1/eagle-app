<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eagle AI Caddie</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:-apple-system; background:black; color:white; }
#map { position:absolute; height:100vh; width:100%; }

/* HEADER */
.header { position:absolute; top:0; width:100%; text-align:center; padding:14px; background:rgba(0,0,0,0.6); z-index:1000; }
.holebar { position:absolute; top:50px; width:100%; text-align:center; padding:6px; background:rgba(0,0,0,0.5); z-index:1000; }

/* WIND */
.wind { position:absolute; top:90px; right:10px; background:rgba(0,0,0,0.6); padding:6px 10px; border-radius:10px; font-size:13px; z-index:1000; }

/* NAV */
.nav { position:absolute; bottom:360px; width:100%; display:flex; justify-content:space-between; padding:0 20px; z-index:1000; }
.nav button { background:rgba(0,0,0,0.7); color:white; border:none; padding:8px 14px; border-radius:10px; }

/* FLOAT BUTTONS */
.mapBtns { position:absolute; bottom:290px; width:100%; display:flex; justify-content:center; gap:12px; z-index:1000; }
.mapBtns button {
  background:rgba(30,30,30,0.9);
  color:white;
  border:none;
  padding:12px 18px;
  border-radius:14px;
  font-weight:bold;
  box-shadow:0 6px 16px rgba(0,0,0,0.6);
}

/* STRIP */
.strip { position:absolute; bottom:250px; width:100%; text-align:center; background:rgba(0,0,0,0.6); padding:6px; }

/* CARD */
.card {
  position:absolute;
  bottom:130px;
  left:10px;
  right:10px;
  background:#1c1c1c;
  border-radius:20px;
  padding:18px;
  box-shadow:0 -5px 20px rgba(0,0,0,0.6);
}
.card h2 { font-size:38px; margin:6px 0; }

/* BOTTOM */
.bottom { position:absolute; bottom:0; width:100%; display:flex; }
.bottom button { flex:1; padding:16px; border:none; font-weight:bold; }
.green { background:#2ecc71; }
.red { background:#e74c3c; }
.blue { background:#3498db; }
.center { background:black; color:white; }

/* LABEL */
.label {
  background:rgba(0,0,0,0.85);
  padding:4px 10px;
  border-radius:10px;
  font-size:12px;
}

/* SCORECARD */
#scorecardPanel {
  position:fixed;
  top:0;
  right:-100%;
  width:95%;
  height:100%;
  background:#0f0f0f;
  z-index:2000;
  transition:0.3s;
  overflow:auto;
}
#scorecardPanel.open { right:0; }

.scoreHeader {
  padding:15px;
  display:flex;
  justify-content:space-between;
  background:#000;
  font-size:18px;
}

.scoreInputs {
  padding:10px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.scoreInputs input {
  background:#000;
  border:1px solid #444;
  color:white;
  padding:6px;
  border-radius:8px;
}

/* TABLE */
table { width:100%; border-collapse:collapse; font-size:12px; }
th, td { padding:6px; border-bottom:1px solid #222; text-align:center; }

.toggle {
  background:#222;
  border-radius:8px;
  padding:4px;
  cursor:pointer;
}
.toggle.active { background:#2ecc71; }
</style>
</head>

<body>

<div id="map"></div>

<div class="header">🏌️ Eagle AI Caddie</div>
<div class="holebar" id="holeText"></div>
<div class="wind">🌬️ 5mph →</div>

<div class="nav">
  <button onclick="prevHole()">⬅</button>
  <button onclick="nextHole()">➡</button>
</div>

<div class="mapBtns">
  <button onclick="setPin()">📍 Set Pin</button>
  <button onclick="clearShots()">🧹 Clear</button>
</div>

<div class="strip" id="strip">Distance --</div>

<div class="card">
  <div>AI Caddie</div>
  <h2 id="club">--</h2>
</div>

<div class="bottom">
  <button class="green" onclick="addShot()">+ Shot</button>
  <button class="center" id="score">0</button>
  <button class="blue" onclick="finishHole()">✔</button>
  <button class="red" onclick="removeShot()">-</button>
</div>

<button onclick="openScorecard()" style="position:absolute;top:130px;left:10px;">📊</button>

<div id="scorecardPanel">
  <div class="scoreHeader">
    Scorecard
    <button onclick="closeScorecard()">✕</button>
  </div>

  <div class="scoreInputs">
    Course <input placeholder="Enter course">
    HI <input type="number">
    PH <input type="number">
  </div>

  <table id="scoreTable"></table>
</div>

<script>
let map=L.map('map');

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{maxZoom:19}).addTo(map);

/* ICONS */
let userIcon=L.divIcon({
 html:'<div style="display:flex;align-items:center;gap:4px;"><div style="width:14px;height:14px;background:#00aaff;border-radius:50%;border:3px solid white;"></div><div>YOU</div></div>'
});
let flagIcon=L.divIcon({html:'🏁'});

/* COURSE */
let holes=[{par:4,yards:400},{par:3,yards:160},{par:5,yards:520}];
let scores=[],currentHole=0;

function updateHoleUI(){
let h=holes[currentHole];
document.getElementById("holeText").innerText=`Hole ${currentHole+1} • Par ${h.par} • ${h.yards}`;
}
updateHoleUI();

/* GAME */
let userMarker,holeMarker,holePos=null,rings=[],labels=[],shots=[],lines=[],labels2=[];

function updateGPS(){
navigator.geolocation.getCurrentPosition(p=>{
let lat=p.coords.latitude,lng=p.coords.longitude;

if(!userMarker){
userMarker=L.marker([lat,lng],{icon:userIcon}).addTo(map);
map.setView([lat,lng],18);
}else userMarker.setLatLng([lat,lng]);

if(holePos){
let d=Math.round(map.distance([lat,lng],holePos));
document.getElementById("strip").innerText="Distance "+d+"m";
document.getElementById("club").innerText=d<100?"Wedge":d<150?"9":"7/Driver";

/* RINGS */
rings.forEach(r=>map.removeLayer(r));
labels.forEach(l=>map.removeLayer(l));
rings=[];labels=[];

[50,100,150].forEach(r=>{
let c=L.circle(holePos,{radius:r,color:'white',opacity:0.3}).addTo(map);
rings.push(c);

let lab=L.marker([holePos[0],holePos[1]+(r/111320)],{
icon:L.divIcon({className:'label',html:r+"m"})
}).addTo(map);

labels.push(lab);
});
}
});
}
setInterval(updateGPS,2000);

/* PIN */
function setPin(){
map.once('click',e=>{
holePos=[e.latlng.lat,e.latlng.lng];
if(holeMarker)map.removeLayer(holeMarker);
holeMarker=L.marker(holePos,{icon:flagIcon}).addTo(map);
});
}

/* SHOTS */
function addShot(){
if(!userMarker||!holePos)return;

let s=userMarker.getLatLng();
let d=Math.round(map.distance(s,holePos));

let line=L.polyline([s,holePos],{color:'#00ffcc'}).addTo(map);
lines.push(line);

let mid=[(s.lat+holePos[0])/2,(s.lng+holePos[1])/2];
let lab=L.marker(mid,{icon:L.divIcon({className:'label',html:d+"m"})}).addTo(map);
labels2.push(lab);

shots.push(1);
document.getElementById("score").innerText=shots.length;
}

function removeShot(){
if(!lines.length)return;
map.removeLayer(lines.pop());
map.removeLayer(labels2.pop());
shots.pop();
document.getElementById("score").innerText=shots.length;
}

function clearShots(){
lines.forEach(l=>map.removeLayer(l));
labels2.forEach(l=>map.removeLayer(l));
lines=[];labels2=[];shots=[];
document.getElementById("score").innerText=0;
}

/* SCORECARD */
function openScorecard(){document.getElementById("scorecardPanel").classList.add("open");}
function closeScorecard(){document.getElementById("scorecardPanel").classList.remove("open");}

let data=Array.from({length:18},(_,i)=>({hole:i+1,par:4,fw:false,gir:false,putts:0,shots:0}));

function build(){
let html="<tr><th>H</th><th>P</th><th>FW</th><th>GIR</th><th>Putts</th><th>Shots</th></tr>";
data.forEach((h,i)=>{
html+=`<tr>
<td>${h.hole}</td>
<td>${h.par}</td>
<td class="toggle ${h.fw?'active':''}" onclick="toggleFW(${i})">${h.fw?'Y':'N'}</td>
<td class="toggle ${h.gir?'active':''}" onclick="toggleGIR(${i})">${h.gir?'Y':'N'}</td>
<td><input onchange="setPutts(${i},this.value)"></td>
<td><input onchange="setShots(${i},this.value)"></td>
</tr>`;
});

/* TOTALS */
let totalPutts=data.reduce((a,b)=>a+(+b.putts||0),0);
let totalShots=data.reduce((a,b)=>a+(+b.shots||0),0);

html+=`<tr><th>18</th><th>-</th><th>-</th><th>-</th><th>${totalPutts}</th><th>${totalShots}</th></tr>`;

document.getElementById("scoreTable").innerHTML=html;
}
build();

function toggleFW(i){data[i].fw=!data[i].fw;build();}
function toggleGIR(i){data[i].gir=!data[i].gir;build();}
function setPutts(i,v){data[i].putts=v;build();}
function setShots(i,v){data[i].shots=v;build();}
</script>

</body>
</html>
