<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EAGLE HAS LANDED</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body { margin:0; font-family:-apple-system; background:black; color:white; }
#map { position:absolute; top:0; bottom:0; width:100%; }

/* HEADER */
.header {
  position:absolute; top:0; width:100%; text-align:center;
  padding:14px; background:rgba(0,0,0,0.6); z-index:1000;
}

.holebar {
  position:absolute; top:50px; width:100%; text-align:center;
  padding:6px; background:rgba(0,0,0,0.5); z-index:1000;
}

/* BUTTONS */
.mapBtns {
  position:absolute;
  bottom:290px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
  z-index:1200;
}

.mapBtns button {
  background:rgba(30,30,30,0.9);
  color:white;
  border:none;
  padding:10px 14px;
  border-radius:12px;
  font-weight:bold;
}

/* STRIP */
.strip {
  position:absolute;
  bottom:250px;
  width:100%;
  text-align:center;
  background:rgba(0,0,0,0.6);
  padding:6px;
  z-index:1100;
}

/* CARD */
.card {
  position:absolute;
  bottom:110px;
  left:10px;
  right:10px;
  background:#1c1c1c;
  border-radius:20px;
  padding:14px;
  z-index:900;
}

.clubMain { font-size:26px; font-weight:bold; margin:8px 0; }
.caddieList div { font-size:13px; margin:4px 0; }

/* BOTTOM */
.bottom {
  position:absolute;
  bottom:0;
  width:100%;
  display:flex;
  z-index:1200;
}

.bottom button {
  flex:1;
  padding:18px;
  border:none;
  font-weight:bold;
}

.green { background:#2ecc71; }
.red { background:#e74c3c; }
.center { background:black; color:white; }

.label {
  background:black;
  padding:3px 6px;
  border-radius:6px;
}

/* PRACTICE */
.clubRow {
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

.clubRight {
  display:flex;
  gap:10px;
  align-items:center;
}

.clubRight input {
  width:60px;
  background:transparent;
  border:none;
  color:white;
  text-align:right;
}

.removeBtn {
  background:none;
  border:none;
  color:#ff6b6b;
  font-size:18px;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="header">🏌️ Eagle AI Caddie</div>
<div class="holebar">Hole 1 • Par 4 • 400y</div>

<div class="mapBtns">
<button onclick="setPin()">📍 Pin</button>
<button onclick="toggleMode()">🎯 Mode</button>
<button onclick="openScorecard()">📊 Score</button>
<button onclick="openPractice()">🎯 Practice</button>
</div>

<div class="strip" id="strip">Distance: --</div>

<div class="card">
<div class="clubMain" id="club">--</div>
<div class="caddieList">
<div>⛳ <span id="distToPin">--</span></div>
<div>🌬 Wind: <span id="wind">--</span></div>
<div>🎯 Aim: <span id="aim">Center</span></div>
<div>⚙️ Tip: <span id="tip">--</span></div>
</div>
</div>

<div class="bottom">
<button class="green" onclick="addShot()">+ Shot</button>
<button class="center" id="score">0</button>
<button class="red" onclick="removeShot()">-</button>
</div>

<!-- PRACTICE -->
<div id="practiceScreen" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:black;z-index:2000;padding:20px;overflow:auto;">
<h2>Practice</h2>
<button onclick="closePractice()">⬅ Back</button>
<input type="file" id="imgUpload">
<button onclick="handleImage()">Import</button>
<button onclick="resetClubs()">Reset</button>
<pre id="ocrOutput"></pre>
<div id="clubs"></div>
</div>

<!-- SCORECARD -->
<div id="scorecardScreen" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:black;z-index:3000;padding:15px;overflow:auto;">
<h2>Scorecard</h2>
<button onclick="closeScorecard()">⬅ Back</button>
<table style="width:100%;margin-top:10px;">
<tbody id="scoreRows"></tbody>
</table>
</div>

<script>
let map = L.map('map').setView([51.505,-0.09],13);

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{maxZoom:19}
).addTo(map);

let userMarker, holeMarker, holePos=null;
let targetMarker=null;
let guideLine=null;
let rings=[],labels=[];
let currentTarget=null;
let mode="pin";

let clubs=JSON.parse(localStorage.getItem("clubs")||"[]");
let scores=Array(18).fill(0);

/* GPS */
navigator.geolocation.watchPosition(pos=>{
let lat=pos.coords.latitude,lng=pos.coords.longitude;

if(!userMarker){
userMarker=L.marker([lat,lng]).addTo(map);
map.setView([lat,lng],18);
}else userMarker.setLatLng([lat,lng]);

update(lat,lng);
});

/* MODE TOGGLE */
function toggleMode(){
mode = mode==="pin"?"target":"pin";
currentTarget=null;
if(targetMarker) map.removeLayer(targetMarker);
}

/* TAP */
map.on('click',e=>{
if(mode==="target"){
currentTarget=[e.latlng.lat,e.latlng.lng];

if(targetMarker) map.removeLayer(targetMarker);
targetMarker=L.marker(currentTarget,{opacity:0.7}).addTo(map);
}
});

/* UPDATE */
function update(lat,lng){

let target = mode==="target" && currentTarget ? currentTarget : holePos;
if(!target) return;

let d=Math.round(map.distance([lat,lng],target));

strip.innerText="Distance: "+d+"m";
distToPin.innerText=d+"m";

/* LINE */
if(guideLine) map.removeLayer(guideLine);
guideLine=L.polyline([[lat,lng],target],{dashArray:'6,6'}).addTo(map);

/* RINGS */
if(holePos){
rings.forEach(r=>map.removeLayer(r));
labels.forEach(l=>map.removeLayer(l));
rings=[];labels=[];

[50,100,150].forEach(r=>{
rings.push(L.circle(holePos,{radius:r,color:'white',fill:false}).addTo(map));
labels.push(L.marker([holePos[0],holePos[1]+(r/111320)],{
icon:L.divIcon({className:'label',html:r+"m"})
}).addTo(map));
});
}

/* CLUB */
let best=null;
clubs.forEach(c=>{
if(!best) best=c;
else if(Math.abs(c.dist-d)<Math.abs(best.dist-d)) best=c;
});

club.innerText=best?best.name:(d>200?"Driver":"Add clubs");

/* AI */
wind.innerText=(d+6)+"m";
aim.innerText=Math.random()>0.5?"Left edge":"Center";
tip.innerText=d>180?"Take more club":"Smooth swing";
}

/* PIN */
function setPin(){
map.once('click',e=>{
holePos=[e.latlng.lat,e.latlng.lng];
currentTarget=null;
if(holeMarker) map.removeLayer(holeMarker);
holeMarker=L.marker(holePos).addTo(map);
});
}

/* SHOTS */
function addShot(){score.innerText=parseInt(score.innerText)+1;}
function removeShot(){score.innerText=Math.max(0,score.innerText-1);}

/* PRACTICE */
function renderClubs(){
let html="";
clubs.forEach(c=>{
html+=`<div class="clubRow">
<div>${c.name}</div>
<div class="clubRight">
<input value="${c.dist}" onchange="updateClub('${c.name}',this.value)">
<button class="removeBtn" onclick="removeClub('${c.name}')">✕</button>
</div>
</div>`;
});
clubsDiv.innerHTML=html;
}

function updateClub(name,val){
let c=clubs.find(x=>x.name===name);
if(c)c.dist=parseInt(val);
localStorage.setItem("clubs",JSON.stringify(clubs));
}

function removeClub(name){
clubs=clubs.filter(c=>c.name!==name);
localStorage.setItem("clubs",JSON.stringify(clubs));
renderClubs();
}

function resetClubs(){
clubs=[]; localStorage.removeItem("clubs"); renderClubs();
}

async function handleImage(){
let file=imgUpload.files[0];
if(!file) return;
const {data:{text}}=await Tesseract.recognize(file,'eng');
ocrOutput.innerText=text;
}

/* SCORECARD */
function openScorecard(){
scorecardScreen.style.display="block";
hideMain();
renderScorecard();
}

function closeScorecard(){
scorecardScreen.style.display="none";
showMain();
}

function renderScorecard(){
let html="";
for(let i=0;i<18;i++){
html+=`<tr>
<td>${i+1}</td>
<td><input value="4"></td>
<td><input value="${scores[i]}" onchange="scores[${i}]=this.value"></td>
</tr>`;
}
scoreRows.innerHTML=html;
}

/* NAV */
function openPractice(){practiceScreen.style.display="block"; hideMain();}
function closePractice(){practiceScreen.style.display="none"; showMain();}

function hideMain(){
document.querySelectorAll("#map,.header,.holebar,.mapBtns,.strip,.card,.bottom")
.forEach(el=>el.style.display="none");
}

function showMain(){
document.querySelectorAll("#map,.header,.holebar,.mapBtns,.strip,.card,.bottom")
.forEach(el=>el.style.display="block");
setTimeout(()=>map.invalidateSize(),300);
}

renderClubs();
</script>

</body>
</html>
