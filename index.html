<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EAGLE HAS LANDED</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html, body {
  margin:0;
  padding:0;
  background:black;
  font-family:-apple-system;
  color:white;
}

/* MAP */
#map {
  height:60vh;
  width:100%;
}

/* HEADER */
.header {
  position:absolute;
  top:0;
  width:100%;
  text-align:center;
  padding:12px;
  font-weight:bold;
  font-size:20px;
  background:rgba(0,0,0,0.5);
  z-index:1000;
}

.subheader {
  position:absolute;
  top:45px;
  width:100%;
  text-align:center;
  background:rgba(255,255,255,0.2);
  padding:6px;
  z-index:1000;
}

/* FLOATING BUTTONS */
.floating {
  position:absolute;
  bottom:180px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:12px;
  z-index:1000;
}

.floating button {
  background:rgba(0,0,0,0.8);
  color:white;
  border:none;
  padding:12px 18px;
  border-radius:20px;
  font-size:14px;
}

/* AI CARD */
.ai-card {
  position:absolute;
  bottom:80px;
  left:5%;
  width:90%;
  background:rgba(0,0,0,0.85);
  padding:16px;
  border-radius:16px;
  z-index:1000;
}

.ai-card h1 {
  margin:0;
  font-size:32px;
}

/* BOTTOM BAR */
.bottom-bar {
  position:absolute;
  bottom:0;
  width:100%;
  display:flex;
}

.bottom-bar button {
  flex:1;
  padding:16px;
  border:none;
  font-size:16px;
  color:white;
}

.green {background:#0f0;}
.red {background:#c00;}
.dark {background:#111;}

/* SCORECARD */
#scorecard {
  display:none;
  padding:10px;
}

table {
  width:100%;
  border-collapse:collapse;
}

th, td {
  border:1px solid #333;
  padding:6px;
  text-align:center;
}

input, select {
  width:100%;
  background:black;
  color:white;
  border:1px solid #555;
}

.top-buttons {
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

.top-buttons button {
  flex:1;
  padding:10px;
  background:#111;
  color:white;
  border:none;
  border-radius:8px;
}
</style>
</head>

<body>

<!-- MAP VIEW -->
<div id="map"></div>

<div class="header">🏌️ EAGLE HAS LANDED</div>
<div class="subheader">Hole 1 • Par 4 • 400y</div>

<div class="floating">
  <button onclick="setPin()">📍 Set Pin</button>
  <button onclick="clearShots()">🧹 Clear</button>
</div>

<div class="ai-card">
  <div>AI Caddie Advice</div>
  <h1 id="club">-</h1>
  <div id="distance">-- m to pin</div>
  <div id="wind">Wind adjusted: --</div>
  <div>Aim center</div>
</div>

<div class="bottom-bar">
  <button class="green" onclick="addShot()">+ Add Shot</button>
  <button class="dark" onclick="openScorecard()">Scorecard</button>
  <button class="red" onclick="removeShot()">- Remove</button>
</div>

<!-- SCORECARD -->
<div id="scorecard">
  <div class="top-buttons">
    <button onclick="closeScorecard()">⬅ Back to Caddie</button>
  </div>

  <h2>Virtual Scorecard</h2>

  <input placeholder="Course Name">

  <div style="display:flex; gap:10px; margin:10px 0;">
    <input placeholder="Handicap Index">
    <input placeholder="Playing Handicap">
  </div>

  <table>
    <tr>
      <th>Hole</th><th>Par</th><th>SI</th>
      <th>White</th><th>Yellow</th><th>Red</th>
      <th>FW</th><th>GIR</th><th>Putts</th><th>Total</th>
    </tr>

    <script>
    for(let i=1;i<=9;i++){
      document.write(`
      <tr>
        <td>${i}</td>
        <td><input></td>
        <td><input></td>
        <td><input></td>
        <td><input></td>
        <td><input></td>
        <td>
          <select><option>Y</option><option>N</option></select>
        </td>
        <td>
          <select><option>Y</option><option>N</option></select>
        </td>
        <td><input></td>
        <td><input></td>
      </tr>
      `);
    }
    </script>

  </table>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map = L.map('map').setView([53.8,-2.2], 18);

/* 🔥 HIGH QUALITY SATELLITE */
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19
}).addTo(map);
/* PRO MARKERS */
let player = L.circleMarker([53.8,-2.2], {
  radius:8,
  color:"#00f",
  fillColor:"#00f",
  fillOpacity:1
}).addTo(map);

let pin;
let shots = [];

/* RINGS */
function drawRings(center){
  [50,75,100].forEach(r=>{
    L.circle(center,{
      radius:r,
      color:"white",
      opacity:0.3,
      fill:false
    }).addTo(map);
  });
}

drawRings(player.getLatLng());

function setPin(){
  map.on('click', function(e){
    if(pin) map.removeLayer(pin);
    pin = L.marker(e.latlng).addTo(map);
    updateDistance();
  });
}

function updateDistance(){
  if(!pin) return;
  let d = map.distance(player.getLatLng(), pin.getLatLng());
  document.getElementById("distance").innerText =
    Math.round(d) + " m to pin";

  let club = d < 79 ? "Sand Wedge" :
             d < 115 ? "Pitching Wedge" :
             d < 130 ? "9 Iron" :
             d < 145 ? "7 Iron" : 
             d < 200 ? "7 wood" : Driver";

  document.getElementById("club").innerText = club;
}

function addShot(){
  if(!pin) return;
  let shot = L.polyline([player.getLatLng(), pin.getLatLng()],{
    dashArray:"5,5"
  }).addTo(map);
  shots.push(shot);
}

function removeShot(){
  let s = shots.pop();
  if(s) map.removeLayer(s);
}

function clearShots(){
  shots.forEach(s=>map.removeLayer(s));
  shots=[];
}

function openScorecard(){
  document.getElementById("map").style.display="none";
  document.querySelectorAll(".header,.subheader,.floating,.ai-card,.bottom-bar")
    .forEach(el=>el.style.display="none");
  document.getElementById("scorecard").style.display="block";
}

function closeScorecard(){
  document.getElementById("map").style.display="block";
  document.querySelectorAll(".header,.subheader,.floating,.ai-card,.bottom-bar")
    .forEach(el=>el.style.display="block");
  document.getElementById("scorecard").style.display="block";
  document.getElementById("scorecard").style.display="none";
}
</script>

</body>
</html>
