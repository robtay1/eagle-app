<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eagle AI Caddie</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:-apple-system; background:#000; color:white; }

#map { height:100vh; }

.header {
position:absolute; top:0; width:100%;
text-align:center; padding:10px;
background:rgba(0,0,0,0.4);
font-weight:bold;
}

.subheader {
position:absolute; top:50px; width:100%;
text-align:center;
background:rgba(0,0,0,0.4);
padding:6px;
}

.ai-card {
position:absolute; bottom:120px; left:10px; right:10px;
background:rgba(0,0,0,0.8);
border-radius:20px;
padding:20px;
}

.ai-title { font-size:28px; font-weight:bold; }

.bottom-bar {
position:absolute; bottom:0; width:100%;
display:flex;
}

.btn {
flex:1; padding:15px; text-align:center;
font-weight:bold;
}

.green { background:#0f0; color:black; }
.red { background:#f33; }

.center { background:#111; }

.floating {
position:absolute;
bottom:260px;
left:50%;
transform:translateX(-50%);
display:flex; gap:10px;
}

.floating button {
background:#222;
border:none;
padding:10px 15px;
border-radius:20px;
color:white;
}

.arrow {
position:absolute; top:50%;
background:#000a;
padding:10px;
border-radius:50%;
}

.left { left:10px; }
.right { right:10px; }

.scorecard {
position:fixed;
right:-100%;
top:0;
width:100%;
height:100%;
background:#111;
transition:0.3s;
overflow:auto;
padding:20px;
}

.scorecard.open { right:0; }

table { width:100%; border-collapse:collapse; }
td, th { border:1px solid #333; padding:5px; text-align:center; }

input, select {
width:100%;
background:#222;
border:none;
color:white;
}

.top-controls {
position:absolute;
bottom:320px;
left:50%;
transform:translateX(-50%);
}

</style>
</head>

<body>

<div id="map"></div>

<div class="header">🏌️ Eagle AI Caddie</div>
<div class="subheader">Hole 1 • Par 4 • 400y</div>

<div class="floating">
<button onclick="setPin()">📍 Set Pin</button>
<button onclick="clearShots()">🧹 Clear</button>
</div>

<div class="top-controls">
<button onclick="openScorecard()">📊 Scorecard</button>
</div>

<div class="ai-card">
<div>AI Caddie Advice</div>
<div class="ai-title" id="club">--</div>
<ul>
<li id="dist">--</li>
<li id="wind">Wind: 5mph →</li>
<li>Aim center</li>
</ul>
</div>

<div class="bottom-bar">
<div class="btn green" onclick="addShot()">+ Add Shot</div>
<div class="btn center" id="score">0 Stroke</div>
<div class="btn red" onclick="removeShot()">- Remove</div>
</div>

<div class="arrow left" onclick="prevHole()">⬅️</div>
<div class="arrow right" onclick="nextHole()">➡️</div>

<div class="scorecard" id="scorecard">

<h2>Virtual Scorecard</h2>

<input placeholder="Course Name">

<br><br>

<input placeholder="Handicap Index">
<input placeholder="Playing Handicap">

<br><br>

<table id="card">
<tr>
<th>Hole</th><th>Par</th><th>SI</th>
<th>White</th><th>Yellow</th><th>Red</th>
<th>FW</th><th>GIR</th><th>Putts</th><th>Total</th>
</tr>
</table>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map = L.map('map').setView([51.5,-0.1],18);

L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png').addTo(map);

let userMarker, pinMarker;
let shots = [];
let score = 0;

navigator.geolocation.watchPosition(pos=>{
let lat = pos.coords.latitude;
let lng = pos.coords.longitude;

if(!userMarker){
userMarker = L.circleMarker([lat,lng],{
radius:8, color:'#0af', fillOpacity:1
}).addTo(map);
map.setView([lat,lng],18);
}else{
userMarker.setLatLng([lat,lng]);
}

updateDistance();
});

function setPin(){
let center = map.getCenter();
if(pinMarker) map.removeLayer(pinMarker);

pinMarker = L.marker(center).addTo(map);
updateDistance();
}

function clearShots(){
shots.forEach(s=>map.removeLayer(s));
shots=[];
}

function addShot(){
if(!userMarker || !pinMarker) return;

let line = L.polyline([
userMarker.getLatLng(),
pinMarker.getLatLng()
], {dashArray:'5,5'}).addTo(map);

shots.push(line);
score++;
document.getElementById("score").innerText = score+" Stroke";
}

function removeShot(){
if(shots.length){
map.removeLayer(shots.pop());
score--;
document.getElementById("score").innerText = score+" Stroke";
}
}

function updateDistance(){
if(!userMarker || !pinMarker) return;

let d = map.distance(userMarker.getLatLng(), pinMarker.getLatLng());

document.getElementById("dist").innerText = Math.round(d)+" m to pin";

let club = "Driver";
if(d<150) club="9 Iron";
if(d<100) club="Wedge";

document.getElementById("club").innerText = club;
}

function openScorecard(){
document.getElementById("scorecard").classList.toggle("open");
}

function prevHole(){ alert("Previous Hole"); }
function nextHole(){ alert("Next Hole"); }

// generate rows
for(let i=1;i<=18;i++){
let row = "<tr>";
row += `<td>${i}</td>`;
row += `<td><input></td>`;
row += `<td><input></td>`;
row += `<td><input></td>`;
row += `<td><input></td>`;
row += `<td><input></td>`;
row += `<td><select><option>Y</option><option>N</option></select></td>`;
row += `<td><select><option>Y</option><option>N</option></select></td>`;
row += `<td><input></td>`;
row += `<td><input></td>`;
row += "</tr>";

document.getElementById("card").innerHTML += row;
}
</script>

</body>
</html>
