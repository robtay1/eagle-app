<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eagle AI Caddie</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  margin:0;
  font-family:-apple-system;
  background:black;
  color:white;
}

/* MAP FULLSCREEN */
#map {
  height:100vh;
  width:100%;
}

/* TOP HUD */
.hud {
  position:absolute;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.45);
  backdrop-filter:blur(14px);
  padding:14px 22px;
  border-radius:22px;
  text-align:center;
  box-shadow:0 4px 20px rgba(0,0,0,0.6);
}

.distance {
  font-size:52px;
  font-weight:800;
  color:#7CFF8A;
  line-height:1;
}

.club {
  font-size:18px;
  color:#d8ffd8;
  margin-top:4px;
}

/* BOTTOM PANEL */
.panel {
  position:absolute;
  bottom:0;
  width:100%;
  padding:16px;
  background:linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.3));
  backdrop-filter:blur(20px);
  border-top-left-radius:24px;
  border-top-right-radius:24px;
}

/* AI LINE */
.ai {
  text-align:center;
  font-size:16px;
  color:#c8ffc8;
  margin-bottom:12px;
}

/* BUTTONS */
.buttons {
  display:flex;
  gap:10px;
}

button {
  flex:1;
  padding:15px;
  border:none;
  border-radius:14px;
  background:#00c853;
  color:black;
  font-size:16px;
  font-weight:700;
}
</style>
</head>

<body>

<div id="map"></div>

<!-- TOP DISPLAY -->
<div class="hud">
  <div class="distance" id="distance">--</div>
  <div class="club" id="club">--</div>
</div>

<!-- BOTTOM -->
<div class="panel">

  <div class="ai" id="aiBox">
    Tap map to set pin
  </div>

  <div class="buttons">
    <button onclick="startHole()">⛳ Start</button>
    <button onclick="addShot()">🏌️ Shot</button>
  </div>

</div>

<script>
let map = L.map('map');

L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

let userMarker, holeMarker;
let holePosition = null;

// GPS
function updatePosition() {
  navigator.geolocation.getCurrentPosition(function(pos) {

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    if (!userMarker) {
      userMarker = L.marker([lat,lng]).addTo(map);
      map.setView([lat,lng],17);
    } else {
      userMarker.setLatLng([lat,lng]);
    }

    if (holePosition) {

      let d = Math.round(map.distance([lat,lng], holePosition));

      document.getElementById("distance").innerText = d + " m";

      let club = "Driver";
      if (d < 200) club = "Iron";
      if (d < 100) club = "Wedge";
      if (d < 20) club = "Putter";

      document.getElementById("club").innerText = club;

      // 🎯 FINAL CADDIE STYLE
      document.getElementById("aiBox").innerHTML =
        "📍 " + d + "m • Use <b>" + club + "</b>";
    }

  });
}

setInterval(updatePosition, 2000);

// START HOLE
function startHole() {
  if (!userMarker) return;

  let pos = userMarker.getLatLng();

  holePosition = [pos.lat + 0.0005, pos.lng];

  if (holeMarker) map.removeLayer(holeMarker);
  holeMarker = L.marker(holePosition).addTo(map);
}

// SHOT (placeholder)
function addShot() {
  alert("Shot tracked");
}

// SET PIN
map.on('click', function(e){
  holePosition = [e.latlng.lat, e.latlng.lng];

  if (holeMarker) map.removeLayer(holeMarker);
  holeMarker = L.marker(holePosition).addTo(map);
});
</script>

</body>
</html>
