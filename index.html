<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eagle AI Caddie</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  margin:0;
  font-family:-apple-system;
  background:#0b0b0b;
  color:white;
}

/* TOP BAR */
.topbar {
  display:flex;
  justify-content:space-between;
  padding:12px 16px;
  background:#121212;
  font-size:14px;
}

/* MAP */
#map {
  height:45vh;
}

/* CADDIE CARD */
.card {
  margin:12px;
  padding:16px;
  background:#1c1c1c;
  border-radius:16px;
  text-align:center;
}

.distance {
  font-size:40px;
  font-weight:bold;
}

.club {
  font-size:22px;
  margin:6px 0;
}

.advice {
  font-size:14px;
  color:#bbb;
}

/* BUTTON BAR */
.actions {
  display:flex;
  gap:10px;
  padding:12px;
}

button {
  flex:1;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#00c853;
  color:black;
  font-size:16px;
}
</style>
</head>

<body>

<div class="topbar">
  <div>Hole 1 • Par 4</div>
  <div>Wind: —</div>
</div>

<div id="map"></div>

<div class="card">
  <div class="distance" id="distance">--</div>
  <div class="club" id="club">--</div>
  <div class="advice" id="advice">Tap map to set hole</div>
</div>

<div class="actions">
  <button onclick="startHole()">⛳ Start</button>
  <button onclick="addShot()">+ Shot</button>
</div>

<script>
let map = L.map('map');

L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

let userMarker, holeMarker;
let holePosition = null;

function updatePosition() {
  navigator.geolocation.getCurrentPosition(function(pos) {

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    if (!userMarker) {
      userMarker = L.marker([lat,lng]).addTo(map);
      map.setView([lat,lng],17);
    } else {
      userMarker.setLatLng([lat,lng]);
    }

    if (holePosition) {
      let d = Math.round(map.distance([lat,lng], holePosition));

      document.getElementById("distance").innerText = d + " m";

      let club = "Driver";
      if (d < 200) club = "Iron";
      if (d < 100) club = "Wedge";
      if (d < 20) club = "Putter";

      document.getElementById("club").innerText = club;

      document.getElementById("advice").innerText =
        d < 120 ? "Controlled shot" : "Full swing";

      map.fitBounds([[lat,lng], holePosition], {padding:[40,40]});
    }

  });
}

setInterval(updatePosition,2000);

function startHole() {
  if (!userMarker) return;

  let pos = userMarker.getLatLng();

  holePosition = [pos.lat + 0.0005, pos.lng];

  if (holeMarker) map.removeLayer(holeMarker);
  holeMarker = L.marker(holePosition).addTo(map);
}

function addShot() {}

map.on('click', function(e){
  holePosition = [e.latlng.lat, e.latlng.lng];

  if (holeMarker) map.removeLayer(holeMarker);
  holeMarker = L.marker(holePosition).addTo(map);
});
</script>

</body>
</html>
