<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eagle AI Caddie</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  margin:0;
  font-family:-apple-system;
  background:black;
  color:white;
}

/* MAP */
#map {
  position:absolute;
  height:100vh;
  width:100%;
  z-index:1;
}

/* TOP BAR */
.topbar {
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  padding:10px 14px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
  border-radius:14px;
  z-index:1000;
  font-size:14px;
}

/* CENTER CARD (HERO) */
.hero {
  position:absolute;
  top:90px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.65);
  backdrop-filter:blur(14px);
  padding:20px 30px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 8px 30px rgba(0,0,0,0.6);
  z-index:1000;
}

.distance {
  font-size:56px;
  font-weight:800;
  color:#7CFF8A;
}

.club {
  font-size:20px;
  margin-top:6px;
}

/* CADDIE CARD */
.caddie {
  position:absolute;
  bottom:110px;
  left:10px;
  right:10px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(14px);
  padding:14px;
  border-radius:16px;
  text-align:center;
  font-size:15px;
  z-index:1000;
}

/* BUTTON BAR */
.buttons {
  position:absolute;
  bottom:20px;
  left:10px;
  right:10px;
  display:flex;
  gap:10px;
  z-index:1000;
}

button {
  flex:1;
  padding:14px;
  border:none;
  border-radius:14px;
  background:#00c853;
  color:black;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="topbar">
  <div>Hole 1 • Par 4</div>
  <div id="wind">Wind: 5 mph →</div>
</div>

<div class="hero">
  <div class="distance" id="distance">--</div>
  <div class="club" id="club">--</div>
</div>

<div class="caddie" id="aiBox">
  Set pin to begin
</div>

<div class="buttons">
  <button onclick="startHole()">⛳ Start</button>
  <button onclick="addShot()">🏌️ Shot</button>
</div>

<script>
let map = L.map('map');

L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

let userMarker, holeMarker;
let holePosition = null;

function getWind() {
  let speed = Math.floor(Math.random()*10)+3;
  return speed + " mph →";
}

function updatePosition() {
  navigator.geolocation.getCurrentPosition(function(pos) {

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    if (!userMarker) {
      userMarker = L.marker([lat,lng]).addTo(map);
      map.setView([lat,lng],17);
    } else {
      userMarker.setLatLng([lat,lng]);
    }

    if (holePosition) {

      let d = Math.round(map.distance([lat,lng], holePosition));

      document.getElementById("distance").innerText = d + " m";

      let club = "Driver";
      if (d < 200) club = "7 Iron";
      if (d < 140) club = "9 Iron";
      if (d < 100) club = "Wedge";
      if (d < 20) club = "Putter";

      document.getElementById("club").innerText = club;

      document.getElementById("wind").innerText =
        "Wind: " + getWind();

      document.getElementById("aiBox").innerHTML =
        d + "m • " + club + "<br>Aim centre";

      map.fitBounds([[lat,lng], holePosition], {padding:[60,60]});
    }

  });
}

setInterval(updatePosition, 2000);

function startHole() {
  if (!userMarker) return;

  let pos = userMarker.getLatLng();

  holePosition = [pos.lat + 0.0005, pos.lng];

  if (holeMarker) map.removeLayer(holeMarker);
  holeMarker = L.marker(holePosition).addTo(map);
}

function addShot() {}

map.on('click', function(e){
  holePosition = [e.latlng.lat, e.latlng.lng];

  if (holeMarker) map.removeLayer(holeMarker);
  holeMarker = L.marker(holePosition).addTo(map);
});
</script>

</body>
</html>
