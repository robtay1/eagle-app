<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eagle AI Caddie</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
    margin:0;
    background:black;
    color:white;
    font-family:-apple-system;
    text-align:center;
}

h2 { margin:10px; }

#map {
    height:55vh;
    width:100%;
}

.info {
    font-size:20px;
    margin:6px;
}

#score {
    font-size:40px;
    margin:10px;
}

button {
    width:90%;
    padding:15px;
    margin:8px;
    border:none;
    border-radius:10px;
    font-size:18px;
    background:limegreen;
}
</style>
</head>

<body>

<h2>🏌️ Eagle AI Caddie</h2>

<div id="map"></div>

<div class="info" id="distance">Distance: --</div>
<div class="info" id="club">Club: --</div>
<div id="score">Score: 0</div>

<button onclick="startHole()">⛳ Start Hole</button>
<button onclick="addShot()">+ Shot</button>

<script>
// INIT MAP (default view only until GPS loads)
let map = L.map('map').setView([0,0], 2);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
}).addTo(map);

// VARIABLES
let userMarker = null;
let holeMarker = null;
let currentPosition = null;
let holePosition = null;
let score = 0;

// 📍 LIVE GPS (STABLE VERSION)
navigator.geolocation.watchPosition(
    position => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        currentPosition = [lat, lng];

        // Create or update user marker
        if (!userMarker) {
            userMarker = L.marker(currentPosition).addTo(map);
        } else {
            userMarker.setLatLng(currentPosition);
        }

        // ALWAYS FOLLOW USER
        map.setView(currentPosition, 17);

        updateDistance();
    },
    error => {
        alert("Turn on location services");
        console.log(error);
    },
    { enableHighAccuracy: true }
);

// ⛳ START HOLE (simple forward target)
function startHole() {
    if (!currentPosition) return;

    holePosition = [
        currentPosition[0] + 0.0005,
        currentPosition[1] + 0.0005
    ];

    if (!holeMarker) {
        holeMarker = L.marker(holePosition).addTo(map);
    } else {
        holeMarker.setLatLng(holePosition);
    }

    updateDistance();
}

// 📏 DISTANCE + CLUB LOGIC
function updateDistance() {
    if (!currentPosition || !holePosition) return;

    const distance = map.distance(currentPosition, holePosition);

    document.getElementById("distance").innerText =
        "Distance: " + Math.round(distance) + " m";

    let club = "Driver";
    if (distance < 200) club = "Iron";
    if (distance < 100) club = "Wedge";
    if (distance < 30) club = "Putter";

    document.getElementById("club").innerText =
        "Club: " + club;
}

// 🏌️ SHOT TRACKING
function addShot() {
    score++;
    document.getElementById("score").innerText =
        "Score: " + score;
}
</script>

</body>
</html>
