<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eagle AI Caddie</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {margin:0;background:black;color:white;font-family:-apple-system;text-align:center;}
#map {height:60vh;width:100%;}
.info {font-size:20px;margin:8px;}
#score {font-size:40px;margin:10px;}
button {width:90%;padding:15px;margin:8px;border:none;border-radius:10px;background:#4CAF50;color:white;font-size:18px;}
</style>
</head>

<body>

<h2>🏌️ Eagle AI Caddie</h2>

<div id="map"></div>

<div class="info" id="distance">Distance: --</div>
<div class="info" id="club">Club: --</div>
<div id="score">Score: 0</div>

<button onclick="addShot()">+ Shot</button>
<button onclick="removeShot()">- Shot</button>

<script>
let score = 0;

function addShot(){
  score++;
  document.getElementById("score").innerText = "Score: " + score;
}

function removeShot(){
  score--;
  document.getElementById("score").innerText = "Score: " + score;
}

// MAP
var map = L.map('map').setView([51.505, -0.09], 15);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

let userLat = 51.505;
let userLng = -0.09;

let targetLat = 51.506;
let targetLng = -0.091;

// DEFAULT TARGET (will move when you tap)
let targetLat = userLat + 0.0005;
let targetLng = userLng + 0.0005;

// visible hole marker
var targetMarker = L.marker([targetLat, targetLng]).addTo(map);

// TAP MAP = SET HOLE
map.on('click', function(e) {
  targetLat = e.latlng.lat;
  targetLng = e.latlng.lng;

  targetMarker.setLatLng([targetLat, targetLng]);

  updateDistance(); // FORCE UPDATE
});
// CLICK TO MOVE TARGET
map.on('click', function(e) {
  targetLat = e.latlng.lat;
  targetLng = e.latlng.lng;

  targetMarker.setLatLng([targetLat, targetLng]);
  updateDistance();
});

// DISTANCE
function getDistance(lat1, lon1, lat2, lon2) {
  const R = 6371e3;
  const φ1 = lat1 * Math.PI/180;
  const φ2 = lat2 * Math.PI/180;
  const Δφ = (lat2-lat1) * Math.PI/180;
  const Δλ = (lon2-lon1) * Math.PI/180;

  const a =
    Math.sin(Δφ/2) * Math.sin(Δφ/2) +
    Math.cos(φ1) * Math.cos(φ2) *
    Math.sin(Δλ/2) * Math.sin(Δλ/2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

  return R * c;
}

function updateDistance(){
  let d = getDistance(userLat, userLng, targetLat, targetLng);
  document.getElementById("distance").innerText = "Distance: " + Math.round(d) + " m";

  let club = "Driver";
  if(d < 150) club = "Wedge";
  else if(d < 200) club = "Iron";

  document.getElementById("club").innerText = "Club: " + club;
}

// GPS
navigator.geolocation.watchPosition(
  function(pos){
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;

    userMarker.setLatLng([userLat, userLng]);

    // DO NOT constantly reset map zoom (this was an issue)
    // map.setView([userLat, userLng]);

    updateDistance();
  },
  function(error){
    console.log("GPS error:", error);
  },
  {
    enableHighAccuracy: true,
    maximumAge: 0,
    timeout: 5000
  }
);
</script>

</body>
</html>
