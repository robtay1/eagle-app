<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eagle AI Caddie</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:-apple-system; background:black; color:white; }
#map { position:absolute; height:100vh; width:100%; }

/* HEADER */
.header { position:absolute; top:0; width:100%; text-align:center; padding:14px; background:rgba(0,0,0,0.6); z-index:1000; }
.holebar { position:absolute; top:50px; width:100%; text-align:center; padding:6px; background:rgba(0,0,0,0.5); z-index:1000; }

/* WIND */
.wind { position:absolute; top:90px; right:10px; background:rgba(0,0,0,0.6); padding:6px 10px; border-radius:10px; font-size:13px; z-index:1000; }

/* NAV */
.nav { position:absolute; bottom:340px; width:100%; display:flex; justify-content:space-between; padding:0 20px; z-index:1000; }
.nav button { background:rgba(0,0,0,0.7); color:white; border:none; padding:8px 14px; border-radius:10px; }

/* FLOAT BUTTONS */
.mapBtns { position:absolute; bottom:270px; width:100%; display:flex; justify-content:center; gap:12px; z-index:1000; }
.mapBtns button { background:rgba(30,30,30,0.9); color:white; border:none; padding:12px 18px; border-radius:12px; font-weight:bold; box-shadow:0 4px 10px rgba(0,0,0,0.5); }

/* STRIP */
.strip { position:absolute; bottom:230px; width:100%; text-align:center; background:rgba(0,0,0,0.6); padding:6px; font-size:14px; z-index:1000; }

/* CARD */
.card { position:absolute; bottom:120px; left:10px; right:10px; background:#1c1c1c; border-radius:20px; padding:18px; z-index:1000; box-shadow:0 -5px 20px rgba(0,0,0,0.6); }
.card h2 { font-size:36px; margin:5px 0; }

/* BOTTOM */
.bottom { position:absolute; bottom:0; width:100%; display:flex; z-index:1000; }
.bottom button { flex:1; padding:16px; border:none; font-weight:bold; }
.green { background:#2ecc71; }
.red { background:#e74c3c; }
.blue { background:#3498db; }
.center { background:black; color:white; }

/* LABEL */
.label { background:rgba(0,0,0,0.8); color:white; padding:3px 8px; border-radius:8px; font-size:12px; }

/* SCORECARD PANEL */
#scorecardPanel {
  position:fixed;
  top:0;
  right:-100%;
  width:90%;
  height:100%;
  background:#111;
  z-index:2000;
  transition:0.3s;
  overflow:auto;
}
#scorecardPanel.open { right:0; }

.scoreHeader {
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:#000;
}

#openScorecard {
  position:absolute;
  top:130px;
  left:10px;
  z-index:1000;
  background:black;
  color:white;
  border:none;
  padding:10px;
  border-radius:10px;
}

table { width:100%; border-collapse:collapse; font-size:12px; }
th, td { border:1px solid #333; padding:6px; text-align:center; }

input {
  width:50px;
  background:black;
  color:white;
  border:1px solid #555;
}

.toggle {
  background:#333;
  border-radius:6px;
  padding:4px;
}
.toggle.active { background:#2ecc71; }
</style>
</head>

<body>

<div id="map"></div>

<div class="header">🏌️ Eagle AI Caddie</div>
<div class="holebar" id="holeText"></div>
<div class="wind">🌬️ 5mph →</div>

<div class="nav">
  <button onclick="prevHole()">⬅</button>
  <button onclick="nextHole()">➡</button>
</div>

<div class="mapBtns">
  <button onclick="setPin()">📍 Set Pin</button>
  <button onclick="clearShots()">🧹 Clear</button>
</div>

<div class="strip" id="strip">Distance: --</div>

<div class="card">
  <div>AI Caddie</div>
  <h2 id="club">--</h2>
  <ul id="advice"><li>Set pin</li></ul>
</div>

<div class="bottom">
  <button class="green" onclick="addShot()">+ Shot</button>
  <button class="center" id="score">0</button>
  <button class="blue" onclick="finishHole()">✔</button>
  <button class="red" onclick="removeShot()">-</button>
</div>

<button id="openScorecard" onclick="openScorecard()">📊</button>

<div id="scorecardPanel">
  <div class="scoreHeader">
    <div>Scorecard</div>
    <button onclick="closeScorecard()">✕</button>
  </div>
  <div style="padding:10px;">
    HI <input type="number"> PH <input type="number">
  </div>
  <table id="scoreTable"></table>
</div>

<script>
let map=L.map('map');
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(map);

/* ICONS */
let userIcon=L.divIcon({
 html:'<div style="display:flex;align-items:center;gap:4px;"><div style="width:12px;height:12px;background:#00aaff;border-radius:50%;border:3px solid white;"></div><div style="font-size:12px;">YOU</div></div>'
});
let flagIcon=L.divIcon({html:'🏁'});

/* COURSE */
let holes=[{par:4,yards:400},{par:3,yards:160},{par:5,yards:520}];
let scores=[],currentHole=0;

function updateHoleUI(){
let h=holes[currentHole];
let s=scores[currentHole]??"-";
document.getElementById("holeText").innerText=`Hole ${currentHole+1} • Par ${h.par} • ${h.yards}y • Score ${s}`;
}
updateHoleUI();

/* NAV */
function nextHole(){currentHole=(currentHole+1)%holes.length;resetHole();}
function prevHole(){currentHole=(currentHole-1+holes.length)%holes.length;resetHole();}
function resetHole(){clearShots();holePos=null;if(holeMarker)map.removeLayer(holeMarker);updateHoleUI();}

/* FINISH */
function finishHole(){scores[currentHole]=shots.length;nextHole();}

/* GAME */
let userMarker,holeMarker,holePos=null;
let shots=[],shotLines=[],shotLabels=[];

function updateGPS(){
navigator.geolocation.getCurrentPosition(pos=>{
let lat=pos.coords.latitude,lng=pos.coords.longitude;

if(!userMarker){
userMarker=L.marker([lat,lng],{icon:userIcon}).addTo(map);
map.setView([lat,lng],18);
}else userMarker.setLatLng([lat,lng]);

if(holePos){
let d=Math.round(map.distance([lat,lng],holePos));
document.getElementById("strip").innerText="Distance "+d+"m";
document.getElementById("club").innerText=d<100?"Wedge":d<140?"9 Iron":d<200?"7 Iron":"Driver";
}
});
}
setInterval(updateGPS,2000);

/* PIN */
function setPin(){
map.once('click',e=>{
holePos=[e.latlng.lat,e.latlng.lng];
if(holeMarker)map.removeLayer(holeMarker);
holeMarker=L.marker(holePos,{icon:flagIcon}).addTo(map);
});
}

/* ARC */
function arc(s,e){
let a=[];for(let i=0;i<=20;i++){
let t=i/20;
a.push([s.lat+(e.lat-s.lat)*t+0.0002*Math.sin(Math.PI*t),s.lng+(e.lng-s.lng)*t]);
}
return a;
}

/* SHOTS */
function addShot(){
if(!userMarker||!holePos)return;
let s=userMarker.getLatLng(),e={lat:holePos[0],lng:holePos[1]};
let line=L.polyline(arc(s,e),{color:'#00ffcc'}).addTo(map);
shotLines.push(line);

let d=Math.round(map.distance(s,[e.lat,e.lng]));
let mid=line.getLatLngs()[10];

let label=L.marker(mid,{icon:L.divIcon({className:'label',html:d+"m"})}).addTo(map);
shotLabels.push(label);

shots.push(1);
document.getElementById("score").innerText=shots.length;
}

function removeShot(){
if(!shotLines.length)return;
map.removeLayer(shotLines.pop());
map.removeLayer(shotLabels.pop());
shots.pop();
document.getElementById("score").innerText=shots.length;
}

function clearShots(){
shotLines.forEach(l=>map.removeLayer(l));
shotLabels.forEach(l=>map.removeLayer(l));
shotLines=[];shotLabels=[];shots=[];
document.getElementById("score").innerText=0;
}

/* SCORECARD */
function openScorecard(){document.getElementById("scorecardPanel").classList.add("open");}
function closeScorecard(){document.getElementById("scorecardPanel").classList.remove("open");}

let data=Array.from({length:18},(_,i)=>({hole:i+1,par:4,putts:0,shots:0}));

function build(){
let html="<tr><th>H</th><th>P</th><th>FW</th><th>GIR</th><th>Putts</th><th>Shots</th></tr>";
data.forEach((h,i)=>{
html+=`<tr>
<td>${h.hole}</td>
<td>${h.par}</td>
<td class="toggle" onclick="toggleFW(${i})">N</td>
<td class="toggle" onclick="toggleGIR(${i})">N</td>
<td><input onchange="data[${i}].putts=this.value"></td>
<td><input onchange="data[${i}].shots=this.value"></td>
</tr>`;
});
document.getElementById("scoreTable").innerHTML=html;
}
build();

function toggleFW(i){}
function toggleGIR(i){}
</script>

</body>
</html>
