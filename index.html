<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EAGLE HAS LANDED</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body { margin:0; font-family:-apple-system; background:black; color:white; }

/* MAP FIX */
#map {
  position:absolute;
  top:0;
  bottom:0;
  width:100%;
}

/* UI */
.header {
  position:absolute; top:0; width:100%; text-align:center;
  padding:14px; background:rgba(0,0,0,0.6); z-index:1000;
}

.holebar {
  position:absolute; top:50px; width:100%; text-align:center;
  padding:6px; background:rgba(0,0,0,0.5); z-index:1000;
}

.mapBtns {
  position:absolute; bottom:260px; width:100%;
  display:flex; justify-content:center; gap:12px; z-index:1000;
}

.mapBtns button {
  background:rgba(30,30,30,0.9);
  color:white; border:none; padding:12px 18px;
  border-radius:12px; font-weight:bold;
}

.strip {
  position:absolute; bottom:220px; width:100%;
  text-align:center; background:rgba(0,0,0,0.6);
  padding:6px; z-index:1000;
}

.card {
  position:absolute; bottom:98px; left:10px; right:10px;
  background:#1c1c1c; border-radius:20px;
  padding:12px 18px; z-index:1000;
}

.bottom {
  position:absolute; bottom:0; width:100%;
  display:flex; z-index:1000;
}

.bottom button { flex:1; padding:18px; border:none; font-weight:bold; }

.green { background:#2ecc71; }
.red { background:#e74c3c; }
.center { background:black; color:white; }

.label { background:black; padding:3px 6px; border-radius:6px; }

/* PRACTICE UI */
.group { margin-top:20px; }

.groupTitle {
  font-size:14px;
  opacity:0.7;
  margin-bottom:8px;
}

.clubRow {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

.clubLeft {
  display:flex;
  flex-direction:column;
}

.clubName {
  font-size:18px;
  font-weight:600;
}

.clubSub {
  font-size:12px;
  opacity:0.5;
}

.clubRight {
  display:flex;
  align-items:center;
  gap:10px;
}

.distBox {
  border:1px solid rgba(255,255,255,0.3);
  padding:6px 12px;
  border-radius:10px;
  font-weight:bold;
}

.distBox input {
  background:transparent;
  border:none;
  color:white;
  width:50px;
  text-align:right;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="header">🏌️ Eagle AI Caddie</div>
<div class="holebar">Hole 1 • Par 4 • 400y</div>

<div class="mapBtns">
<button onclick="setPin()">📍 Set Pin</button>
<button onclick="clearShots()">🧹 Clear</button>
<button onclick="openScorecard()">📊 Scorecard</button>
<button onclick="openPractice()">🎯 Practice</button>
</div>

<div class="strip" id="strip">Distance: --</div>

<div class="card">
<div>AI Caddie</div>
<h2 id="club">--</h2>
<ul id="advice"><li>Set pin</li></ul>
</div>

<div class="bottom">
<button class="green" onclick="addShot()">+ Shot</button>
<button class="center" id="score">0</button>
<button class="red" onclick="removeShot()">-</button>
</div>

<!-- PRACTICE -->
<div id="practiceScreen" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:black;z-index:2000;padding:20px;overflow:auto;">
<h2>Practice</h2>
<button onclick="closePractice()">⬅ Back</button>

<h3>Import from Toptracer</h3>
<input type="file" id="imgUpload" accept="image/*">
<button onclick="handleImage()">📷 Import</button>

<pre id="ocrOutput" style="font-size:10px;"></pre>

<div id="clubs"></div>

<input id="clubName" placeholder="Club">
<input id="clubDist" placeholder="Distance">
<button onclick="addClub()">Add</button>
</div>

<script>
let map = L.map('map').setView([51.505,-0.09],13);

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{maxZoom:19}
).addTo(map);

let userMarker, holeMarker, holePos=null;
let shots=[],shotLines=[];

/* NAV */
function openPractice(){ document.getElementById("practiceScreen").style.display="block"; hideMain(); }
function closePractice(){ document.getElementById("practiceScreen").style.display="none"; showMain(); }

function hideMain(){
document.querySelectorAll("#map,.header,.holebar,.mapBtns,.strip,.card,.bottom")
.forEach(el=>el.style.display="none");
}
function showMain(){
document.querySelectorAll("#map,.header,.holebar,.mapBtns,.strip,.card,.bottom")
.forEach(el=>el.style.display="block");
setTimeout(()=>map.invalidateSize(),500);
}

/* GPS */
navigator.geolocation.watchPosition(pos=>{
let lat=pos.coords.latitude,lng=pos.coords.longitude;

if(!userMarker){
userMarker=L.marker([lat,lng]).addTo(map);
map.setView([lat,lng],18);
}else userMarker.setLatLng([lat,lng]);

if(holePos){
let d=Math.round(map.distance([lat,lng],holePos));
document.getElementById("strip").innerText="Distance: "+d+"m";

let club="--";
if(clubs.length>0){
let adjusted=d+5;
let best=clubs.reduce((p,c)=>{
let ps=Math.abs(p.dist-adjusted)+(p.dispersion||20);
let cs=Math.abs(c.dist-adjusted)+(c.dispersion||20);
return cs<ps?c:p;
});
club=best.name;
}else club="Add clubs";

document.getElementById("club").innerText=club;
}
});

/* MAP */
function setPin(){
map.once('click',e=>{
holePos=[e.latlng.lat,e.latlng.lng];
if(holeMarker) map.removeLayer(holeMarker);
holeMarker=L.marker(holePos).addTo(map);
});
}

/* CLUB DATA */
let clubs = JSON.parse(localStorage.getItem("clubs") || "[]");

/* ICONS */
function getClubIcon(name){
name=name.toLowerCase();
if(name.includes("driver")) return "🏌️‍♂️";
if(name.includes("wood")) return "🪵";
if(name.includes("iron")) return "⛳";
if(name.includes("wedge")) return "🔻";
return "🏌️";
}

/* OCR */
async function handleImage(){
let file=document.getElementById("imgUpload").files[0];
if(!file) return alert("Upload image");

const {data:{text}}=await Tesseract.recognize(file,'eng');
document.getElementById("ocrOutput").innerText=text;

let parsed=parseToptracer(text);
previewImport(parsed);
}

function parseToptracer(text){
let lines=text.split('\n');
let res=[];

lines.forEach(l=>{
let m=l.match(/([A-Za-z0-9\s]+)\s+(\d{2,3})/);
if(m){
let name=cleanClubName(m[1]);
let dist=parseInt(m[2]);
if(dist>50 && dist<350) res.push({name,dist});
}
});
return res;
}

function cleanClubName(name){
name=name.toLowerCase();
if(name.includes("driver")) return "Driver";
if(name.includes("wood")) return name.match(/\d/)?name.match(/\d/)[0]+"-wood":"Wood";
if(name.match(/[5-9]/)) return name.match(/[5-9]/)[0]+"-iron";
if(name.includes("pw")) return "Pitching Wedge";
return name;
}

function previewImport(data){
let html=`<div style="background:#1f3c2c;padding:10px;border-radius:10px;">✅ ${data.length} clubs detected</div>`;
data.forEach((c,i)=>{
html+=`<div><input value="${c.name}" id="n${i}"><input value="${c.dist}" id="d${i}"></div>`;
});
html+=`<button onclick="confirmImport(${data.length})">Save</button>`;
document.getElementById("clubs").innerHTML=html;
}

function confirmImport(n){
for(let i=0;i<n;i++){
let name=document.getElementById("n"+i).value;
let dist=parseInt(document.getElementById("d"+i).value);
if(!clubs.find(c=>c.name===name)){
clubs.push({name,dist,dispersion:20});
}
}
localStorage.setItem("clubs",JSON.stringify(clubs));
renderClubs();
}

/* EDIT */
function updateClubDist(name,val){
let club=clubs.find(c=>c.name===name);
if(!club) return;
club.dist=parseInt(val);
localStorage.setItem("clubs",JSON.stringify(clubs));
}

/* RENDER */
function renderClubs(){
let groups={woods:[],irons:[],wedges:[]};

clubs.forEach(c=>{
let n=c.name.toLowerCase();
if(n.includes("wood")||n.includes("driver")) groups.woods.push(c);
else if(n.includes("iron")) groups.irons.push(c);
else groups.wedges.push(c);
});

function g(title,list){
if(!list.length) return "";
let h=`<div class="group"><div class="groupTitle">${title} (${list.length})</div>`;
list.forEach(c=>{
h+=`<div class="clubRow">
<div class="clubLeft">
<div class="clubName">${getClubIcon(c.name)} ${c.name}</div>
<div class="clubSub">Avg distance</div>
</div>
<div class="clubRight">
<div class="distBox">
<input value="${c.dist}" onchange="updateClubDist('${c.name}',this.value)"> m
</div>
</div>
</div>`;
});
return h+"</div>";
}

let html=
g("WOODS",groups.woods)+
g("IRONS",groups.irons)+
g("WEDGES",groups.wedges);

/* GAPPING */
let sorted=[...clubs].sort((a,b)=>b.dist-a.dist);
html+="<div style='margin-top:20px'><b>Gapping</b>";

for(let i=0;i<sorted.length-1;i++){
let gap=sorted[i].dist-sorted[i+1].dist;
html+=`<div style="font-size:12px;opacity:0.7">
${sorted[i].name} → ${sorted[i+1].name}: ${gap}m`;

if(gap<5) html+=" ⚠️ overlap";
if(gap>20) html+=" ⚠️ large gap";

html+="</div>";
}

html+="</div>";

document.getElementById("clubs").innerHTML=html;
}

function addClub(){
let name=document.getElementById("clubName").value;
let dist=parseInt(document.getElementById("clubDist").value);
clubs.push({name,dist,dispersion:20});
localStorage.setItem("clubs",JSON.stringify(clubs));
renderClubs();
}

renderClubs();
</script>

</body>
</html>
