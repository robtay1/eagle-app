<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eagle AI Caddie</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  margin:0;
  font-family:-apple-system;
  background:#071007;
  color:white;
}

/* MAP */
#map {
  height:52vh;
}

/* MAIN WRAP (IMPORTANT CHANGE) */
.wrap {
  position:fixed;
  bottom:0;
  width:100%;
  padding:14px;
  background:linear-gradient(to top, #061006, #0b1a0b);
  border-top-left-radius:22px;
  border-top-right-radius:22px;
}

/* HERO DISTANCE (NOW MUCH STRONGER) */
.distance {
  font-size:56px;
  font-weight:800;
  color:#7CFF8A;
  text-align:center;
  margin-top:6px;
}

/* CLUB */
.club {
  font-size:26px;
  text-align:center;
  margin-top:-6px;
  color:#d8ffd8;
}

/* AI (SIMPLIFIED) */
.ai {
  margin-top:10px;
  text-align:center;
  font-size:15px;
  color:#b7d9b7;
}

/* BUTTONS */
.buttons {
  display:flex;
  gap:10px;
  margin-top:12px;
}

button {
  flex:1;
  padding:14px;
  border:none;
  border-radius:14px;
  background:#00c853;
  color:black;
  font-size:16px;
  font-weight:700;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="wrap">

  <div class="distance" id="distance">--</div>
  <div class="club" id="club">--</div>

  <div class="ai" id="aiBox">
    Set a pin to begin
  </div>

  <div class="buttons">
    <button onclick="startHole()">⛳ Start</button>
    <button onclick="addShot()">+ Shot</button>
  </div>

</div>

<script>
let map = L.map('map');

L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

let userMarker, holeMarker;
let holePosition = null;

// GPS
function updatePosition() {
  navigator.geolocation.getCurrentPosition(function(pos) {

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    if (!userMarker) {
      userMarker = L.marker([lat,lng]).addTo(map);
      map.setView([lat,lng],17);
    } else {
      userMarker.setLatLng([lat,lng]);
    }

    if (holePosition) {

      let d = Math.round(map.distance([lat,lng], holePosition));

      document.getElementById("distance").innerText = d + " m";

      let club = "Driver";
      if (d < 200) club = "Iron";
      if (d < 100) club = "Wedge";
      if (d < 20) club = "Putter";

      document.getElementById("club").innerText = club;

      // 🔥 SIMPLIFIED CADDIE (MORE LIKE YOUR CONCEPT)
      document.getElementById("aiBox").innerHTML =
        "Use <b>" + club + "</b> • " +
        d + "m to pin";
    }

  });
}

setInterval(updatePosition, 2000);

// START HOLE
function startHole() {
  if (!userMarker) return;

  let pos = userMarker.getLatLng();

  holePosition = [pos.lat + 0.0005, pos.lng];

  if (holeMarker) map.removeLayer(holeMarker);
  holeMarker = L.marker(holePosition).addTo(map);
}

// SHOT (placeholder for now)
function addShot() {
  alert("Shot tracked");
}

// TAP TO SET PIN
map.on('click', function(e){
  holePosition = [e.latlng.lat, e.latlng.lng];

  if (holeMarker) map.removeLayer(holeMarker);
  holeMarker = L.marker(holePosition).addTo(map);
});
</script>

</body>
</html>
