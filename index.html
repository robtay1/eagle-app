<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eagle AI Caddie</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {margin:0;font-family:-apple-system;background:black;color:white;}

#map {
  position:absolute;
  height:100vh;
  width:100%;
  z-index:1;
}

/* TOP BAR */
.topbar {
  position:absolute;
  top:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:10px 16px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
  z-index:1000;
  font-size:14px;
}

/* HUD */
.hud {
  position:absolute;
  top:50px;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  z-index:1000;
}

.distance {
  font-size:52px;
  font-weight:800;
  color:#7CFF8A;
}

.club {
  font-size:18px;
}

/* EXTRA DATA */
.extra {
  font-size:14px;
  color:#c8ffc8;
}

/* PANEL */
.panel {
  position:absolute;
  bottom:0;
  width:100%;
  padding:16px;
  background:linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.4));
  z-index:1000;
}

.ai {
  text-align:center;
  margin-bottom:12px;
  font-size:16px;
}

.buttons {
  display:flex;
  gap:10px;
}

button {
  flex:1;
  padding:15px;
  border:none;
  border-radius:14px;
  background:#00c853;
  color:black;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="map"></div>

<!-- TOP INFO -->
<div class="topbar">
  <div>Hole 1 • Par 4</div>
  <div id="wind">Wind: 5 mph →</div>
</div>

<!-- MAIN HUD -->
<div class="hud">
  <div class="distance" id="distance">--</div>
  <div class="club" id="club">--</div>
  <div class="extra" id="extra">Front -- | Back --</div>
</div>

<!-- BOTTOM -->
<div class="panel">
  <div class="ai" id="aiBox">Set pin to begin</div>

  <div class="buttons">
    <button onclick="startHole()">⛳ Start</button>
    <button onclick="addShot()">🏌️ Shot</button>
  </div>
</div>

<script>
let map = L.map('map');

L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

let userMarker, holeMarker;
let holePosition = null;

let pinLine = null;

// FAKE WIND (for now)
function getWind() {
  let speed = Math.floor(Math.random()*10)+3;
  return speed + " mph →";
}

// GPS
function updatePosition() {
  navigator.geolocation.getCurrentPosition(function(pos) {

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    if (!userMarker) {
      userMarker = L.marker([lat,lng]).addTo(map);
      map.setView([lat,lng],17);
    } else {
      userMarker.setLatLng([lat,lng]);
    }

    if (holePosition) {

      let d = Math.round(map.distance([lat,lng], holePosition));

      document.getElementById("distance").innerText = d + " m";

      let club = "Driver";
      if (d < 200) club = "7 Iron";
      if (d < 140) club = "9 Iron";
      if (d < 100) club = "Wedge";
      if (d < 20) club = "Putter";

      document.getElementById("club").innerText = club;

      let front = d - 10;
      let back = d + 10;

      document.getElementById("extra").innerText =
        "Front " + front + "m | Back " + back + "m";

      document.getElementById("wind").innerText =
        "Wind: " + getWind();

      // 🧠 SMARTER CADDIE
      let advice = "Aim center";
      if (d > 150) advice = "Full swing, aim slightly right";
      if (d < 120) advice = "Controlled shot";

      document.getElementById("aiBox").innerHTML =
        d + "m • " + club + "<br>" + advice;

      if (pinLine) map.removeLayer(pinLine);
      pinLine = L.polyline([[lat,lng], holePosition], {
        color:'white',
        dashArray:'5,10'
      }).addTo(map);

      map.fitBounds([[lat,lng], holePosition], {padding:[60,60]});
    }

  });
}

setInterval(updatePosition, 2000);

function startHole() {
  if (!userMarker) return;

  let pos = userMarker.getLatLng();

  holePosition = [pos.lat + 0.0005, pos.lng];

  if (holeMarker) map.removeLayer(holeMarker);
  holeMarker = L.marker(holePosition).addTo(map);
}

function addShot() {}

map.on('click', function(e){
  holePosition = [e.latlng.lat, e.latlng.lng];

  if (holeMarker) map.removeLayer(holeMarker);
  holeMarker = L.marker(holePosition).addTo(map);
});
</script>

</body>
</html>
