<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eagle AI Caddie</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:-apple-system; background:black; color:white; }
#map { position:absolute; height:100vh; width:100%; }

/* HEADER */
.header {
  position:absolute;
  top:0;
  width:100%;
  text-align:center;
  padding:14px;
  background:rgba(0,0,0,0.6);
  z-index:1000;
}

.holebar {
  position:absolute;
  top:50px;
  width:100%;
  text-align:center;
  padding:6px;
  background:rgba(0,0,0,0.5);
  z-index:1000;
}

/* WIND */
.wind {
  position:absolute;
  top:90px;
  right:10px;
  background:rgba(0,0,0,0.6);
  padding:6px 10px;
  border-radius:10px;
  font-size:13px;
  z-index:1000;
}

/* NAV */
.nav {
  position:absolute;
  bottom:340px;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:0 20px;
  z-index:1000;
}

.nav button {
  background:rgba(0,0,0,0.7);
  color:white;
  border:none;
  padding:8px 14px;
  border-radius:10px;
}

/* FLOATING BUTTONS */
.mapBtns {
  position:absolute;
  bottom:270px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:12px;
  z-index:1000;
}

.mapBtns button {
  background:rgba(30,30,30,0.9);
  color:white;
  border:none;
  padding:12px 18px;
  border-radius:12px;
  font-weight:bold;
  box-shadow:0 4px 10px rgba(0,0,0,0.5);
}

/* STRIP */
.strip {
  position:absolute;
  bottom:230px;
  width:100%;
  text-align:center;
  background:rgba(0,0,0,0.6);
  padding:6px;
  font-size:14px;
  z-index:1000;
}

/* CARD */
.card {
  position:absolute;
  bottom:120px;
  left:10px;
  right:10px;
  background:#1c1c1c;
  border-radius:20px;
  padding:18px;
  z-index:1000;
  box-shadow:0 -5px 20px rgba(0,0,0,0.6);
}

.card h2 { font-size:36px; margin:5px 0; }

.card ul {
  margin-top:10px;
  font-size:15px;
  line-height:1.6;
}

/* BOTTOM */
.bottom {
  position:absolute;
  bottom:0;
  width:100%;
  display:flex;
  z-index:1000;
}

.bottom button {
  flex:1;
  padding:16px;
  border:none;
  font-weight:bold;
}

.green { background:#2ecc71; }
.red { background:#e74c3c; }
.blue { background:#3498db; }
.center { background:black; color:white; }

/* LABEL */
.label {
  background:rgba(0,0,0,0.8);
  color:white;
  padding:3px 8px;
  border-radius:8px;
  font-size:12px;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="header">🏌️ Eagle AI Caddie</div>
<div class="holebar" id="holeText"></div>
<div class="wind">🌬️ 5mph →</div>

<div class="nav">
  <button onclick="prevHole()">⬅ Hole</button>
  <button onclick="nextHole()">Hole ➡</button>
</div>

<div class="mapBtns">
  <button onclick="setPin()">📍 Set Pin</button>
  <button onclick="clearShots()">🧹 Clear Shots</button>
</div>

<div class="strip" id="strip">Distance to Pin: --</div>

<div class="card">
  <div>AI Caddie Advice</div>
  <h2 id="club">--</h2>
  <ul id="advice"><li>Set pin to begin</li></ul>
</div>

<div class="bottom">
  <button class="green" onclick="addShot()">+ Shot</button>
  <button class="center" id="score">0</button>
  <button class="blue" onclick="finishHole()">✔ Finish</button>
  <button class="red" onclick="removeShot()">-</button>
</div>

<script>
let map = L.map('map');

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{ maxZoom: 19 }
).addTo(map);

/* ICONS */
let userIcon = L.divIcon({
  html:'<div style="display:flex;align-items:center;gap:4px;"><div style="width:12px;height:12px;background:#00aaff;border-radius:50%;border:3px solid white;"></div><div style="font-size:12px;">YOU</div></div>',
  iconSize:[40,20]
});

let flagIcon = L.divIcon({ html:'🏁', iconSize:[20,20] });

/* COURSE */
let holes=[{par:4,yards:400},{par:3,yards:160},{par:5,yards:520}];
let scores=[], currentHole=0;

function updateHoleUI(){
let h=holes[currentHole];
let s=scores[currentHole]??"-";
document.getElementById("holeText").innerText=
`Hole ${currentHole+1} • Par ${h.par} • ${h.yards}y • Score: ${s}`;
}
updateHoleUI();

/* NAV */
function nextHole(){currentHole=(currentHole+1)%holes.length;resetHole();}
function prevHole(){currentHole=(currentHole-1+holes.length)%holes.length;resetHole();}
function resetHole(){clearShots();holePos=null;if(holeMarker)map.removeLayer(holeMarker);updateHoleUI();}

/* FINISH */
function finishHole(){
scores[currentHole]=shots.length;
alert("Hole complete: "+shots.length+" strokes");
nextHole();
}

/* GAME */
let userMarker,holeMarker,holePos=null;
let shots=[],shotLines=[],shotLabels=[];

function updateGPS(){
navigator.geolocation.getCurrentPosition(pos=>{
let lat=pos.coords.latitude,lng=pos.coords.longitude;

if(!userMarker){
userMarker=L.marker([lat,lng],{icon:userIcon}).addTo(map);
map.setView([lat,lng],18);
}else{
userMarker.setLatLng([lat,lng]);
}

if(holePos){
let d=Math.round(map.distance([lat,lng],holePos));
document.getElementById("strip").innerText="Distance: "+d+"m";
document.getElementById("club").innerText=
d<100?"Wedge":d<140?"9 Iron":d<200?"7 Iron":"Driver";
}
});
}
setInterval(updateGPS,2000);

/* PIN */
function setPin(){
map.once('click',e=>{
holePos=[e.latlng.lat,e.latlng.lng];
if(holeMarker)map.removeLayer(holeMarker);
holeMarker=L.marker(holePos,{icon:flagIcon}).addTo(map);
});
}

/* CURVED ARC */
function createArc(start,end){
let latlngs=[];
for(let i=0;i<=20;i++){
let t=i/20;
let lat=start.lat+(end.lat-start.lat)*t+0.0002*Math.sin(Math.PI*t);
let lng=start.lng+(end.lng-start.lng)*t;
latlngs.push([lat,lng]);
}
return latlngs;
}

/* SHOT */
function addShot(){
if(!userMarker||!holePos)return;

let start=userMarker.getLatLng();
let end={lat:holePos[0],lng:holePos[1]};

let arc=createArc(start,end);

let line=L.polyline(arc,{color:'#00ffcc',weight:4}).addTo(map);
shotLines.push(line);

let dist=Math.round(map.distance(start,[end.lat,end.lng]));

let mid=arc[Math.floor(arc.length/2)];

let label=L.marker(mid,{
icon:L.divIcon({className:'label',html:dist+"m"})
}).addTo(map);

shotLabels.push(label);

shots.push(1);
document.getElementById("score").innerText=shots.length;
}

/* REMOVE */
function removeShot(){
if(shotLines.length===0)return;
map.removeLayer(shotLines.pop());
map.removeLayer(shotLabels.pop());
shots.pop();
document.getElementById("score").innerText=shots.length;
}

/* CLEAR */
function clearShots(){
shotLines.forEach(l=>map.removeLayer(l));
shotLabels.forEach(l=>map.removeLayer(l));
shotLines=[];shotLabels=[];shots=[];
document.getElementById("score").innerText="0";
}
</script>

</body>
</html>
