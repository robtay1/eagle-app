<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EAGLE HAS LANDED</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:-apple-system; background:black; color:white; }
#map { position:absolute; height:100vh; width:100%; }

.header {
  position:absolute; top:0; width:100%; text-align:center;
  padding:14px; background:rgba(0,0,0,0.6); z-index:1000;
}

.holebar {
  position:absolute; top:50px; width:100%; text-align:center;
  padding:6px; background:rgba(0,0,0,0.5); z-index:1000;
}

.mapBtns {
  position:absolute; bottom:260px; width:100%;
  display:flex; justify-content:center; gap:12px; z-index:1000;
}

.mapBtns button {
  background:rgba(30,30,30,0.9);
  color:white; border:none; padding:12px 18px;
  border-radius:12px; font-weight:bold;
}

.strip {
  position:absolute; bottom:220px; width:100%;
  text-align:center; background:rgba(0,0,0,0.6);
  padding:6px; z-index:1000;
}

.card {
  position:absolute; bottom:98px; left:10px; right:10px;
  background:#1c1c1c; border-radius:20px;
  padding:12px 18px; z-index:1000;
}

.bottom {
  position:absolute; bottom:0; width:100%;
  display:flex; z-index:1000;
}

.bottom button {
  flex:1; padding:18px; border:none; font-weight:bold;
}

.green { background:#2ecc71; }
.red { background:#e74c3c; }
.center { background:black; color:white; }

.label {
  background:black; padding:3px 6px; border-radius:6px;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="header">🏌️ Eagle AI Caddie</div>
<div class="holebar">Hole 1 • Par 4 • 400y</div>

<div class="mapBtns">
  <button onclick="setPin()">📍 Set Pin</button>
  <button onclick="clearShots()">🧹 Clear</button>
  <button onclick="openScorecard()">📊 Scorecard</button>
  <button onclick="openPractice()">🎯 Practice</button>
</div>

<div class="strip" id="strip">Distance: --</div>

<div class="card">
  <div>AI Caddie</div>
  <h2 id="club">--</h2>
  <ul id="advice"><li>Set pin</li></ul>
</div>

<div class="bottom">
  <button class="green" onclick="addShot()">+ Shot</button>
  <button class="center" id="score">0</button>
  <button class="red" onclick="removeShot()">-</button>
</div>

<!-- SCORECARD -->
<div id="scorecardScreen" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:black;z-index:2000;overflow:auto;padding:10px;">
<h2>Scorecard</h2>
<button onclick="closeScorecard()">⬅ Back</button>

<div>
<label><input type="radio" name="tee">White</label>
<label><input type="radio" name="tee">Yellow</label>
<label><input type="radio" name="tee">Red</label>
</div>

<table style="width:100%;border-collapse:collapse;">
<thead>
<tr>
<th>H</th><th>W</th><th>Y</th><th>R</th><th>Par</th><th>SI</th><th>Score</th><th>P</th><th>FW</th><th>G</th>
</tr>
</thead>
<tbody id="scoreRows"></tbody>
</table>
</div>

<!-- PRACTICE -->
<div id="practiceScreen" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:black;z-index:2000;padding:20px;">
<h2>Practice</h2>
<button onclick="closePractice()">⬅ Back</button>

<div id="clubs"></div>

<input id="clubName" placeholder="Club">
<input id="clubDist" placeholder="Distance">
<button onclick="addClub()">Add</button>
</div>

<script>
let map = L.map('map');

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{maxZoom:19}
).addTo(map);

let userMarker, holeMarker, holePos=null;
let rings=[],labels=[],guideLine=null,dispersionCircle=null;
let shots=[],shotLines=[];

/* SCORECARD */
let html="";
for(let i=1;i<=18;i++){
html+=`<tr>
<td>${i}</td>
<td><input></td><td><input></td><td><input></td>
<td><input></td><td><input></td><td><input></td>
<td><input></td>
<td><select><option>Y</option><option>N</option></select></td>
<td><select><option>Y</option><option>N</option></select></td>
</tr>`;
}
window.onload=()=>document.getElementById("scoreRows").innerHTML=html;

/* NAV */
function openScorecard(){ document.getElementById("scorecardScreen").style.display="block"; hideMain(); }
function closeScorecard(){ document.getElementById("scorecardScreen").style.display="none"; showMain(); }
function openPractice(){ document.getElementById("practiceScreen").style.display="block"; hideMain(); }
function closePractice(){ document.getElementById("practiceScreen").style.display="none"; showMain(); }

function hideMain(){
document.querySelectorAll("#map,.header,.holebar,.mapBtns,.strip,.card,.bottom")
.forEach(el=>el.style.display="none");
}
function showMain(){
document.querySelectorAll("#map,.header,.holebar,.mapBtns,.strip,.card,.bottom")
.forEach(el=>el.style.display="block");
setTimeout(()=>map.invalidateSize(),200);
}

/* GPS */
function updateGPS(){
navigator.geolocation.getCurrentPosition(pos=>{
let lat=pos.coords.latitude,lng=pos.coords.longitude;

if(!userMarker){
userMarker=L.marker([lat,lng]).addTo(map);
map.setView([lat,lng],18);
}else userMarker.setLatLng([lat,lng]);

if(holePos){
let d=Math.round(map.distance([lat,lng],holePos));
document.getElementById("strip").innerText="Distance: "+d+"m";

/* AI CLUB */
let club="--";
if(clubs.length>0){
let best=clubs.reduce((prev,curr)=>{
return Math.abs(curr.dist-d)<Math.abs(prev.dist-d)?curr:prev;
});
club=best.name;
}else{
club="Add clubs in Practice";
}
document.getElementById("club").innerText=club;

/* RINGS */
rings.forEach(r=>map.removeLayer(r));
labels.forEach(l=>map.removeLayer(l));
rings=[];labels=[];

[50,100,150].forEach(r=>{
rings.push(L.circle(holePos,{radius:r,color:'white',fill:false}).addTo(map));
labels.push(L.marker([holePos[0],holePos[1]+(r/111320)],{
icon:L.divIcon({className:'label',html:r+"m"})
}).addTo(map));
});

/* LINE */
if(guideLine) map.removeLayer(guideLine);
guideLine=L.polyline([[lat,lng],holePos],{dashArray:'6,6'}).addTo(map);

/* DISPERSION */
if(dispersionCircle) map.removeLayer(dispersionCircle);

if(clubs.length>0){
let best=clubs.reduce((prev,curr)=>{
return Math.abs(curr.dist-d)<Math.abs(prev.dist-d)?curr:prev;
});

dispersionCircle=L.circle(holePos,{
radius:best.dispersion||20,
color:'#00ffcc',
fillColor:'#00ffcc',
fillOpacity:0.2
}).addTo(map);
}

}
});
}
setInterval(updateGPS,2000);

/* MAP */
function setPin(){
map.once('click',e=>{
holePos=[e.latlng.lat,e.latlng.lng];
if(holeMarker) map.removeLayer(holeMarker);
holeMarker=L.marker(holePos).addTo(map);
});
}

function addShot(){
if(!userMarker||!holePos)return;
let pos=userMarker.getLatLng();
let line=L.polyline([pos,holePos]).addTo(map);
shotLines.push(line); shots.push(1);
document.getElementById("score").innerText=shots.length;
}

function removeShot(){
if(!shotLines.length)return;
map.removeLayer(shotLines.pop());
shots.pop();
document.getElementById("score").innerText=shots.length;
}

function clearShots(){
shotLines.forEach(l=>map.removeLayer(l));
shotLines=[];shots=[];
document.getElementById("score").innerText=0;
}

/* PRACTICE */
let clubs = JSON.parse(localStorage.getItem("clubs") || "[]");

function addClub(){
let name=document.getElementById("clubName").value;
let dist=parseInt(document.getElementById("clubDist").value);
if(!name||!dist)return;

clubs.push({name,dist,dispersion:20});
localStorage.setItem("clubs",JSON.stringify(clubs));
renderClubs();
}

function renderClubs(){
let html="";
clubs.forEach((c,i)=>{
html+=`<div>${c.name} - ${c.dist}m <button onclick="removeClub(${i})">X</button></div>`;
});
document.getElementById("clubs").innerHTML=html;
}

function removeClub(i){
clubs.splice(i,1);
localStorage.setItem("clubs",JSON.stringify(clubs));
renderClubs();
}

renderClubs();
</script>

</body>
</html>
