<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EAGLE HAS LANDED</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:-apple-system; background:black; color:white; }

#map { position:absolute; height:100vh; width:100%; }

/* HEADER */
.header {
  position:absolute;
  top:0;
  width:100%;
  text-align:center;
  padding:14px;
  background:rgba(0,0,0,0.6);
  font-weight:bold;
  z-index:1000;
}

.holebar {
  position:absolute;
  top:50px;
  width:100%;
  text-align:center;
  padding:6px;
  background:rgba(0,0,0,0.5);
  z-index:1000;
}

/* FLOATING BUTTONS */
.mapBtns {
  position:absolute;
  bottom:260px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:12px;
  z-index:1000;
}

.mapBtns button {
  background:rgba(30,30,30,0.9);
  color:white;
  border:none;
  padding:12px 18px;
  border-radius:12px;
  font-weight:bold;
  box-shadow:0 4px 10px rgba(0,0,0,0.5);
}

/* DISTANCE STRIP */
.strip {
  position:absolute;
  bottom:220px;
  width:100%;
  text-align:center;
  background:rgba(0,0,0,0.6);
  padding:6px;
  font-size:14px;
  z-index:1000;
}

/* AI CARD */
.card {
  position:absolute;
  bottom:98px;
  left:10px;
  right:10px;
  background:#1c1c1c;
  border-radius:20px;
  padding:12px 18px;
  z-index:1000;
  box-shadow:0 -5px 20px rgba(0,0,0,0.6);
}

.card h2 {
  font-size:36px;
  margin:5px 0;
}

.card ul {
  margin-top:10px;
  font-size:15px;
  line-height:1.6;
}

/* BOTTOM BUTTONS */
.bottom {
  position:absolute;
  bottom:0;
  width:100%;
  display:flex;
  z-index:1000;
}

.bottom button {
  flex:1;
  padding:18px;
  border:none;
  font-weight:bold;
  font-size:16px;
}

.green { background:#2ecc71; }
.red { background:#e74c3c; }
.center { background:black; color:white; }

/* RING LABELS */
.label {
  background:rgba(0,0,0,0.8);
  color:white;
  padding:3px 8px;
  border-radius:8px;
  font-size:12px;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="header">🏌️ EAGLE HAS LANDED</div>
<div class="holebar">Hole 1 • Par 4 • 400y</div>

<div class="mapBtns">
  <button onclick="setPin()">📍 Set Pin</button>
  <button onclick="clearShots()">🧹 Clear Shots</button>
  <button onclick="openScorecard()">📊 Scorecard</button>
  <button onclick="openPractice()">🎯 Practice</button> <!-- ✅ ADDED -->
</div>

<div class="strip" id="strip">Distance to Pin: --</div>

<div class="card">
  <div>AI Caddie Advice</div>
  <h2 id="club">--</h2>
  <ul id="advice">
    <li>Set pin to begin</li>
  </ul>
</div>

<div class="bottom">
  <button class="green" onclick="addShot()">+ Add Shot</button>
  <button class="center" id="score">0 Stroke</button>
  <button class="red" onclick="removeShot()">- Remove</button>
</div>

<!-- SCORECARD (UNCHANGED) -->
<div id="scorecardScreen" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:#0f0f0f; z-index:2000; padding:16px;">
  <h2>Scorecard</h2>
  <button onclick="closeScorecard()">⬅ Back</button>
</div>

<!-- ✅ PRACTICE SCREEN (NEW) -->
<div id="practiceScreen" style="
  display:none;
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  z-index:2000;
  padding:20px;
">
  <h2>🎯 Practice / Shot Distance</h2>

  <button onclick="closePractice()" style="
    padding:10px;
    margin-bottom:15px;
    background:#222;
    color:white;
    border:none;
    border-radius:8px;
  ">
    ⬅ Back to Caddie
  </button>
</div>

<script>
let map = L.map('map');

L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 19 }
).addTo(map);

// ICONS
let userIcon = L.divIcon({
  html:'<div style="width:14px;height:14px;background:#00aaff;border-radius:50%;border:3px solid white;"></div>',
  iconSize:[20,20]
});

let flagIcon = L.divIcon({
  html:'🏁',
  iconSize:[20,20]
});

let userMarker, holeMarker;
let holePos = null;

let rings = [], labels = [], guideLine = null;
let shots = [], shotLines = [];

// NAV
function openScorecard() {
  document.getElementById("scorecardScreen").style.display = "block";
  hideMain();
}
function closeScorecard() {
  document.getElementById("scorecardScreen").style.display = "none";
  showMain();
}

function openPractice() {
  document.getElementById("practiceScreen").style.display = "block";
  hideMain();
}
function closePractice() {
  document.getElementById("practiceScreen").style.display = "none";
  showMain();
}

function hideMain() {
  document.querySelectorAll("#map, .header, .holebar, .mapBtns, .strip, .card, .bottom")
    .forEach(el => el.style.display = "none");
}

function showMain() {
  document.querySelectorAll("#map, .header, .holebar, .mapBtns, .strip, .card, .bottom")
    .forEach(el => el.style.display = "block");

  setTimeout(() => map.invalidateSize(), 200);
}

// MAP LOGIC (UNCHANGED)
function updateGPS() {
  navigator.geolocation.getCurrentPosition(pos => {

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    if (!userMarker) {
      userMarker = L.marker([lat,lng], {icon:userIcon}).addTo(map);
      map.setView([lat,lng],18);
    } else {
      userMarker.setLatLng([lat,lng]);
    }

  });
}

setInterval(updateGPS,2000);

function setPin() {
  map.once('click', e => {
    holePos = [e.latlng.lat, e.latlng.lng];
    if (holeMarker) map.removeLayer(holeMarker);
    holeMarker = L.marker(holePos, {icon:flagIcon}).addTo(map);
  });
}

function addShot() {}
function removeShot() {}
function clearShots() {}
</script>

</body>
</html>
