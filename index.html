<!DOCTYPE html>
<html>
<head>
  <title>Eagle AI Caddie</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont;
      background: black;
      color: white;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    /* HEADER */
    .top-bar {
      position: absolute;
      top: 0;
      width: 100%;
      text-align: center;
      background: rgba(0,0,0,0.6);
      padding: 10px 0;
      font-weight: bold;
      z-index: 1000;
    }

    .hole-info {
      position: absolute;
      top: 50px;
      width: 100%;
      text-align: center;
      background: rgba(0,0,0,0.4);
      padding: 6px;
      z-index: 1000;
    }

    /* WIND */
    .wind {
      position: absolute;
      top: 90px;
      right: 15px;
      background: rgba(0,0,0,0.7);
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 1000;
    }

    /* FLOATING BUTTONS */
    .floating-buttons {
      position: absolute;
      bottom: 260px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 1000;
    }

    .btn {
      background: rgba(30,30,30,0.9);
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 14px;
    }

    /* AI CARD */
    .card {
      position: absolute;
      bottom: 100px;
      width: 90%;
      left: 5%;
      background: rgba(20,20,20,0.95);
      border-radius: 16px;
      padding: 20px;
      z-index: 1000;
    }

    .club {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    /* BOTTOM BAR */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      width: 100%;
      display: flex;
      z-index: 1000;
    }

    .bottom-bar div {
      flex: 1;
      text-align: center;
      padding: 18px;
      font-weight: bold;
    }

    .add { background: #00c853; }
    .stroke { background: black; }
    .remove { background: #d50000; }

  </style>
</head>

<body>

<div id="map"></div>

<div class="top-bar">🏌️ Eagle AI Caddie</div>
<div class="hole-info">Hole 1 • Par 4 • 400y</div>
<div class="wind">💨 5mph →</div>

<div class="floating-buttons">
  <div class="btn" onclick="setPin()">📍 Set Pin</div>
  <div class="btn" onclick="clearShots()">🧹 Clear</div>
</div>

<div class="card">
  <div>AI Caddie Advice</div>
  <div class="club" id="club">--</div>
  <div id="info"></div>
</div>

<div class="bottom-bar">
  <div class="add" onclick="addShot()">+ Add Shot</div>
  <div class="stroke" id="score">0 Stroke</div>
  <div class="remove" onclick="removeShot()">- Remove</div>
</div>

<script>
let map = L.map('map').setView([53.8, -1.6], 18);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// SATELLITE
L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 19 }
).addTo(map);

// USER DOT (REAL STYLE)
let userMarker = L.circleMarker([53.8, -1.6], {
  radius: 8,
  color: '#fff',
  fillColor: '#2196f3',
  fillOpacity: 1
}).addTo(map);

// PIN (FLAG STYLE)
let pin = null;

let shots = [];
let score = 0;

// RINGS
let rings = [];

function drawRings(center) {
  rings.forEach(r => map.removeLayer(r));
  rings = [];

  [50,100,150].forEach(d => {
    let circle = L.circle(center, {
      radius: d,
      color: 'white',
      opacity: 0.3,
      fill: false
    }).addTo(map);

    rings.push(circle);

    L.marker([
      center[0],
      center[1] + (d / 111320)
    ], {
      icon: L.divIcon({
        html: `<div style="background:black;padding:4px 8px;border-radius:8px;font-size:12px">${d}m</div>`
      })
    }).addTo(map);
  });
}

function setPin() {
  let center = map.getCenter();

  if (pin) map.removeLayer(pin);

  pin = L.marker(center, {
    icon: L.divIcon({
      html: "🏁",
      className: "",
      iconSize: [30,30]
    })
  }).addTo(map);

  drawRings(center);
}

function addShot() {
  if (!pin) return;

  let from = userMarker.getLatLng();
  let to = pin.getLatLng();

  let line = L.polyline([from, to], {
    color: 'white',
    dashArray: '6,6'
  }).addTo(map);

  shots.push(line);

  score++;
  document.getElementById("score").innerText = score + " Stroke";

  updateAI();
}

function removeShot() {
  let last = shots.pop();
  if (last) map.removeLayer(last);

  score = Math.max(0, score - 1);
  document.getElementById("score").innerText = score + " Stroke";
}

function clearShots() {
  shots.forEach(s => map.removeLayer(s));
  shots = [];
  score = 0;
  document.getElementById("score").innerText = "0 Stroke";
}

function updateAI() {
  let clubs = ["Driver","5 Wood","7 Iron","9 Iron","Wedge"];
  let club = clubs[Math.floor(Math.random()*clubs.length)];

  document.getElementById("club").innerText = club;
  document.getElementById("info").innerHTML = `
    • 120m to pin<br>
    • Wind adjusted: 125m<br>
    • Aim center
  `;
}

// GPS TRACKING
navigator.geolocation.watchPosition(pos => {
  let lat = pos.coords.latitude;
  let lng = pos.coords.longitude;

  userMarker.setLatLng([lat, lng]);
  map.setView([lat, lng]);
});
</script>

</body>
</html>
