<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eagle AI Caddie</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  margin:0;
  background:black;
  color:white;
  font-family:-apple-system;
  text-align:center;
}

#map {
  height:50vh;
  width:100%;
}

.info { font-size:20px; margin:5px; }
#score { font-size:40px; margin:10px; }

button {
  width:90%;
  padding:15px;
  margin:8px;
  border:none;
  border-radius:10px;
  background:limegreen;
  color:black;
  font-size:18px;
}
</style>
</head>

<body>

<h2>🏌️ Eagle AI Caddie</h2>

<div id="map"></div>

<div class="info" id="distance">Distance: --</div>
<div class="info" id="club">Club: --</div>
<div id="score">Score: 0</div>

<button id="startBtn">⛳ Start Hole</button>
<button id="shotBtn">+ Shot</button>

<script>
let map = L.map('map').setView([51.505, -0.09], 15);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

let userMarker = null;
let holeMarker = null;
let holePosition = null;
let score = 0;
let shots = [];
let shotline = null;

// BUTTONS
document.getElementById("startBtn").onclick = startHole;
document.getElementById("shotBtn").onclick = addShot;

// 📍 GPS LOOP (runs every 2s)
function updatePosition() {
  navigator.geolocation.getCurrentPosition(function(pos) {

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    // Move map to YOU
    map.setView([lat, lng], 17);

    // Update or create your marker
    if (!userMarker) {
      userMarker = L.marker([lat, lng]).addTo(map);
    } else {
      userMarker.setLatLng([lat, lng]);
    }

    // ✅ ONLY calculate distance if hole is fixed
    if (holePosition) {
      let distance = map.distance(
        [lat, lng],
        holePosition
      );

      document.getElementById("distance").innerText =
        "Distance: " + Math.round(distance) + " m";

      let club = "Driver";
      if (distance < 200) club = "Iron";
      if (distance < 100) club = "Wedge";
      if (distance < 20) club = "Putter";

      document.getElementById("club").innerText =
        "Club: " + club;
    }

  });
}

setInterval(updatePosition, 2000);

// ⛳ Start Hole (FIXED POSITION)
function startHole() {
  if (!userMarker) return;

  let pos = userMarker.getLatLng();

  // 🔥 Set hole ONCE and store it
  holePosition = [pos.lat + 0.0005, pos.lng];

  // Remove old marker
  if (holeMarker) {
    map.removeLayer(holeMarker);
  }

  // Add new hole marker
  holeMarker = L.marker(holePosition).addTo(map);
}

// ➕ Shot
function addShot() {
  if (!userMarker) return;

  let pos = userMarker.getLatLng();

  shots.push([pos.lat, pos.lng]);

  // Remove old line
  if (shotLine) {
    map.removeLayer(shotLine);
  }

  // Draw new line
  shotLine = L.polyline(shots, {
    color: 'yellow',
    weight: 4
  }).addTo(map);

  score++;
  document.getElementById("score").innerText = "Score: " + score;
}
  // Add new marker
  holeMarker = L.marker(holePosition).addTo(map);

});
</script>
</body>
</html>
