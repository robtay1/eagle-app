<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eagle AI Caddie</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:-apple-system; background:black; color:white; }

#map {
  position:absolute;
  height:100vh;
  width:100%;
  z-index:1;
}

/* HEADER */
.header {
  position:absolute;
  top:0;
  width:100%;
  text-align:center;
  padding:14px;
  background:rgba(0,0,0,0.6);
  font-weight:bold;
  z-index:1000;
}

/* HOLE INFO */
.holebar {
  position:absolute;
  top:50px;
  width:100%;
  text-align:center;
  padding:6px;
  background:rgba(0,0,0,0.5);
  z-index:1000;
}

/* MAP BUTTONS */
.mapBtns {
  position:absolute;
  bottom:230px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:12px;
  z-index:1000;
}

.mapBtns button {
  padding:10px 16px;
  border-radius:10px;
  border:none;
  background:#333;
  color:white;
}

/* DISTANCE STRIP */
.strip {
  position:absolute;
  bottom:190px;
  width:100%;
  text-align:center;
  background:rgba(0,0,0,0.6);
  padding:6px;
  z-index:1000;
}

/* AI CARD */
.card {
  position:absolute;
  bottom:80px;
  left:10px;
  right:10px;
  background:#1e1e1e;
  border-radius:16px;
  padding:16px;
  z-index:1000;
}

.card h2 {
  margin:0;
  font-size:28px;
}

.card ul {
  padding-left:18px;
  margin-top:10px;
  font-size:14px;
}

/* BOTTOM BAR */
.bottom {
  position:absolute;
  bottom:0;
  width:100%;
  display:flex;
  z-index:1000;
}

.bottom button {
  flex:1;
  padding:16px;
  border:none;
  font-weight:bold;
}

.green { background:#2ecc71; }
.red { background:#e74c3c; }
.center {
  background:#111;
  color:white;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="header">🏌️ Eagle AI Caddie</div>
<div class="holebar">Hole 1 • Par 4 • 400y</div>

<div class="mapBtns">
  <button onclick="setPin()">📍 Set Pin</button>
  <button onclick="clearShots()">🧹 Clear Shots</button>
</div>

<div class="strip" id="strip">
  Distance to Pin: -- • Last Shot: --
</div>

<div class="card">
  <div>AI Caddie Advice</div>
  <h2 id="club">--</h2>
  <ul id="advice">
    <li>Set pin to begin</li>
  </ul>
</div>

<div class="bottom">
  <button class="green" onclick="addShot()">+ Add Shot</button>
  <button class="center" id="score">0 Stroke</button>
  <button class="red" onclick="removeShot()">- Remove</button>
</div>

<script>
let map = L.map('map');

L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
  maxZoom:19
}).addTo(map);

let userMarker, holeMarker;
let holePos = null;

let shots = [];
let shotLines = [];

let rings = [];
let guideLine = null;

function updateGPS() {
  navigator.geolocation.getCurrentPosition(pos => {

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    if (!userMarker) {
      userMarker = L.marker([lat,lng]).addTo(map);
      map.setView([lat,lng],17);
    } else {
      userMarker.setLatLng([lat,lng]);
    }

    if (holePos) {

      let d = Math.round(map.distance([lat,lng], holePos));

      let club = "Driver";
      if (d < 200) club = "7 Iron";
      if (d < 140) club = "9 Iron";
      if (d < 100) club = "Wedge";

      document.getElementById("club").innerText = club;

      document.getElementById("strip").innerText =
        "Distance to Pin: " + d + "m • Last Shot: " + (shots.at(-1)||"--");

      document.getElementById("advice").innerHTML = `
        <li>${d}m to pin</li>
        <li>Wind adjusted: ${d+5}m</li>
        <li>Aim center</li>
      `;

      // 🔵 DRAW GUIDE LINE
      if (guideLine) map.removeLayer(guideLine);
      guideLine = L.polyline([[lat,lng], holePos], {
        color:'white',
        weight:2,
        dashArray:'5,10'
      }).addTo(map);

      // 🔵 DRAW RINGS
      rings.forEach(r => map.removeLayer(r));
      rings = [];

      [50,100,150].forEach(radius => {
        rings.push(
          L.circle(holePos, {
            radius: radius,
            color: 'white',
            fill:false,
            opacity:0.3
          }).addTo(map)
        );
      });

    }

  });
}

setInterval(updateGPS,2000);

function setPin() {
  map.once('click', e => {
    holePos = [e.latlng.lat, e.latlng.lng];

    if (holeMarker) map.removeLayer(holeMarker);
    holeMarker = L.marker(holePos).addTo(map);
  });
}

function addShot() {
  if (!userMarker || !holePos) return;

  let currentPos = userMarker.getLatLng();
  let d = Math.round(map.distance(currentPos, holePos));

  shots.push(d);

  // 🔴 DRAW SHOT LINE
  let line = L.polyline([currentPos, holePos], {
    color:'yellow',
    weight:3
  }).addTo(map);

  shotLines.push(line);

  // SCORE
  let score = shots.length;
  document.getElementById("score").innerText = score + " Stroke";
}

function removeShot() {
  if (shots.length === 0) return;

  shots.pop();

  let line = shotLines.pop();
  map.removeLayer(line);

  document.getElementById("score").innerText =
    shots.length + " Stroke";
}

function clearShots() {
  shots = [];

  shotLines.forEach(l => map.removeLayer(l));
  shotLines = [];

  document.getElementById("score").innerText = "0 Stroke";
}
</script>

</body>
</html>
