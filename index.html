<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EAGLE HAS LANDED</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body { margin:0; font-family:-apple-system; background:black; color:white; }
#map { position:absolute; top:0; bottom:0; width:100%; }

.header { position:absolute; top:0; width:100%; text-align:center; padding:14px; background:rgba(0,0,0,0.6); z-index:1000; }
.holebar { position:absolute; top:50px; width:100%; text-align:center; padding:6px; background:rgba(0,0,0,0.5); z-index:1000; }

.mapBtns {
  position:absolute;
  bottom:290px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
  z-index:1200;
}

.mapBtns button {
  background:rgba(30,30,30,0.9);
  color:white;
  border:none;
  padding:10px 14px;
  border-radius:12px;
}

.strip {
  position:absolute;
  bottom:250px;
  width:100%;
  text-align:center;
  background:rgba(0,0,0,0.6);
  padding:6px;
  z-index:1100;
}

.card {
  position:absolute;
  bottom:110px;
  left:10px;
  right:10px;
  background:#1c1c1c;
  border-radius:20px;
  padding:14px;
}

.bottom {
  position:absolute;
  bottom:0;
  width:100%;
  display:flex;
}

.bottom button {
  flex:1;
  padding:18px;
  border:none;
}

.green { background:#2ecc71; }
.red { background:#e74c3c; }
.center { background:black; color:white; }

.label {
  background:black;
  padding:3px 6px;
  border-radius:6px;
}

/* PRACTICE */
.clubRow {
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

.clubRight {
  display:flex;
  gap:10px;
  align-items:center;
}

.clubRight input {
  width:60px;
  background:transparent;
  border:none;
  color:white;
}

.removeBtn {
  color:#ff6b6b;
  background:none;
  border:none;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="header">🏌️ Eagle AI Caddie</div>
<div class="holebar">Hole 1 • Par 4 • 400y</div>

<div class="mapBtns">
<button onclick="setPin()">📍 Pin</button>
<button onclick="toggleMode()">🎯 Mode</button>
<button onclick="openScorecard()">📊 Score</button>
<button onclick="openPractice()">🎯 Practice</button>
</div>

<div class="strip" id="strip">Distance: --</div>

<div class="card">
<div id="club">--</div>
<div>⛳ <span id="distToPin">--</span></div>
<div>🌬 <span id="wind">--</span></div>
<div>🎯 <span id="aim">--</span></div>
<div>⚙️ <span id="tip">--</span></div>
</div>

<div class="bottom">
<button class="green" onclick="addShot()">+ Shot</button>
<button class="center" id="score">0</button>
<button class="red" onclick="removeShot()">-</button>
</div>

<!-- PRACTICE -->
<div id="practiceScreen" style="display:none;position:absolute;top:0;width:100%;height:100%;background:black;z-index:2000;padding:20px;">
<h2>Practice</h2>
<button onclick="closePractice()">⬅ Back</button>

<button onclick="resetClubs()">Reset Clubs</button>
<div id="clubs"></div>
</div>

<!-- SCORECARD -->
<div id="scorecardScreen" style="display:none;position:absolute;top:0;width:100%;height:100%;background:black;z-index:3000;padding:15px;overflow:auto;">
<h2>Scorecard</h2>
<button onclick="closeScorecard()">⬅ Back</button>

<h3>📸 Import Scorecard</h3>
<input type="file" id="imgUpload">
<button onclick="handleImage()">Import</button>

<pre id="ocrOutput"></pre>

<table style="width:100%;margin-top:10px;">
<thead>
<tr><th>Hole</th><th>Par</th><th>Yards</th><th>Score</th></tr>
</thead>
<tbody id="scoreRows"></tbody>
</table>
</div>

<script>
let map=L.map('map').setView([51.505,-0.09],13);

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(map);

let userMarker,holeMarker,targetMarker;
let holePos=null,currentTarget=null,mode="pin";
let rings=[],labels=[],guideLine=null;

let clubs=JSON.parse(localStorage.getItem("clubs")||"[]");

/* GPS */
navigator.geolocation.watchPosition(p=>{
let lat=p.coords.latitude,lng=p.coords.longitude;

if(!userMarker){
userMarker=L.marker([lat,lng]).addTo(map);
map.setView([lat,lng],18);
}else userMarker.setLatLng([lat,lng]);

update(lat,lng);
});

/* MODE */
function toggleMode(){
mode=mode==="pin"?"target":"pin";
currentTarget=null;
if(targetMarker) map.removeLayer(targetMarker);
}

/* TAP TARGET */
map.on('click',e=>{
if(mode==="target"){
currentTarget=[e.latlng.lat,e.latlng.lng];

if(targetMarker) map.removeLayer(targetMarker);
targetMarker=L.marker(currentTarget,{opacity:0.7}).addTo(map);
}
});

/* UPDATE */
function update(lat,lng){

let target = (mode==="target" && currentTarget) ? currentTarget : holePos;
if(!target) return;

let d=Math.round(map.distance([lat,lng],target));

strip.innerText="Distance: "+d+"m";
distToPin.innerText=d+"m";

/* LINE */
if(guideLine) map.removeLayer(guideLine);
guideLine=L.polyline([[lat,lng],target],{dashArray:'6,6'}).addTo(map);

/* RINGS */
if(holePos){
rings.forEach(r=>map.removeLayer(r));
labels.forEach(l=>map.removeLayer(l));
rings=[]; labels=[];

[50,100,150].forEach(r=>{
rings.push(L.circle(holePos,{radius:r,color:'white',fill:false}).addTo(map));

labels.push(L.marker([holePos[0],holePos[1]+(r/111320)],{
icon:L.divIcon({className:'label',html:r+"m"})
}).addTo(map));
});
}

/* CLUB */
let best=null;
clubs.forEach(c=>{
if(!best) best=c;
else if(Math.abs(c.dist-d)<Math.abs(best.dist-d)) best=c;
});

club.innerText=best?best.name:(d>200?"Driver":"Add clubs");

/* AI */
wind.innerText=(d+5)+"m";
aim.innerText=Math.random()>0.5?"Left edge":"Center";
tip.innerText=d>180?"Take more club":"Smooth swing";
}

/* PIN */
function setPin(){
map.once('click',e=>{
holePos=[e.latlng.lat,e.latlng.lng];
currentTarget=null;

if(holeMarker) map.removeLayer(holeMarker);
holeMarker=L.marker(holePos).addTo(map);
});
}

/* SHOTS */
function addShot(){score.innerText++;}
function removeShot(){score.innerText=Math.max(0,score.innerText-1);}

/* OCR */
function parseScorecard(text){
let holes=[];
text.split("\n").forEach(l=>{
let n=l.match(/\d+/g);
if(n && n.length>=3){
holes.push({hole:n[0],par:n[1],yards:n[2]});
}
});
return holes.slice(0,18);
}

async function handleImage(){
let file=imgUpload.files[0];
if(!file)return;

const {data:{text}}=await Tesseract.recognize(file,'eng');
ocrOutput.innerText=text;

let course={holes:parseScorecard(text)};
localStorage.setItem("course",JSON.stringify(course));

renderScorecard();
}

/* SCORECARD */
function openScorecard(){
scorecardScreen.style.display="block";
renderScorecard();
}

function closeScorecard(){
scorecardScreen.style.display="none";
}

function renderScorecard(){
let course=JSON.parse(localStorage.getItem("course"));
if(!course){
scoreRows.innerHTML="<tr><td colspan='4'>Import a scorecard</td></tr>";
return;
}

let html="";
course.holes.forEach((h,i)=>{
html+=`<tr>
<td>${h.hole}</td>
<td>${h.par}</td>
<td>${h.yards}</td>
<td><input></td>
</tr>`;
});
scoreRows.innerHTML=html;
}

/* PRACTICE */
function renderClubs(){
let html="";
clubs.forEach(c=>{
html+=`<div class="clubRow">
<div>${c.name}</div>
<div class="clubRight">
<input value="${c.dist}">
<button class="removeBtn">✕</button>
</div></div>`;
});
clubsDiv.innerHTML=html;
}

function resetClubs(){
localStorage.removeItem("clubs");
renderClubs();
}

function openPractice(){practiceScreen.style.display="block";}
function closePractice(){practiceScreen.style.display="none";}

renderClubs();
</script>

</body>
</html>
