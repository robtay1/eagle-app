<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EAGLE HAS LANDED</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:-apple-system; background:black; color:white; }
#map { position:absolute; height:100vh; width:100%; }

.header { position:absolute; top:0; width:100%; text-align:center; padding:14px; background:rgba(0,0,0,0.6); z-index:1000; }
.holebar { position:absolute; top:50px; width:100%; text-align:center; padding:6px; background:rgba(0,0,0,0.5); z-index:1000; }

.mapBtns {
  position:absolute; bottom:300px; width:100%;
  display:flex; flex-wrap:wrap; justify-content:center; gap:8px; z-index:1000;
}

.mapBtns button {
  background:rgba(30,30,30,0.9);
  color:white; border:none; padding:10px 14px;
  border-radius:10px; font-weight:bold;
}

.strip { position:absolute; bottom:260px; width:100%; text-align:center; background:rgba(0,0,0,0.6); padding:6px; z-index:1000; }

.card {
  position:absolute; bottom:120px; left:10px; right:10px;
  background:#1c1c1c; border-radius:20px;
  padding:12px 18px; z-index:1000;
}

.bottom { position:absolute; bottom:0; width:100%; display:flex; z-index:1000; }
.bottom button { flex:1; padding:18px; border:none; font-weight:bold; }

.green { background:#2ecc71; }
.red { background:#e74c3c; }
.center { background:black; color:white; }

input { padding:6px; margin:4px; border-radius:6px; border:none; }
</style>
</head>

<body>

<div id="map"></div>

<div class="header">🏌️ Eagle AI Caddie</div>
<div class="holebar">Hole 1 • Par 4 • 400y</div>

<div class="mapBtns">
  <button onclick="setPin()">📍 Pin</button>
  <button onclick="clearShots()">🧹 Clear</button>
  <button onclick="openScorecard()">📊 Score</button>
  <button onclick="openPractice()">🎯 Clubs</button>
</div>

<div class="strip" id="strip">Distance: --</div>

<div class="card">
  <div>AI Caddie</div>
  <h2 id="club">--</h2>
  <div id="adjustments"></div>

  <div>
    Wind: <input id="wind" type="number">
    Elev: <input id="elev" type="number">
  </div>
</div>

<div class="bottom">
  <button class="green" onclick="addShot()">+ Shot</button>
  <button class="center" id="score">0</button>
  <button class="red" onclick="removeShot()">-</button>
</div>

<div id="scorecardScreen" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:black;z-index:2000;padding:10px;">
<h2>Scorecard</h2>
<button onclick="closeScorecard()">Back</button>
<table style="width:100%;">
<tbody id="scoreRows"></tbody>
</table>
</div>

<div id="practiceScreen" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:black;z-index:2000;padding:10px;">
<h2>Clubs</h2>
<button onclick="closePractice()">Back</button>

<div id="clubs"></div>

<input id="clubName" placeholder="Club">
<input id="clubDist" placeholder="Distance (m)">
<button onclick="addClubUI()">Add</button>
</div>

<script>

const state = {
  map:null,userMarker:null,holeMarker:null,holePos:null,
  guideLine:null,dispersionCircle:null,
  shots:[],shotLines:[],lastShotPos:null,
  clubs: JSON.parse(localStorage.getItem("clubs") || "[]"),
  round: JSON.parse(localStorage.getItem("round") || '{"holes":{}}'),
  currentHole:1
};

state.map = L.map('map');

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{maxZoom:19}
).addTo(state.map);

navigator.geolocation.watchPosition(pos=>{
  let lat=pos.coords.latitude, lng=pos.coords.longitude;

  if(!state.userMarker){
    state.userMarker=L.marker([lat,lng]).addTo(state.map);
    state.map.setView([lat,lng],18);
  } else state.userMarker.setLatLng([lat,lng]);

  if(state.holePos) updateCaddie(lat,lng);

},{enableHighAccuracy:true});

function updateCaddie(lat,lng){
  let meters = state.map.distance([lat,lng],state.holePos);
  let yards = Math.round(meters*1.09361);

  document.getElementById("strip").innerText="Distance: "+yards+"y";

  let wind = parseFloat(windInput.value)||0;
  let elev = parseFloat(elevInput.value)||0;

  let adjusted = meters+wind+elev;

  let club="--";

  if(state.clubs.length){
    let best = state.clubs.reduce((p,c)=>
      Math.abs(c.dist-adjusted)<Math.abs(p.dist-adjusted)?c:p
    );
    club=best.name;
  }

  document.getElementById("club").innerText=club;
  document.getElementById("adjustments").innerText="Play: "+Math.round(adjusted*1.09361)+"y";

  if(state.guideLine) state.map.removeLayer(state.guideLine);
  state.guideLine=L.polyline([[lat,lng],state.holePos],{dashArray:'6,6'}).addTo(state.map);
}

function setPin(){
  state.map.once('click',e=>{
    state.holePos=[e.latlng.lat,e.latlng.lng];
    if(state.holeMarker) state.map.removeLayer(state.holeMarker);
    state.holeMarker=L.marker(state.holePos).addTo(state.map);
  });
}

function addShot(){
  if(!state.userMarker||!state.holePos)return;

  let pos=state.userMarker.getLatLng();

  if(state.lastShotPos){
    let d=state.map.distance(state.lastShotPos,pos);
    alert("Last shot: "+Math.round(d*1.09361)+"y");
  }

  let line=L.polyline([pos,state.holePos]).addTo(state.map);

  state.shotLines.push(line);
  state.shots.push(pos);
  state.lastShotPos=pos;

  score.innerText=state.shots.length;

  saveHole();
}

function removeShot(){
  if(!state.shotLines.length)return;

  state.map.removeLayer(state.shotLines.pop());
  state.shots.pop();

  score.innerText=state.shots.length;

  saveHole();
}

function clearShots(){
  state.shotLines.forEach(l=>state.map.removeLayer(l));
  state.shotLines=[];state.shots=[];
  score.innerText=0;
  saveHole();
}

function saveHole(){
  state.round.holes[state.currentHole]=state.shots.length;
  localStorage.setItem("round",JSON.stringify(state.round));
}

function openScorecard(){
  scorecardScreen.style.display="block";
  let html="";
  for(let i=1;i<=18;i++){
    html+="<tr><td>"+i+"</td><td>"+(state.round.holes[i]||"-")+"</td></tr>";
  }
  scoreRows.innerHTML=html;
}

function closeScorecard(){ scorecardScreen.style.display="none"; }

function openPractice(){ practiceScreen.style.display="block"; renderClubs(); }
function closePractice(){ practiceScreen.style.display="none"; }

function addClubUI(){
  let name=clubName.value;
  let dist=parseInt(clubDist.value);
  if(!name||!dist)return;

  state.clubs.push({name,dist});
  localStorage.setItem("clubs",JSON.stringify(state.clubs));
  renderClubs();
}

function renderClubs(){
  let html="";
  state.clubs.forEach((c,i)=>{
    html+=c.name+" - "+c.dist+"m <button onclick='removeClub("+i+")'>X</button><br>";
  });
  clubs.innerHTML=html;
}

function removeClub(i){
  state.clubs.splice(i,1);
  localStorage.setItem("clubs",JSON.stringify(state.clubs));
  renderClubs();
}

renderClubs();

</script>

</body>
</html>
