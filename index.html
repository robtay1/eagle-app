<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EAGLE HAS LANDED</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:-apple-system; background:black; color:white; }

#map { position:absolute; height:100vh; width:100%; }

/* HEADER */
.header {
  position:absolute;
  top:0;
  width:100%;
  text-align:center;
  padding:14px;
  background:rgba(0,0,0,0.6);
  font-weight:bold;
  z-index:1000;
}

.holebar {
  position:absolute;
  top:50px;
  width:100%;
  text-align:center;
  padding:6px;
  background:rgba(0,0,0,0.5);
  z-index:1000;
}

/* FLOATING BUTTONS */
.mapBtns {
  position:absolute;
  bottom:260px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:12px;
  z-index:1000;
}

.mapBtns button {
  background:rgba(30,30,30,0.9);
  color:white;
  border:none;
  padding:12px 18px;
  border-radius:12px;
  font-weight:bold;
  box-shadow:0 4px 10px rgba(0,0,0,0.5);
}

/* DISTANCE STRIP */
.strip {
  position:absolute;
  bottom:220px;
  width:100%;
  text-align:center;
  background:rgba(0,0,0,0.6);
  padding:6px;
  font-size:14px;
  z-index:1000;
}

/* AI CARD (LOCKED SIZE) */
.card {
  position:absolute;
  bottom:110px;
  left:10px;
  right:10px;
  background:#1c1c1c;
  border-radius:20px;
  padding:12px 18px;
  z-index:1000;
  box-shadow:0 -5px 20px rgba(0,0,0,0.6);
  height:120px;
  overflow:hidden;
}

.card h2 {
  font-size:36px;
  margin:5px 0;
}

.card ul {
  margin-top:6px;
  font-size:14px;
  line-height:1.4;
  max-height:60px;
  overflow:hidden;
}

/* BOTTOM BUTTONS */
.bottom {
  position:absolute;
  bottom:0;
  width:100%;
  display:flex;
  z-index:1000;
}

.bottom button {
  flex:1;
  padding:18px;
  border:none;
  font-weight:bold;
  font-size:16px;
}

.green { background:#2ecc71; }
.red { background:#e74c3c; }
.center { background:black; color:white; }

/* RING LABELS */
.label {
  background:rgba(0,0,0,0.8);
  color:white;
  padding:3px 8px;
  border-radius:8px;
  font-size:12px;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="header">🏌️ EAGLE HAS LANDED</div>
<div class="holebar">Hole 1 • Par 4 • 400y</div>

<div class="mapBtns">
  <button onclick="setPin()">📍 Set Pin</button>
  <button onclick="clearShots()">🧹 Clear Shots</button>
  <button onclick="openScorecard()">📊 Scorecard</button>
  <button onclick="openPractice()">🎯 Practice</button>
</div>

<div class="strip" id="strip">Distance to Pin: --</div>

<div class="card">
  <div>AI Caddie Advice</div>
  <h2 id="club">--</h2>
  <ul id="advice">
    <li>Set pin to begin</li>
  </ul>
</div>

<div class="bottom">
  <button class="green" onclick="addShot()">+ Add Shot</button>
  <button class="center" id="score">0 Stroke</button>
  <button class="red" onclick="removeShot()">- Remove</button>
</div>

<!-- SCORECARD SCREEN -->
<div id="scorecardScreen" style="
  display:none;
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#0f0f0f;
  z-index:2000;
  padding:16px;
  overflow:auto;
">

  <h2 style="text-align:center;">Virtual Scorecard</h2>

  <button onclick="closeScorecard()" style="
    padding:10px;
    margin-bottom:15px;
    background:#1f1f1f;
    color:white;
    border:none;
    border-radius:10px;
  ">
    ⬅ Back to Caddie
  </button>

  <div style="display:flex; gap:10px; margin-bottom:10px;">
    <input placeholder="Handicap Index" style="flex:1;padding:10px;border:none;border-radius:8px;background:#1c1c1c;color:white;">
    <input placeholder="Playing Handicap" style="flex:1;padding:10px;border:none;border-radius:8px;background:#1c1c1c;color:white;">
  </div>

  <input placeholder="Enter Course Name" style="width:100%;padding:10px;margin-bottom:10px;border:none;border-radius:8px;background:#1c1c1c;color:white;">

  <div style="overflow-x:auto;">
    <table style="width:100%;border-collapse:collapse;font-size:13px;">
      <thead>
        <tr style="background:#145a32;">
          <th>Hole</th><th>Par</th><th>SI</th><th>W</th><th>Y</th><th>R</th>
          <th>FW</th><th>GIR</th><th>Putts</th><th>Total</th>
        </tr>
      </thead>
      <tbody id="scoreRows"></tbody>
    </table>
  </div>

</div>

<!-- PRACTICE SCREEN -->
<div id="practiceScreen" style="
  display:none;
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  z-index:2000;
  padding:20px;
">

  <h2 style="text-align:center;">🎯 Practice / Shot Distance</h2>

  <button onclick="closePractice()" style="
    padding:10px;
    margin-bottom:15px;
    background:#222;
    color:white;
    border:none;
    border-radius:8px;
  ">
    ⬅ Back to Caddie
  </button>

</div>

<script>
let map = L.map('map').setView([51.505, -0.09], 16);

L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 19 }
).addTo(map);

// FIXED SET PIN
function setPin() {
  document.getElementById("map").style.cursor = "crosshair";

  function placePin(e) {
    holePos = [e.latlng.lat, e.latlng.lng];

    if (holeMarker) map.removeLayer(holeMarker);
    holeMarker = L.marker(holePos, {icon:flagIcon}).addTo(map);

    map.off('click', placePin);
    document.getElementById("map").style.cursor = "default";
  }

  map.on('click', placePin);
}

// KEEP YOUR EXISTING FUNCTIONS
function openScorecard() {
  document.getElementById("scorecardScreen").style.display = "block";
}

function closeScorecard() {
  document.getElementById("scorecardScreen").style.display = "none";
  setTimeout(() => map.invalidateSize(), 200);
}

function openPractice() {
  document.getElementById("practiceScreen").style.display = "block";
}

function closePractice() {
  document.getElementById("practiceScreen").style.display = "none";
  setTimeout(() => map.invalidateSize(), 200);
}
</script>

</body>
</html>
