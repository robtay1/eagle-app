<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Eagle AI Caddie</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {margin:0;background:black;color:white;font-family:-apple-system;}

#map {height:60vh;width:100%;}

/* GLASS PANEL */
.panel {
  position:fixed;
  bottom:0;
  width:100%;
  background:rgba(0,0,0,0.9);
  backdrop-filter: blur(10px);
  padding:15px;
  border-top-left-radius:20px;
  border-top-right-radius:20px;
}

/* BIG DISTANCE */
.distance {
  text-align:center;
  font-size:36px;
  font-weight:bold;
}

/* CLUB DISPLAY */
.club {
  text-align:center;
  font-size:24px;
  margin-bottom:10px;
}

/* AI BOX */
.aiBox {
  background:#1c1c1c;
  padding:10px;
  border-radius:12px;
  margin-top:10px;
  text-align:left;
}

/* BUTTONS */
button {
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:#00c853;
  color:black;
  font-size:16px;
}
</style>
</head>

<body>

<h2 style="text-align:center;">🏌️ Eagle AI Caddie</h2>

<div id="map"></div>

<div class="panel">

  <div class="distance" id="distance">--</div>
  <div class="club" id="club">--</div>

  <div class="aiBox" id="ai">
    AI Caddie:<br>
    Waiting for data...
  </div>

  <button onclick="startHole()">⛳ Start Hole</button>
  <button onclick="addShot()">+ Shot</button>

</div>

<script>
let map = L.map('map').setView([51.505, -0.09], 15);

L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

let userMarker, holeMarker;
let holePosition = null;

// 🎯 DISTANCE RING
let ring = null;

function updatePosition() {
  navigator.geolocation.getCurrentPosition(function(pos) {

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    map.setView([lat, lng], 17);

    if (!userMarker) {
      userMarker = L.marker([lat, lng]).addTo(map);
    } else {
      userMarker.setLatLng([lat, lng]);
    }

    if (holePosition) {

      let distance = map.distance([lat, lng], holePosition);
      let distRounded = Math.round(distance);

      document.getElementById("distance").innerText = distRounded + " m";

      let club = "Driver";
      if (distance < 200) club = "Iron";
      if (distance < 100) club = "Wedge";
      if (distance < 20) club = "Putter";

      document.getElementById("club").innerText = club;

      // AI BOX UPDATE
      document.getElementById("ai").innerHTML =
        "<b>" + club + "</b><br>" +
        distRounded + "m to pin<br>" +
        "Aim centre<br>" +
        "Smooth swing";

      // 🎯 DRAW RING
      if (ring) map.removeLayer(ring);
      ring = L.circle(holePosition, {
        radius: distance,
        color: 'white',
        fill:false
      }).addTo(map);
    }

  });
}

setInterval(updatePosition, 2000);

function startHole() {
  if (!userMarker) return;

  let pos = userMarker.getLatLng();

  holePosition = [pos.lat + 0.0005, pos.lng];

  if (holeMarker) map.removeLayer(holeMarker);
  holeMarker = L.marker(holePosition).addTo(map);
}

function addShot() {
  alert("Shot tracked (next step = visual lines)");
}

// 📍 SET PIN MANUALLY
map.on('click', function(e) {
  holePosition = [e.latlng.lat, e.latlng.lng];

  if (holeMarker) map.removeLayer(holeMarker);
  holeMarker = L.marker(holePosition).addTo(map);
});
</script>

</body>
</html>
