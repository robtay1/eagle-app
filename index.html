<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Eagle AI Caddie</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  margin:0;
  background:black;
  color:white;
  font-family:-apple-system;
}

#map {
  height:55vh;
  width:100%;
}

/* UI PANEL */
.panel {
  background:#111;
  padding:15px;
  border-top-left-radius:20px;
  border-top-right-radius:20px;
  margin-top:-20px;
}

/* BIG DISPLAY */
.distance {
  font-size:28px;
  font-weight:bold;
}

.club {
  font-size:22px;
  margin-bottom:10px;
}

/* SCORE */
#score {
  font-size:26px;
  margin:10px 0;
}

/* BUTTONS */
button {
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:#00c853;
  color:black;
  font-size:16px;
}

/* SHOT HISTORY */
#shotsList {
  font-size:14px;
  max-height:100px;
  overflow:auto;
  margin-top:10px;
}
</style>
</head>

<body>

<h2 style="text-align:center;">🏌️ Eagle AI Caddie</h2>

<div id="map"></div>

<div class="panel">

  <div class="distance" id="distance">Distance: --</div>
  <div class="club" id="club">Club: --</div>

  <div id="score">Score: 0</div>

  <button onclick="startHole()">⛳ Start Hole</button>
  <button onclick="addShot()">+ Shot</button>

  <div id="shotsList"></div>

</div>

<script>
// MAP (Satellite style)
let map = L.map('map').setView([51.505, -0.09], 15);

// ⚠️ Using a better-looking tile layer
L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

let userMarker = null;
let holeMarker = null;
let holePosition = null;

let shots = [];
let shotLine = null;
let score = 0;

// GPS TRACKING
function updatePosition() {
  navigator.geolocation.getCurrentPosition(function(pos) {

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    map.setView([lat, lng], 17);

    if (!userMarker) {
      userMarker = L.marker([lat, lng]).addTo(map);
    } else {
      userMarker.setLatLng([lat, lng]);
    }

    if (holePosition) {
      let distance = map.distance([lat, lng], holePosition);

      document.getElementById("distance").innerText =
        "Distance: " + Math.round(distance) + " m";

      let club = "Driver";
      if (distance < 200) club = "Iron";
      if (distance < 100) club = "Wedge";
      if (distance < 20) club = "Putter";

      document.getElementById("club").innerText =
        "Club: " + club;
    }

  });
}

setInterval(updatePosition, 2000);

// START HOLE
function startHole() {
  if (!userMarker) return;

  let pos = userMarker.getLatLng();

  holePosition = [pos.lat + 0.0005, pos.lng];

  if (holeMarker) map.removeLayer(holeMarker);
  holeMarker = L.marker(holePosition).addTo(map);

  score = 0;
  shots = [];
  document.getElementById("score").innerText = "Score: 0";
  document.getElementById("shotsList").innerHTML = "";

  if (shotLine) map.removeLayer(shotLine);
}

// ADD SHOT
function addShot() {
  if (!userMarker) return;

  let pos = userMarker.getLatLng();
  let point = [pos.lat, pos.lng];

  shots.push(point);

  if (shots.length > 1) {
    if (shotLine) map.removeLayer(shotLine);

    shotLine = L.polyline(shots, {color:'yellow'}).addTo(map);

    let prev = shots[shots.length - 2];
    let dist = map.distance(prev, point);

    document.getElementById("shotsList").innerHTML +=
      "Shot " + shots.length + ": " + Math.round(dist) + " m<br>";
  }

  score++;
  document.getElementById("score").innerText = "Score: " + score;
}

// SET HOLE BY CLICK
map.on('click', function(e) {
  holePosition = [e.latlng.lat, e.latlng.lng];

  if (holeMarker) map.removeLayer(holeMarker);
  holeMarker = L.marker(holePosition).addTo(map);
});
</script>

</body>
</html>
