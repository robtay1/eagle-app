<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eagle AI Caddie</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {margin:0;font-family:-apple-system;background:black;color:white;}

#map {
  position:absolute;
  height:100vh;
  width:100%;
  z-index:1;
}

.hud {
  position:absolute;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(14px);
  padding:14px 22px;
  border-radius:22px;
  text-align:center;
  z-index:1000;
}

.distance {
  font-size:52px;
  font-weight:800;
  color:#7CFF8A;
}

.club {
  font-size:18px;
}

.panel {
  position:absolute;
  bottom:0;
  width:100%;
  padding:16px;
  background:linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.4));
  backdrop-filter:blur(20px);
  border-radius:24px 24px 0 0;
  z-index:1000;
}

.ai {
  text-align:center;
  margin-bottom:12px;
}

.buttons {
  display:flex;
  gap:10px;
}

button {
  flex:1;
  padding:15px;
  border:none;
  border-radius:14px;
  background:#00c853;
  color:black;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="hud">
  <div class="distance" id="distance">--</div>
  <div class="club" id="club">--</div>
</div>

<div class="panel">
  <div class="ai" id="aiBox">Tap map to set pin</div>

  <div class="buttons">
    <button onclick="startHole()">⛳ Start</button>
    <button onclick="addShot()">🏌️ Shot</button>
  </div>
</div>

<script>
let map = L.map('map');

// 🛰️ SATELLITE MAP (THIS IS THE UPGRADE)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

// OPTIONAL: try this satellite instead (uncomment to test)
/*
L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
  maxZoom: 17
}).addTo(map);
*/

let userMarker, holeMarker;
let holePosition = null;

let pinLine = null;

// GPS
function updatePosition() {
  navigator.geolocation.getCurrentPosition(function(pos) {

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    if (!userMarker) {
      userMarker = L.marker([lat,lng]).addTo(map);
      map.setView([lat,lng],18);
    } else {
      userMarker.setLatLng([lat,lng]);
    }

    if (holePosition) {
      let d = Math.round(map.distance([lat,lng], holePosition));

      document.getElementById("distance").innerText = d + " m";

      let club = "Driver";
      if (d < 200) club = "Iron";
      if (d < 100) club = "Wedge";
      if (d < 20) club = "Putter";

      document.getElementById("club").innerText = club;

      document.getElementById("aiBox").innerHTML =
        "📍 " + d + "m • Use <b>" + club + "</b>";

      if (pinLine) map.removeLayer(pinLine);
      pinLine = L.polyline([[lat,lng], holePosition], {
        color:'white',
        dashArray:'5,10'
      }).addTo(map);

      map.fitBounds([[lat,lng], holePosition], {padding:[60,60]});
    }

  });
}

setInterval(updatePosition, 2000);

// START HOLE
function startHole() {
  if (!userMarker) return;

  let pos = userMarker.getLatLng();

  holePosition = [pos.lat + 0.0005, pos.lng];

  if (holeMarker) map.removeLayer(holeMarker);
  holeMarker = L.marker(holePosition).addTo(map);
}

// SHOT
function addShot() {}

// SET PIN
map.on('click', function(e){
  holePosition = [e.latlng.lat, e.latlng.lng];

  if (holeMarker) map.removeLayer(holeMarker);
  holeMarker = L.marker(holePosition).addTo(map);
});
</script>

</body>
</html>
