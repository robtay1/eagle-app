<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Eagle AI Caddie</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {margin:0;background:black;color:white;font-family:-apple-system;}

#map {height:60vh;width:100%;}

.panel {
  position:fixed;
  bottom:0;
  width:100%;
  background:rgba(0,0,0,0.9);
  padding:15px;
  border-radius:20px 20px 0 0;
}

.distance {
  text-align:center;
  font-size:36px;
  font-weight:bold;
}

.club {
  text-align:center;
  font-size:22px;
}

.ai {
  background:#1c1c1c;
  margin-top:10px;
  padding:10px;
  border-radius:10px;
}

button {
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:#00c853;
  color:black;
  font-size:16px;
}
</style>
</head>

<body>

<h2 style="text-align:center;">🏌️ Eagle AI Caddie</h2>

<div id="map"></div>

<div class="panel">
  <div class="distance" id="distance">--</div>
  <div class="club" id="club">--</div>

  <div class="ai" id="aiBox">
    AI Caddie:<br>Waiting...
  </div>

  <button onclick="startHole()">⛳ Start Hole</button>
  <button onclick="addShot()">+ Shot</button>
</div>

<script>
let map = L.map('map').setView([51.505, -0.09], 15);

L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

let userMarker, holeMarker;
let holePosition = null;

let shots = [];
let shotLine = null;
let shotMarkers = [];

let pinLine = null;
let rings = [];

// 📍 GPS
function updatePosition() {
  navigator.geolocation.getCurrentPosition(function(pos) {

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    map.setView([lat, lng], 17);

    if (!userMarker) {
      userMarker = L.marker([lat, lng]).addTo(map);
    } else {
      userMarker.setLatLng([lat, lng]);
    }

    if (holePosition) {
      let distance = map.distance([lat, lng], holePosition);
      let d = Math.round(distance);

      document.getElementById("distance").innerText = d + " m";

      let club = "Driver";
      if (distance < 200) club = "Iron";
      if (distance < 100) club = "Wedge";
      if (distance < 20) club = "Putter";

      document.getElementById("club").innerText = club;

      document.getElementById("aiBox").innerHTML =
        "<b>" + club + "</b><br>" +
        d + "m to pin<br>Aim straight<br>Smooth swing";

      // PIN LINE
      if (pinLine) map.removeLayer(pinLine);
      pinLine = L.polyline([[lat,lng], holePosition], {
        color:'white',
        dashArray:'5,10'
      }).addTo(map);
    }

  });
}

setInterval(updatePosition, 2000);

// ⛳ START HOLE
function startHole() {
  if (!userMarker) return;

  let pos = userMarker.getLatLng();

  holePosition = [pos.lat + 0.0005, pos.lng];

  if (holeMarker) map.removeLayer(holeMarker);
  holeMarker = L.marker(holePosition).addTo(map);

  // CLEAR SHOTS
  shots = [];
  if (shotLine) map.removeLayer(shotLine);
  shotMarkers.forEach(m => map.removeLayer(m));
  shotMarkers = [];

  // 🎯 RINGS
  rings.forEach(r => map.removeLayer(r));
  rings = [];

  [50,100,150].forEach(r => {
    let circle = L.circle(holePosition, {
      radius: r,
      color: 'white',
      fill:false,
      opacity:0.3
    }).addTo(map);
    rings.push(circle);
  });
}

// 🏌️ ADD SHOT
function addShot() {
  if (!userMarker) return;

  let pos = userMarker.getLatLng();
  let point = [pos.lat, pos.lng];

  shots.push(point);

  let dot = L.circleMarker(point, {
    radius:6,
    color:'yellow'
  }).addTo(map);

  shotMarkers.push(dot);

  if (shots.length > 1) {
    if (shotLine) map.removeLayer(shotLine);

    shotLine = L.polyline(shots, {
      color:'yellow',
      weight:4
    }).addTo(map);
  }
}

// 📍 TAP TO SET PIN
map.on('click', function(e) {
  holePosition = [e.latlng.lat, e.latlng.lng];

  if (holeMarker) map.removeLayer(holeMarker);
  holeMarker = L.marker(holePosition).addTo(map);
});
</script>

</body>
</html>
