<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eagle AI Caddie</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  margin:0;
  font-family:-apple-system;
  background:#0a0f0a;
  color:white;
}

/* TOP BAR */
.topbar {
  display:flex;
  justify-content:space-between;
  padding:12px 16px;
  background:#0f1a0f;
  border-bottom:1px solid #1f2f1f;
  font-size:14px;
}

.topbar span {
  color:#7fff7f;
}

/* MAP */
#map {
  height:45vh;
}

/* MAIN CARD */
.card {
  margin:12px;
  padding:18px;
  background:#121c12;
  border-radius:18px;
  text-align:center;
  border:1px solid #1f3a1f;
}

/* DISTANCE */
.distance {
  font-size:48px;
  font-weight:700;
  color:#7CFF8A;
}

/* CLUB */
.club {
  font-size:26px;
  margin:6px 0;
}

/* SUB INFO */
.sub {
  font-size:14px;
  color:#9dbb9d;
}

/* AI BOX */
.ai {
  margin-top:12px;
  padding:12px;
  background:#0f1a0f;
  border-radius:12px;
  border:1px solid #1f3a1f;
  font-size:14px;
}

/* ACTION BAR */
.actions {
  display:flex;
  gap:10px;
  padding:12px;
}

button {
  flex:1;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#00c853;
  color:black;
  font-size:16px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="topbar">
  <div>Hole 1 • Par 4</div>
  <div><span>Wind:</span> —</div>
</div>

<div id="map"></div>

<div class="card">
  <div class="distance" id="distance">--</div>
  <div class="club" id="club">--</div>
  <div class="sub" id="sub">Front -- | Back --</div>

  <div class="ai" id="aiBox">
    AI Caddie ready
  </div>
</div>

<div class="actions">
  <button onclick="startHole()">⛳ Start</button>
  <button onclick="addShot()">+ Shot</button>
</div>

<script>
let map = L.map('map');

L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

let userMarker, holeMarker;
let holePosition = null;

function updatePosition() {
  navigator.geolocation.getCurrentPosition(function(pos) {

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    if (!userMarker) {
      userMarker = L.marker([lat,lng]).addTo(map);
      map.setView([lat,lng],17);
    } else {
      userMarker.setLatLng([lat,lng]);
    }

    if (holePosition) {

      let d = Math.round(map.distance([lat,lng], holePosition));

      document.getElementById("distance").innerText = d + " m";

      let club = "Driver";
      if (d < 200) club = "Iron";
      if (d < 100) club = "Wedge";
      if (d < 20) club = "Putter";

      document.getElementById("club").innerText = club;

      let front = d - 10;
      let back = d + 10;

      document.getElementById("sub").innerText =
        "Front " + front + "m | Back " + back + "m";

      document.getElementById("aiBox").innerHTML =
        "<b>" + club + "</b><br>" +
        "Play " + d + "m<br>" +
        (d < 120 ? "Controlled shot" : "Full swing");

      map.fitBounds([[lat,lng], holePosition], {padding:[40,40]});
    }

  });
}

setInterval(updatePosition,2000);

function startHole() {
  if (!userMarker) return;

  let pos = userMarker.getLatLng();

  holePosition = [pos.lat + 0.0005, pos.lng];

  if (holeMarker) map.removeLayer(holeMarker);
  holeMarker = L.marker(holePosition).addTo(map);
}

function addShot() {}

map.on('click', function(e){
  holePosition = [e.latlng.lat, e.latlng.lng];

  if (holeMarker) map.removeLayer(holeMarker);
  holeMarker = L.marker(holePosition).addTo(map);
});
</script>

</body>
</html>
