<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EAGLE HAS LANDED</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body { margin:0; font-family:-apple-system; background:black; color:white; }
#map { position:absolute; top:0; bottom:0; width:100%; }

/* HEADER */
.header {
  position:absolute; top:0; width:100%; text-align:center;
  padding:14px; background:rgba(0,0,0,0.6); z-index:1000;
}
.holebar {
  position:absolute; top:50px; width:100%; text-align:center;
  padding:6px; background:rgba(0,0,0,0.5); z-index:1000;
}

/* BUTTONS */
.mapBtns {
  position:absolute;
  bottom:290px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
  z-index:1200;
}
.mapBtns button {
  background:rgba(30,30,30,0.9);
  color:white;
  border:none;
  padding:10px 14px;
  border-radius:12px;
  font-weight:bold;
}

/* STRIP */
.strip {
  position:absolute;
  bottom:250px;
  width:100%;
  text-align:center;
  background:rgba(0,0,0,0.6);
  padding:6px;
  z-index:1100;
}

/* CARD */
.card {
  position:absolute;
  bottom:110px;
  left:10px;
  right:10px;
  background:#1c1c1c;
  border-radius:20px;
  padding:14px;
  z-index:900;
}

.clubMain { font-size:26px; font-weight:bold; margin:8px 0; }

/* BOTTOM */
.bottom {
  position:absolute;
  bottom:0;
  width:100%;
  display:flex;
  z-index:1200;
}
.bottom button {
  flex:1;
  padding:18px;
  border:none;
  font-weight:bold;
}
.green { background:#2ecc71; }
.red { background:#e74c3c; }
.center { background:black; color:white; }

.label {
  background:black;
  padding:3px 6px;
  border-radius:6px;
}

/* SCORECARD */
.scoreWrap {
  margin-top:20px;
}

.scoreTable {
  width:100%;
  border-collapse:collapse;
}

.scoreTable td {
  border:1px solid #444;
  padding:8px;
  text-align:center;
}

.scoreTable input {
  width:35px;
  background:black;
  border:none;
  color:white;
  text-align:center;
}

.sectionTitle {
  margin-top:20px;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="header">🏌️ Eagle AI Caddie</div>
<div class="holebar">Hole 1 • Par 4 • 400y</div>

<div class="mapBtns">
<button onclick="setPin()">📍 Pin</button>
<button onclick="toggleMode()">🎯 Mode</button>
<button onclick="openScorecard()">📊 Score</button>
<button onclick="openPractice()">🎯 Practice</button>
</div>

<div class="strip" id="strip">Distance: --</div>

<div class="card">
<div class="clubMain" id="club">--</div>
<div>⛳ <span id="distToPin">--</span></div>
<div>🌬 Wind: <span id="wind">--</span></div>
<div>🎯 Aim: <span id="aim">Center</span></div>
<div>⚙️ Tip: <span id="tip">--</span></div>
</div>

<div class="bottom">
<button class="green" onclick="addShot()">+ Shot</button>
<button class="center" id="score">0</button>
<button class="red" onclick="removeShot()">-</button>
</div>

<!-- SCORECARD -->
<div id="scorecardScreen" style="display:none;position:absolute;top:0;width:100%;height:100%;background:black;z-index:3000;padding:15px;overflow:auto;">
<h2>Scorecard</h2>
<button onclick="closeScorecard()">⬅ Back</button>

<h3>Scan Scorecard</h3>
<input type="file" id="scoreImg">
<button onclick="scanScorecard()">Scan</button>

<pre id="scoreOCR"></pre>

<div class="scoreWrap" id="scoreWrap"></div>
</div>

<script>
let map = L.map('map').setView([51.505,-0.09],13);

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{maxZoom:19}
).addTo(map);

let userMarker, holeMarker, holePos=null;
let guideLine=null;
let rings=[],labels=[];
let currentTarget=null;
let mode="pin";

let scores=JSON.parse(localStorage.getItem("scores")||JSON.stringify(Array(18).fill(0)));
let pars=Array(18).fill(4);

/* GPS */
navigator.geolocation.watchPosition(pos=>{
let lat=pos.coords.latitude,lng=pos.coords.longitude;

if(!userMarker){
userMarker=L.marker([lat,lng]).addTo(map);
map.setView([lat,lng],18);
}else userMarker.setLatLng([lat,lng]);

update(lat,lng);
});

/* UPDATE */
function update(lat,lng){
if(!holePos) return;

let d=Math.round(map.distance([lat,lng],holePos));

strip.innerText="Distance: "+d+"m";
distToPin.innerText=d+"m";

/* RINGS (RESTORED) */
rings.forEach(r=>map.removeLayer(r));
labels.forEach(l=>map.removeLayer(l));
rings=[];labels=[];

[50,100,150].forEach(r=>{
rings.push(L.circle(holePos,{radius:r,color:'white',fill:false}).addTo(map));
labels.push(L.marker([holePos[0],holePos[1]+(r/111320)],{
icon:L.divIcon({className:'label',html:r+"m"})
}).addTo(map));
});
}

/* PIN */
function setPin(){
map.once('click',e=>{
holePos=[e.latlng.lat,e.latlng.lng];
if(holeMarker) map.removeLayer(holeMarker);
holeMarker=L.marker(holePos).addTo(map);
});
}

/* SCORECARD */
function openScorecard(){
scorecardScreen.style.display="block";
renderScorecard();
}
function closeScorecard(){
scorecardScreen.style.display="none";
}

/* OCR FIX */
async function scanScorecard(){
let file = scoreImg.files[0];
if(!file) return;

scoreOCR.innerText="Scanning...";

const {data:{text}}=await Tesseract.recognize(file,'eng');
scoreOCR.innerText=text;

let nums = text.match(/\d+/g)||[];

let filtered = nums.map(n=>parseInt(n)).filter(n=>n>0 && n<=12);

for(let i=0;i<18;i++){
scores[i]=filtered[i]||0;
}

localStorage.setItem("scores",JSON.stringify(scores));
renderScorecard();
}

/* RENDER */
function renderScorecard(){

let html="";

/* FRONT 9 */
html+="<div class='sectionTitle'>Front 9</div>";
html+="<table class='scoreTable'><tr><td>Hole</td>";

for(let i=1;i<=9;i++) html+="<td>"+i+"</td>";
html+="<td>OUT</td></tr>";

html+="<tr><td>Par</td>";
for(let i=0;i<9;i++){
html+=`<td><input value="${pars[i]}" onchange="pars[${i}]=parseInt(this.value)||4"></td>`;
}
html+=`<td>${pars.slice(0,9).reduce((a,b)=>a+b,0)}</td></tr>`;

html+="<tr><td>Score</td>";
for(let i=0;i<9;i++){
html+=`<td><input value="${scores[i]}" onchange="updateScore(${i},this.value)"></td>`;
}
html+=`<td>${scores.slice(0,9).reduce((a,b)=>a+b,0)}</td></tr>`;
html+="</table>";

/* BACK 9 */
html+="<div class='sectionTitle'>Back 9</div>";
html+="<table class='scoreTable'><tr><td>Hole</td>";

for(let i=10;i<=18;i++) html+="<td>"+i+"</td>";
html+="<td>IN</td></tr>";

html+="<tr><td>Par</td>";
for(let i=9;i<18;i++){
html+=`<td><input value="${pars[i]}" onchange="pars[${i}]=parseInt(this.value)||4"></td>`;
}
html+=`<td>${pars.slice(9).reduce((a,b)=>a+b,0)}</td></tr>`;

html+="<tr><td>Score</td>";
for(let i=9;i<18;i++){
html+=`<td><input value="${scores[i]}" onchange="updateScore(${i},this.value)"></td>`;
}
html+=`<td>${scores.slice(9).reduce((a,b)=>a+b,0)}</td></tr>`;
html+="</table>";

/* TOTAL */
let total = scores.reduce((a,b)=>a+b,0);
html+=`<h3>Total: ${total}</h3>`;

scoreWrap.innerHTML=html;
}

function updateScore(i,val){
scores[i]=parseInt(val)||0;
localStorage.setItem("scores",JSON.stringify(scores));
renderScorecard();
}

/* BASIC */
function toggleMode(){}
function openPractice(){}
function addShot(){score.innerText=parseInt(score.innerText)+1;}
function removeShot(){score.innerText=Math.max(0,score.innerText-1);}
</script>

</body>
</html>
