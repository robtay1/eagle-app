<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EAGLE HAS LANDED</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body { margin:0; font-family:-apple-system; background:black; color:white; }
#map { position:absolute; top:0; bottom:0; width:100%; }

/* HEADER */
.header {
  position:absolute; top:0; width:100%; text-align:center;
  padding:14px; background:rgba(0,0,0,0.6); z-index:1000;
}
.holebar {
  position:absolute; top:50px; width:100%; text-align:center;
  padding:6px; background:rgba(0,0,0,0.5); z-index:1000;
}

/* BUTTONS */
.mapBtns {
  position:absolute;
  bottom:290px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
  z-index:1200;
}
.mapBtns button {
  background:rgba(30,30,30,0.9);
  color:white;
  border:none;
  padding:10px 14px;
  border-radius:12px;
  font-weight:bold;
}

/* STRIP */
.strip {
  position:absolute;
  bottom:250px;
  width:100%;
  text-align:center;
  background:rgba(0,0,0,0.6);
  padding:6px;
  z-index:1100;
}

/* CARD */
.card {
  position:absolute;
  bottom:110px;
  left:10px;
  right:10px;
  background:#1c1c1c;
  border-radius:20px;
  padding:14px;
  z-index:900;
}

.clubMain { font-size:26px; font-weight:bold; margin:8px 0; }
.caddieList div { font-size:13px; margin:4px 0; }

/* BOTTOM */
.bottom {
  position:absolute;
  bottom:0;
  width:100%;
  display:flex;
  z-index:1200;
}
.bottom button {
  flex:1;
  padding:18px;
  border:none;
  font-weight:bold;
}
.green { background:#2ecc71; }
.red { background:#e74c3c; }
.center { background:black; color:white; }

.label {
  background:black;
  padding:3px 6px;
  border-radius:6px;
}

/* PRACTICE */
.clubRow {
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,0.1);
}
.clubRight {
  display:flex;
  gap:10px;
  align-items:center;
}
.clubRight input {
  width:60px;
  background:transparent;
  border:none;
  color:white;
  text-align:right;
}
.removeBtn {
  background:none;
  border:none;
  color:#ff6b6b;
  font-size:18px;
}

/* SCORECARD */
.scoreWrap {
  overflow-x:auto;
  margin-top:15px;
}
.scoreTable {
  border-collapse:collapse;
  min-width:1100px;
  background:white;
  color:black;
  font-size:12px;
}
.scoreTable td {
  border:1px solid #aaa;
  padding:6px;
  text-align:center;
}
.scoreTable .head {
  background:#eee;
  font-weight:bold;
}
.whiteTee { background:#f5f5f5; }
.yellowTee { background:#ffe066; }
.redTee { background:#ff6b6b; color:white; }
.si { color:red; font-weight:bold; }

.scoreInput {
  width:40px;
  border:none;
  text-align:center;
}

.selectYN { width:60px; }
.selectNum { width:60px; }
</style>
</head>

<body>

<div id="map"></div>

<div class="header">🏌️ Eagle AI Caddie</div>
<div class="holebar">Hole 1 • Par 4 • 400y</div>

<div class="mapBtns">
<button onclick="setPin()">📍 Pin</button>
<button onclick="toggleMode()">🎯 Mode</button>
<button onclick="openScorecard()">📊 Score</button>
<button onclick="openPractice()">🎯 Practice</button>
</div>

<div class="strip" id="strip">Distance: --</div>

<div class="card">
<div class="clubMain" id="club">--</div>
<div class="caddieList">
<div>⛳ <span id="distToPin">--</span></div>
<div>🌬 Wind: <span id="wind">--</span></div>
<div>🎯 Aim: <span id="aim">Center</span></div>
<div>⚙️ Tip: <span id="tip">--</span></div>
</div>
</div>

<div class="bottom">
<button class="green" onclick="addShot()">+ Shot</button>
<button class="center" id="score">0</button>
<button class="red" onclick="removeShot()">-</button>
</div>

<!-- PRACTICE -->
<div id="practiceScreen" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:black;z-index:2000;padding:20px;overflow:auto;">
<h2>Practice</h2>
<button onclick="closePractice()">⬅ Back</button>
<input type="file" id="imgUpload">
<button onclick="handleImage()">Import</button>
<button onclick="resetClubs()">Reset</button>
<pre id="ocrOutput"></pre>
<div id="clubs"></div>
</div>

<!-- SCORECARD -->
<div id="scorecardScreen" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:black;z-index:3000;padding:15px;overflow:auto;">
<h2>Scorecard</h2>
<button onclick="closeScorecard()">⬅ Back</button>

<input type="file" id="scoreImg">
<button onclick="scanScorecard()">Scan</button>

<pre id="scoreOCR"></pre>

<div class="scoreWrap">
<table class="scoreTable">
<tbody id="scoreTable"></tbody>
</table>
</div>
</div>

<script>
let map = L.map('map').setView([51.505,-0.09],13);

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{maxZoom:19}
).addTo(map);

let userMarker, holeMarker, holePos=null;
let rings=[],labels=[];
let scores=Array(18).fill(0);
let pars=[5,4,3,5,4,3,4,3,4,4,3,5,3,4,5,4,3,4];
let si=[8,6,18,14,2,12,16,10,4,1,11,7,13,3,9,5,17,15];

let fh=Array(18).fill("");
let gir=Array(18).fill("");
let putts=Array(18).fill("");

let white=[533,394,140,465,421,204,312,155,425,462,164,507,208,422,525,386,185,355];
let yellow=[503,317,135,460,381,179,306,147,360,424,130,500,193,410,469,351,137,319];
let red=[442,317,128,422,344,153,272,127,355,382,106,436,161,392,429,349,118,284];

/* DROPDOWN HELPER */
function numberOptions(val){
let html="<option value=''>-</option>";
for(let i=0;i<=20;i++){
html+=`<option value="${i}" ${val==i?"selected":""}>${i}</option>`;
}
return html;
}

/* GPS */
navigator.geolocation.watchPosition(pos=>{
let lat=pos.coords.latitude,lng=pos.coords.longitude;

if(!userMarker){
userMarker=L.marker([lat,lng]).addTo(map);
map.setView([lat,lng],18);
}else userMarker.setLatLng([lat,lng]);

update(lat,lng);
});

/* UPDATE */
function update(lat,lng){
if(!holePos) return;

let d=Math.round(map.distance([lat,lng],holePos));
strip.innerText="Distance: "+d+"m";

rings.forEach(r=>map.removeLayer(r));
labels.forEach(l=>map.removeLayer(l));
rings=[];labels=[];

[50,100,150].forEach(r=>{
rings.push(L.circle(holePos,{radius:r,color:'white',fill:false}).addTo(map));
labels.push(L.marker([holePos[0],holePos[1]+(r/111320)],{
icon:L.divIcon({className:'label',html:r+"m"})
}).addTo(map));
});
}

function setPin(){
map.once('click',e=>{
holePos=[e.latlng.lat,e.latlng.lng];
if(holeMarker) map.removeLayer(holeMarker);
holeMarker=L.marker(holePos).addTo(map);
});
}

/* SCORECARD */
function openScorecard(){
scorecardScreen.style.display="block";
renderScorecard();
}
function closeScorecard(){
scorecardScreen.style.display="none";
}

async function scanScorecard(){
let file = scoreImg.files[0];
if(!file) return;

const {data:{text}} = await Tesseract.recognize(file,'eng');
scoreOCR.innerText = text;
}

/* RENDER */
function renderScorecard(){
let html="";

html+="<tr class='head'><td>Hole</td>";
for(let i=1;i<=18;i++) html+="<td>"+i+"</td>";
html+="</tr>";

html+="<tr><td>White</td>"; white.forEach(v=>html+=`<td class='whiteTee'>${v}</td>`); html+="</tr>";
html+="<tr><td>Yellow</td>"; yellow.forEach(v=>html+=`<td class='yellowTee'>${v}</td>`); html+="</tr>";
html+="<tr><td>Red</td>"; red.forEach(v=>html+=`<td class='redTee'>${v}</td>`); html+="</tr>";

html+="<tr><td>Par</td>"; pars.forEach(v=>html+=`<td>${v}</td>`); html+="</tr>";
html+="<tr><td>S.I</td>"; si.forEach(v=>html+=`<td class='si'>${v}</td>`); html+="</tr>";

html+="<tr><td>FH</td>";
fh.forEach((v,i)=>{
html+=`<td>
<select class="selectYN" onchange="fh[${i}]=this.value">
<option value="">-</option>
<option value="Y" ${v==="Y"?"selected":""}>Y</option>
<option value="N" ${v==="N"?"selected":""}>N</option>
</select>
</td>`;
});
html+="</tr>";

html+="<tr><td>GIR</td>";
gir.forEach((v,i)=>{
html+=`<td>
<select class="selectYN" onchange="gir[${i}]=this.value">
<option value="">-</option>
<option value="Y" ${v==="Y"?"selected":""}>Y</option>
<option value="N" ${v==="N"?"selected":""}>N</option>
</select>
</td>`;
});
html+="</tr>";

/* ✅ UPDATED PUTTS */
html+="<tr><td>PUTTS</td>";
putts.forEach((v,i)=>{
html+=`<td><select class="selectNum" onchange="putts[${i}]=this.value">${numberOptions(v)}</select></td>`;
});
html+="</tr>";

/* ✅ UPDATED SCORE */
html+="<tr><td>Score</td>";
scores.forEach((v,i)=>{
html+=`<td><select class="selectNum" onchange="scores[${i}]=this.value">${numberOptions(v)}</select></td>`;
});
html+="</tr>";

scoreTable.innerHTML=html;
}

/* KEEP EVERYTHING */
function toggleMode(){}
function openPractice(){}
function closePractice(){practiceScreen.style.display="none";}
function addShot(){score.innerText=parseInt(score.innerText)+1;}
function removeShot(){score.innerText=Math.max(0,score.innerText-1);}
</script>

</body>
</html>
