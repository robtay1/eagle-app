<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EAGLE HAS LANDED</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:-apple-system; background:black; color:white; }

#map { position:absolute; height:100vh; width:100%; }

/* HEADER */
.header {
  position:absolute;
  top:0;
  width:100%;
  text-align:center;
  padding:14px;
  background:rgba(0,0,0,0.6);
  font-weight:bold;
  z-index:1000;
}

.holebar {
  position:absolute;
  top:50px;
  width:100%;
  text-align:center;
  padding:6px;
  background:rgba(0,0,0,0.5);
  z-index:1000;
}

/* FLOATING BUTTONS */
.mapBtns {
  position:absolute;
  bottom:260px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:12px;
  z-index:1000;
}

.mapBtns button {
  background:rgba(30,30,30,0.9);
  color:white;
  border:none;
  padding:12px 18px;
  border-radius:12px;
  font-weight:bold;
  box-shadow:0 4px 10px rgba(0,0,0,0.5);
}

/* DISTANCE STRIP */
.strip {
  position:absolute;
  bottom:220px;
  width:100%;
  text-align:center;
  background:rgba(0,0,0,0.6);
  padding:6px;
  font-size:14px;
  z-index:1000;
}

/* AI CARD — FIXED SIZE (KEY FIX) */
.card {
  position:absolute;
  bottom:72px; /* moved down ~10mm */
  left:10px;
  right:10px;
  height:130px; /* fixed height prevents expansion */
  background:#1c1c1c;
  border-radius:20px;
  padding:16px;
  z-index:1000;
  box-shadow:0 -5px 20px rgba(0,0,0,0.6);
  overflow:hidden; /* stops layout shift */
}

.card h2 {
  font-size:34px;
  margin:4px 0;
}

.card ul {
  margin-top:6px;
  font-size:14px;
  line-height:1.4;
}

/* BOTTOM BUTTONS */
.bottom {
  position:absolute;
  bottom:0;
  width:100%;
  display:flex;
  z-index:1000;
}

.bottom button {
  flex:1;
  padding:18px;
  border:none;
  font-weight:bold;
  font-size:16px;
}

.green { background:#2ecc71; }
.red { background:#e74c3c; }
.center { background:black; color:white; }

/* RING LABELS */
.label {
  background:rgba(0,0,0,0.8);
  color:white;
  padding:3px 8px;
  border-radius:8px;
  font-size:12px;
}

/* SCORECARD */
#scorecardScreen {
  display:none;
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#111;
  z-index:2000;
  padding:15px;
  overflow:auto;
}

.scoreHeader {
  font-size:22px;
  font-weight:bold;
  margin-bottom:10px;
}

.scoreInputs {
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

.scoreInputs input {
  flex:1;
  padding:8px;
  border-radius:6px;
  border:none;
}

table {
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

th, td {
  border:1px solid #333;
  padding:6px;
  text-align:center;
}

th {
  background:#1e7f4f;
}

.totalRow {
  background:#1e7f4f;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="header">🏌️ EAGLE HAS LANDED</div>
<div class="holebar">Hole 1 • Par 4 • 400y</div>

<div class="mapBtns">
  <button onclick="setPin()">📍 Set Pin</button>
  <button onclick="clearShots()">🧹 Clear Shots</button>
  <button onclick="openScorecard()">📊 Scorecard</button>
</div>

<div class="strip" id="strip">Distance to Pin: --</div>

<div class="card">
  <div>AI Caddie Advice</div>
  <h2 id="club">--</h2>
  <ul id="advice">
    <li>Set pin to begin</li>
  </ul>
</div>

<div class="bottom">
  <button class="green" onclick="addShot()">+ Add Shot</button>
  <button class="center" id="score">0 Stroke</button>
  <button class="red" onclick="removeShot()">- Remove</button>
</div>

<!-- SCORECARD -->
<div id="scorecardScreen">

  <div class="scoreHeader">📊 Virtual Scorecard</div>

  <button onclick="closeScorecard()">⬅ Back</button>

  <div class="scoreInputs">
    <input placeholder="Course Name">
    <input placeholder="Handicap Index">
    <input placeholder="Playing Handicap">
  </div>

  <table>
    <tr>
      <th>Hole</th><th>Par</th><th>SI</th>
      <th>White</th><th>Yellow</th><th>Red</th>
      <th>FW</th><th>GIR</th><th>Putts</th><th>Total</th>
    </tr>

    <!-- 9 holes -->
    <script>
      for(let i=1;i<=9;i++){
        document.write(`
          <tr>
            <td>${i}</td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td><select><option>Y</option><option>N</option></select></td>
            <td><select><option>Y</option><option>N</option></select></td>
            <td><input style="width:40px"></td>
            <td><input style="width:40px"></td>
          </tr>
        `);
      }
    </script>

    <tr class="totalRow">
      <td>Total</td>
      <td></td><td></td><td></td><td></td><td></td>
      <td></td><td></td><td></td><td></td>
    </tr>
  </table>

</div>

<script>
let map = L.map('map');

L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 19 }
).addTo(map);

let userIcon = L.divIcon({
  html:'<div style="width:14px;height:14px;background:#00aaff;border-radius:50%;border:3px solid white;"></div>',
  iconSize:[20,20]
});

let flagIcon = L.divIcon({
  html:'🏁',
  iconSize:[20,20]
});

let userMarker, holeMarker, holePos=null;
let shots=[], shotLines=[];

function updateGPS() {
  navigator.geolocation.getCurrentPosition(pos => {
    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    if (!userMarker) {
      userMarker = L.marker([lat,lng], {icon:userIcon}).addTo(map);
      map.setView([lat,lng],18);
    } else {
      userMarker.setLatLng([lat,lng]);
    }

    if (holePos) {
      let d = Math.round(map.distance([lat,lng], holePos));
      document.getElementById("club").innerText = "Club";
      document.getElementById("strip").innerText = "Distance: " + d + "m";
    }
  });
}

setInterval(updateGPS,2000);

function setPin() {
  map.once('click', e => {
    holePos = [e.latlng.lat, e.latlng.lng];
    if (holeMarker) map.removeLayer(holeMarker);
    holeMarker = L.marker(holePos, {icon:flagIcon}).addTo(map);
  });
}

function addShot(){
  shots.push(1);
  document.getElementById("score").innerText = shots.length + " Stroke";
}

function removeShot(){
  shots.pop();
  document.getElementById("score").innerText = shots.length + " Stroke";
}

function clearShots(){
  shots=[];
  document.getElementById("score").innerText="0 Stroke";
}

function openScorecard(){
  document.getElementById("scorecardScreen").style.display="block";
}

function closeScorecard(){
  document.getElementById("scorecardScreen").style.display="none";
}
</script>

</body>
</html>
