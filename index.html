<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EAGLE HAS LANDED</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body { margin:0; font-family:-apple-system; background:black; color:white; }
#map { position:absolute; top:0; bottom:0; width:100%; }

.header {
  position:absolute; top:0; width:100%; text-align:center;
  padding:14px; background:rgba(0,0,0,0.6); z-index:1000;
}

.holebar {
  position:absolute; top:50px; width:100%; text-align:center;
  padding:6px; background:rgba(0,0,0,0.5); z-index:1000;
}

.mapBtns {
  position:absolute;
  bottom:290px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
  z-index:1200;
}

.mapBtns button {
  background:rgba(30,30,30,0.9);
  color:white;
  border:none;
  padding:10px 14px;
  border-radius:12px;
  font-weight:bold;
}

.strip {
  position:absolute;
  bottom:250px;
  width:100%;
  text-align:center;
  background:rgba(0,0,0,0.6);
  padding:6px;
  z-index:1100;
}

.card {
  position:absolute;
  bottom:110px;
  left:10px;
  right:10px;
  background:#1c1c1c;
  border-radius:20px;
  padding:14px;
  z-index:900;
}

.clubMain { font-size:26px; font-weight:bold; margin:8px 0; }

.bottom {
  position:absolute;
  bottom:0;
  width:100%;
  display:flex;
  z-index:1200;
}

.bottom button {
  flex:1;
  padding:18px;
  border:none;
  font-weight:bold;
}

.green { background:#2ecc71; }
.red { background:#e74c3c; }
.center { background:black; color:white; }

.label {
  background:black;
  padding:3px 6px;
  border-radius:6px;
}

/* SCORECARD GRID */
.scoreGrid {
  overflow-x:auto;
  margin-top:15px;
}

.scoreGrid table {
  border-collapse:collapse;
  min-width:900px;
}

.scoreGrid td {
  border:1px solid #444;
  padding:6px;
  text-align:center;
}

.scoreGrid input {
  width:40px;
  background:black;
  border:none;
  color:white;
  text-align:center;
}

.totalCell {
  font-weight:bold;
  background:#111;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="header">🏌️ Eagle AI Caddie</div>
<div class="holebar">Hole 1 • Par 4 • 400y</div>

<div class="mapBtns">
<button onclick="setPin()">📍 Pin</button>
<button onclick="toggleMode()">🎯 Mode</button>
<button onclick="openScorecard()">📊 Score</button>
<button onclick="openPractice()">🎯 Practice</button>
</div>

<div class="strip" id="strip">Distance: --</div>

<div class="card">
<div class="clubMain" id="club">--</div>
<div>⛳ <span id="distToPin">--</span></div>
<div>🌬 Wind: <span id="wind">--</span></div>
<div>🎯 Aim: <span id="aim">Center</span></div>
<div>⚙️ Tip: <span id="tip">--</span></div>
</div>

<div class="bottom">
<button class="green" onclick="addShot()">+ Shot</button>
<button class="center" id="score">0</button>
<button class="red" onclick="removeShot()">-</button>
</div>

<!-- SCORECARD -->
<div id="scorecardScreen" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:black;z-index:3000;padding:15px;overflow:auto;">
<h2>Scorecard</h2>
<button onclick="closeScorecard()">⬅ Back</button>

<h3>Scan Scorecard</h3>
<input type="file" id="scoreImg">
<button onclick="scanScorecard()">Scan</button>

<pre id="scoreOCR"></pre>

<div class="scoreGrid" id="scoreGrid"></div>
</div>

<script>
let map = L.map('map').setView([51.505,-0.09],13);

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{maxZoom:19}
).addTo(map);

let userMarker, holeMarker, holePos=null;
let targetMarker=null;
let guideLine=null;
let rings=[],labels=[];
let currentTarget=null;
let mode="pin";

let clubs=JSON.parse(localStorage.getItem("clubs")||"[]");
let scores=JSON.parse(localStorage.getItem("scores")||JSON.stringify(Array(18).fill(0)));
let pars=Array(18).fill(4);
let shots=[];

/* GPS */
navigator.geolocation.watchPosition(pos=>{
let lat=pos.coords.latitude,lng=pos.coords.longitude;

if(!userMarker){
userMarker=L.marker([lat,lng]).addTo(map);
map.setView([lat,lng],18);
}else userMarker.setLatLng([lat,lng]);

update(lat,lng);
});

/* UPDATE */
function update(lat,lng){
let target = holePos;
if(!target) return;

let d=Math.round(map.distance([lat,lng],target));

strip.innerText="Distance: "+d+"m";
distToPin.innerText=d+"m";
}

/* SCORECARD */
function openScorecard(){
scorecardScreen.style.display="block";
renderScorecard();
}

function closeScorecard(){
scorecardScreen.style.display="none";
}

/* OCR */
async function scanScorecard(){
let file = scoreImg.files[0];
if(!file) return;

scoreOCR.innerText="Scanning...";

const {data:{text}}=await Tesseract.recognize(file,'eng');
scoreOCR.innerText=text;

let rawNums = text.match(/\d+/g)||[];

let filtered = rawNums.map(n=>parseInt(n)).filter(n=>n>0 && n<=12);

for(let i=0;i<18;i++){
scores[i]=filtered[i]||0;
}

localStorage.setItem("scores",JSON.stringify(scores));
renderScorecard();
}

/* GRID */
function renderScorecard(){

let front = scores.slice(0,9).reduce((a,b)=>a+b,0);
let back = scores.slice(9).reduce((a,b)=>a+b,0);
let total = front + back;

let html="<table><tr><td>Hole</td>";

for(let i=1;i<=18;i++) html+="<td>"+i+"</td>";

html+="<td class='totalCell'>OUT</td><td class='totalCell'>IN</td><td class='totalCell'>TOT</td></tr>";

html+="<tr><td>Par</td>";
pars.forEach((p,i)=>{
html+=`<td><input value="${p}" onchange="pars[${i}]=parseInt(this.value)||4"></td>`;
});
html+=`<td class='totalCell'>${pars.slice(0,9).reduce((a,b)=>a+b,0)}</td>`;
html+=`<td class='totalCell'>${pars.slice(9).reduce((a,b)=>a+b,0)}</td>`;
html+=`<td class='totalCell'>${pars.reduce((a,b)=>a+b,0)}</td></tr>`;

html+="<tr><td>Score</td>";
scores.forEach((s,i)=>{
html+=`<td><input value="${s}" onchange="updateScore(${i},this.value)"></td>`;
});
html+=`<td class='totalCell'>${front}</td>`;
html+=`<td class='totalCell'>${back}</td>`;
html+=`<td class='totalCell'>${total}</td></tr>`;

html+="</table>";

scoreGrid.innerHTML=html;
}

function updateScore(i,val){
scores[i]=parseInt(val)||0;
localStorage.setItem("scores",JSON.stringify(scores));
renderScorecard();
}

/* BASIC APP FUNCTIONS */
function setPin(){map.once('click',e=>{
holePos=[e.latlng.lat,e.latlng.lng];
if(holeMarker) map.removeLayer(holeMarker);
holeMarker=L.marker(holePos).addTo(map);
});}

function toggleMode(){}
function openPractice(){}

function addShot(){
if(userMarker){
shots.push(userMarker.getLatLng());
L.polyline(shots).addTo(map);
}
score.innerText=parseInt(score.innerText)+1;
}

function removeShot(){
score.innerText=Math.max(0,score.innerText-1);
}
</script>

</body>
</html>
