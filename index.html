<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Eagle AI Caddie</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  margin:0;
  background:black;
  font-family:-apple-system;
  color:white;
}

/* MAP */
#map {
  height:100vh;
  width:100%;
}

/* TOP HUD */
.hud {
  position:absolute;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(12px);
  padding:12px 20px;
  border-radius:20px;
  text-align:center;
}

.distance {
  font-size:34px;
  font-weight:bold;
}

.club {
  font-size:18px;
}

/* BOTTOM PANEL */
.panel {
  position:absolute;
  bottom:0;
  width:100%;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(15px);
  padding:15px;
  border-radius:20px 20px 0 0;
}

/* AI BOX */
.ai {
  background:rgba(255,255,255,0.05);
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
  font-size:14px;
}

/* BUTTONS */
button {
  width:100%;
  padding:14px;
  margin-top:8px;
  border:none;
  border-radius:12px;
  background:#00c853;
  color:black;
  font-size:16px;
}
</style>
</head>

<body>

<div id="map"></div>

<!-- TOP DISPLAY -->
<div class="hud">
  <div class="distance" id="distance">--</div>
  <div class="club" id="club">--</div>
</div>

<!-- BOTTOM PANEL -->
<div class="panel">

  <div class="ai" id="aiBox">
    AI Caddie:<br>Ready
  </div>

  <button onclick="startHole()">⛳ Start Hole</button>
  <button onclick="addShot()">+ Shot</button>

</div>

<script>
let map = L.map('map');

L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

let userMarker, holeMarker;
let holePosition = null;

let shots = [];
let shotLine = null;
let shotMarkers = [];

let pinLine = null;
let rings = [];

// GPS
function updatePosition() {
  navigator.geolocation.getCurrentPosition(function(pos) {

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    if (!userMarker) {
      userMarker = L.marker([lat, lng]).addTo(map);
    } else {
      userMarker.setLatLng([lat, lng]);
    }

    if (holePosition) {

      let bounds = L.latLngBounds([lat, lng], holePosition);
      map.fitBounds(bounds, {padding:[80,80]});

      let distance = map.distance([lat, lng], holePosition);
      let d = Math.round(distance);

      document.getElementById("distance").innerText = d + " m";

      let club = "Driver";
      if (distance < 200) club = "Iron";
      if (distance < 100) club = "Wedge";
      if (distance < 20) club = "Putter";

      document.getElementById("club").innerText = club;

      document.getElementById("aiBox").innerHTML =
        "<b>" + club + "</b><br>" +
        "Play " + d + "m<br>" +
        (d < 120 ? "Controlled swing" : "Full swing");

      if (pinLine) map.removeLayer(pinLine);
      pinLine = L.polyline([[lat,lng], holePosition], {
        color:'white',
        dashArray:'5,10'
      }).addTo(map);
    }

  });
}

setInterval(updatePosition, 2000);

// START HOLE
function startHole() {
  if (!userMarker) return;

  let pos = userMarker.getLatLng();

  holePosition = [pos.lat + 0.0005, pos.lng];

  if (holeMarker) map.removeLayer(holeMarker);
  holeMarker = L.marker(holePosition).addTo(map);

  shots = [];
  if (shotLine) map.removeLayer(shotLine);
  shotMarkers.forEach(m => map.removeLayer(m));
  shotMarkers = [];

  rings.forEach(r => map.removeLayer(r));
  rings = [];

  [50,100,150].forEach(r => {
    let circle = L.circle(holePosition, {
      radius: r,
      color: 'white',
      fill:false,
      opacity:0.3
    }).addTo(map);
    rings.push(circle);
  });
}

// SHOTS
function addShot() {
  if (!userMarker) return;

  let pos = userMarker.getLatLng();
  let point = [pos.lat, pos.lng];

  shots.push(point);

  let dot = L.circleMarker(point, {
    radius:6,
    color:'yellow'
  }).addTo(map);

  shotMarkers.push(dot);

  if (shots.length > 1) {
    if (shotLine) map.removeLayer(shotLine);

    shotLine = L.polyline(shots, {
      color:'yellow',
      weight:4
    }).addTo(map);
  }
}

// SET PIN
map.on('click', function(e) {
  holePosition = [e.latlng.lat, e.latlng.lng];

  if (holeMarker) map.removeLayer(holeMarker);
  holeMarker = L.marker(holePosition).addTo(map);
});
</script>

</body>
</html>
