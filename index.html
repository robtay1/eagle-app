<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eagle AI Caddie</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  margin:0;
  background:black;
  color:white;
  font-family:-apple-system;
  text-align:center;
}

#map {
  height:55vh;
  width:100%;
}

.info { font-size:18px; margin:6px; }
#score { font-size:28px; margin:8px; }

button {
  width:90%;
  padding:12px;
  margin:6px;
  border:none;
  border-radius:10px;
  background:#00c853;
  color:black;
  font-size:16px;
}
</style>
</head>

<body>

<h2>🏌️ Eagle AI Caddie</h2>

<div id="map"></div>

<div class="info" id="distance">Distance: --</div>
<div class="info" id="club">Club: --</div>
<div id="score">Score: 0</div>

<button onclick="startHole()">⛳ Start Hole</button>
<button onclick="addShot()">+ Shot</button>

<script>
let map = L.map('map').setView([51.505, -0.09], 15);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

let userMarker = null;
let holeMarker = null;
let holePosition = null;

let score = 0;
let shots = [];
let shotLine = null;
let shotMarkers = [];

// GPS LOOP
function updatePosition() {
  navigator.geolocation.getCurrentPosition(function(pos) {

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    map.setView([lat, lng], 17);

    if (!userMarker) {
      userMarker = L.marker([lat, lng]).addTo(map);
    } else {
      userMarker.setLatLng([lat, lng]);
    }

    if (holePosition) {
      let distance = map.distance([lat, lng], holePosition);

      document.getElementById("distance").innerText =
        "Distance: " + Math.round(distance) + " m";

      let club = "Driver";
      if (distance < 200) club = "Iron";
      if (distance < 100) club = "Wedge";
      if (distance < 20) club = "Putter";

      document.getElementById("club").innerText =
        "Club: " + club;
    }

  });
}

setInterval(updatePosition, 2000);

// ⛳ START HOLE (FIXED)
function startHole() {
  if (!userMarker) return;

  // ONLY set hole if none exists
  if (!holePosition) {
    let pos = userMarker.getLatLng();
    holePosition = [pos.lat + 0.0005, pos.lng];
  }

  if (holeMarker) map.removeLayer(holeMarker);
  holeMarker = L.marker(holePosition).addTo(map);

  // RESET SHOTS ONLY
  shots = [];

  if (shotLine) {
    map.removeLayer(shotLine);
    shotLine = null;
  }

  shotMarkers.forEach(m => map.removeLayer(m));
  shotMarkers = [];

  score = 0;
  document.getElementById("score").innerText = "Score: 0";
}

// ADD SHOT
function addShot() {
  if (!userMarker) return;

  let pos = userMarker.getLatLng();
  let point = [pos.lat, pos.lng];

  shots.push(point);

  let marker = L.circleMarker(point, {
    radius: 6,
    color: 'yellow'
  }).addTo(map);

  shotMarkers.push(marker);

  if (shots.length > 1) {
    if (shotLine) map.removeLayer(shotLine);

    shotLine = L.polyline(shots, {
      color: 'yellow',
      weight: 4
    }).addTo(map);
  }

  score++;
  document.getElementById("score").innerText = "Score: " + score;
}

// 🎯 TAP SETS HOLE (MAIN CONTROL)
map.on('click', function(e) {
  holePosition = [e.latlng.lat, e.latlng.lng];

  if (holeMarker) map.removeLayer(holeMarker);
  holeMarker = L.marker(holePosition).addTo(map);
});
</script>

</body>
</html>
