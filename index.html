<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eagle AI Caddie</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  margin:0;
  background:black;
  color:white;
  font-family:-apple-system;
  text-align:center;
}

h2 {
  padding:10px;
}

#map {
  height:60vh;
  width:100%;
}

.info {
  font-size:20px;
  margin:8px;
}

#score {
  font-size:40px;
  margin:10px;
}

button {
  width:90%;
  padding:15px;
  margin:8px;
  border:none;
  border-radius:10px;
  background:limegreen;
  color:black;
  font-size:18px;
}
</style>
</head>

<body>

<h2>🏌️ Eagle AI Caddie</h2>

<div id="map"></div>

<div class="info" id="distance">Distance: --</div>
<div class="info" id="club">Club: --</div>
<div id="score">Score: 0</div>

<button onclick="addShot()">+ Shot</button>
<button onclick="removeShot()">- Shot</button>

<script>
// --- MAP ---
var map = L.map('map').setView([51.505, -0.09], 15);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

var marker = L.marker([51.505, -0.09]).addTo(map);

// --- SCORE ---
let score = 0;

function addShot() {
  score++;
  document.getElementById("score").innerText = "Score: " + score;
}

function removeShot() {
  score--;
  document.getElementById("score").innerText = "Score: " + score;
}

// --- GPS DISTANCE ---
if (navigator.geolocation) {
  navigator.geolocation.watchPosition(function(position) {
    let lat = position.coords.latitude;
    let lng = position.coords.longitude;

    marker.setLatLng([lat, lng]);
    map.setView([lat, lng]);

    let targetLat = 51.505;
    let targetLng = -0.09;

    let distance = getDistance(lat, lng, targetLat, targetLng);
    document.getElementById("distance").innerText = "Distance: " + Math.round(distance) + " m";

    // simple club suggestion
    let club = "Driver";
    if (distance < 150) club = "Iron";
    if (distance < 50) club = "Wedge";

    document.getElementById("club").innerText = "Club: " + club;
  });
}

// --- DISTANCE CALC ---
function getDistance(lat1, lon1, lat2, lon2) {
  let R = 6371000;
  let dLat = (lat2-lat1) * Math.PI/180;
  let dLon = (lon2-lon1) * Math.PI/180;

  let a =
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(lat1 * Math.PI/180) *
    Math.cos(lat2 * Math.PI/180) *
    Math.sin(dLon/2) * Math.sin(dLon/2);

  let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

  return R * c;
}
</script>

</body>
</html>
