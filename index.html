<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eagle AI Caddie</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
  margin:0;
  background:black;
  color:white;
  font-family:-apple-system;
  text-align:center;
}

#map {
  height:50vh;
  width:100%;
}

.info { font-size:20px; margin:5px; }
#score { font-size:40px; margin:10px; }

button {
  width:90%;
  padding:15px;
  margin:8px;
  border:none;
  border-radius:10px;
  background:limegreen;
  color:black;
  font-size:18px;
}
</style>
</head>

<body>

<h2>🏌️ Eagle AI Caddie</h2>

<div id="map"></div>

<div class="info" id="distance">Distance: --</div>
<div class="info" id="club">Club: --</div>
<div id="score">Score: 0</div>

<button onclick="startHole()">⛳ Start Hole</button>
<button onclick="addShot()">+ Shot</button>

<script>
let map = L.map('map').setView([51.505, -0.09], 15);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

let userMarker = null;
let holeMarker = null;
let score = 0;

// 📍 LIVE GPS TRACKING (this is the key fix)
let watchId = navigator.geolocation.watchPosition(
  function(pos) {
    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    // Update map position
    map.setView([lat, lng], 17);

    if (!userMarker) {
      userMarker = L.marker([lat, lng]).addTo(map);
    } else {
      userMarker.setLatLng([lat, lng]);
    }

    // Update distance LIVE
    if (holeMarker) {
      let distance = map.distance(
        userMarker.getLatLng(),
        holeMarker.getLatLng()
      );

      document.getElementById("distance").innerText =
        "Distance: " + Math.round(distance) + " m";

      // Club logic
      let club = "Driver";
      if (distance < 200) club = "Iron";
      if (distance < 100) club = "Wedge";
      if (distance < 20) club = "Putter";

      document.getElementById("club").innerText =
        "Club: " + club;
    }
  },
  function(err) {
    alert("Location error: " + err.message);
  },
  {
    enableHighAccuracy: true,
    maximumAge: 0,
    timeout: 5000
  }
);
  // Move map with you
  map.setView([lat, lng], 17);

  // Update / create user marker
  if (!userMarker) {
    userMarker = L.marker([lat, lng]).addTo(map);
  } else {
    userMarker.setLatLng([lat, lng]);
  }

  // 🔥 Distance updates LIVE
  if (holeMarker) {
    let distance = map.distance(
      userMarker.getLatLng(),
      holeMarker.getLatLng()
    );

    document.getElementById("distance").innerText =
      "Distance: " + Math.round(distance) + " m";

    // Club logic
    let club = "Driver";
    if (distance < 200) club = "Iron";
    if (distance < 100) club = "Wedge";
    if (distance < 20) club = "Putter";

    document.getElementById("club").innerText =
      "Club: " + club;
  }

}, err => {
  alert("Turn on location services!");
});

// ⛳ Start hole (FIXED - no duplicate markers)
function startHole() {
  if (!userMarker) return;

  // Remove old hole if exists
  if (holeMarker) {
    map.removeLayer(holeMarker);
  }

  // Place hole slightly ahead of you (demo)
  let pos = userMarker.getLatLng();
  holeMarker = L.marker([pos.lat + 0.0005, pos.lng]).addTo(map);

  document.getElementById("distance").innerText = "Distance: --";
  document.getElementById("club").innerText = "Club: --";
}

// ➕ Shot tracking
function addShot() {
  score++;
  document.getElementById("score").innerText = "Score: " + score;
}
</script>

</body>
</html>
